[package]
  cjc-version = "1.1.0"
  name = "driver"
  organization = "cjcj"
  description = "Self-hosted Cangjie compiler Driver module"
  version = "0.1.0"
  target-dir = ""
  script-dir = ""
  src-dir = "src"
  output-type = "static"
  compile-option = ""
  override-compile-option = ""
  link-option = "runtime_shim/cjselfhost_llvmshim.o ${CANGJIE_HOME}/third_party/llvm/lib/libLLVM-15.so -lstdc++"
  package-configuration = {}

[dependencies]
  "cjcj::basic" = { path = "../basic" }
  "cjcj::frontend" = { path = "../frontend" }
  "cjcj::frontend_tool" = { path = "../frontend_tool" }
  "cjcj::macro_pkg" = { path = "../macro" }
  "cjcj::option" = { path = "../option" }
  "cjcj::utils" = { path = "../utils" }
