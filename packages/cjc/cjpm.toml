[package]
  cjc-version = "1.1.0"
  name = "cjc"
  description = "Self-hosted Cangjie compiler executable entry"
  version = "0.1.0"
  target-dir = ""
  script-dir = ""
  src-dir = "src"
  output-type = "executable"
  compile-option = ""
  override-compile-option = ""
  link-option = "runtime_shim/cjselfhost_llvmshim.o"
  package-configuration = {}

# ELF link inputs (in-process libLLVM-15.so, libstdc++, dynamic export) and the
# process-local heap default belong to the Linux compiler executable only.
# Public SDK retained names and direct CJPM installs use the same init calls.
[target.x86_64-unknown-linux-gnu]
  link-option = "--export-dynamic ${CANGJIE_HOME}/third_party/llvm/lib/libLLVM-15.so -lstdc++ runtime_shim/cjc_heap_defaults.o --wrap=CJ_MRT_CjRuntimeInit --wrap=CJ_MRT_CjRuntimeInitWithConfigV1"

[target.aarch64-unknown-linux-gnu]
  link-option = "--export-dynamic ${CANGJIE_HOME}/third_party/llvm/lib/libLLVM-15.so -lstdc++ runtime_shim/cjc_heap_defaults.o --wrap=CJ_MRT_CjRuntimeInit --wrap=CJ_MRT_CjRuntimeInitWithConfigV1"

# Mach-O link inputs: in-process libLLVM.dylib, libc++, exported symbols, an
# rpath to the SDK LLVM directory and header padding for install_name_tool.
[target.aarch64-apple-darwin]
  link-option = "-headerpad_max_install_names -export_dynamic ${CANGJIE_HOME}/third_party/llvm/lib/libLLVM.dylib -lc++ -rpath ${CANGJIE_HOME}/third_party/llvm/lib"

[target.x86_64-apple-darwin]
  link-option = "-headerpad_max_install_names -export_dynamic ${CANGJIE_HOME}/third_party/llvm/lib/libLLVM.dylib -lc++ -rpath ${CANGJIE_HOME}/third_party/llvm/lib"

[dependencies]
  "cjcj::driver" = { path = "../driver" }
  "cjcj::utils" = { path = "../utils" }
  "cjcj::frontend" = { path = "../frontend" }
  "cjcj::chir" = { path = "../chir" }
  "cjcj::basic" = { path = "../basic" }
