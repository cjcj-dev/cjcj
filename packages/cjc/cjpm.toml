[package]
  cjc-version = "1.1.0"
  name = "cjc"
  organization = "cjcj"
  description = "Self-hosted Cangjie compiler executable entry"
  version = "0.1.0"
  target-dir = ""
  script-dir = ""
  src-dir = "src"
  output-type = "executable"
  compile-option = ""
  override-compile-option = ""
  link-option = "--export-dynamic runtime_shim/cjselfhost_llvmshim.o runtime_shim/cjc_runtime_config.o -lLLVM-15 -lstdc++ -rpath $ORIGIN/../runtime/lib/linux_x86_64_cjnative -rpath $ORIGIN/../third_party/llvm/lib -rpath $ORIGIN/../tools/lib"
  package-configuration = {}

[dependencies]
  "cjcj::driver" = { path = "../driver" }
  "cjcj::utils" = { path = "../utils" }
  "cjcj::frontend" = { path = "../frontend" }
  "cjcj::chir" = { path = "../chir" }
  "cjcj::basic" = { path = "../basic" }
