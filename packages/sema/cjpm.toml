[package]
  cjc-version = "1.1.0"
  name = "sema"
  organization = "cjcj"
  description = "Self-hosted Cangjie compiler Sema module scaffold"
  version = "0.1.0"
  target-dir = ""
  script-dir = ""
  src-dir = "src"
  output-type = "static"
  compile-option = ""
  override-compile-option = ""
  link-option = "runtime_shim/cjselfhost_llvmshim.o ${CANGJIE_HOME}/third_party/llvm/lib/libLLVM-15.so -lstdc++"
  package-configuration = {}

[dependencies]
  "cjcj::ast" = { path = "../ast" }
  "cjcj::basic" = { path = "../basic" }
  "cjcj::incremental_compilation" = { path = "../incremental_compilation" }
  "cjcj::mangle" = { path = "../mangle" }
  "cjcj::macro_pkg" = { path = "../macro" }
  "cjcj::modules" = { path = "../modules" }
  "cjcj::option" = { path = "../option" }
  "cjcj::utils" = { path = "../utils" }

[test-dependencies]
  "cjcj::compiler_unittest" = { path = "../compiler_unittest" }
  "cjcj::driver" = { path = "../driver" }
  "cjcj::frontend" = { path = "../frontend" }
