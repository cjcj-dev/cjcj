name: Build release package

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      llvm_platform:
        required: true
        type: string
      sdk_runtime_dir:
        required: false
        type: string
        default: ''
      std_artifact:
        description: Same-platform source-built final std artifact
        required: true
        type: string
      cross_std_artifact:
        description: >-
          Source-built final std for a tuple this package can target but is not
          built on. Empty means the package targets only its own tuple.
        required: false
        type: string
        default: ''
      cross_std_tuple:
        description: Runtime tuple that cross_std_artifact fills (e.g. windows_x86_64_cjnative)
        required: false
        type: string
        default: ''
      version:
        required: true
        type: string
      verify:
        required: false
        type: boolean
        default: true
      dry_run:
        required: false
        type: boolean
        default: false
      runtime_ref:
        required: false
        type: string
        default: ''
    secrets:
      GITCODE_API_KEY:
        required: false

permissions:
  contents: read
  actions: read

env:
  CJCJ_TOOLCHAIN: nightly-1.2.0-alpha.20260721165458
  CJ_HEAP_SIZE: ${{ inputs.platform == 'darwin-arm64' && '6GB' || '12GB' }}

jobs:
  package:
    name: ${{ inputs.platform }} / Build release package
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    env:
      MATRIX_RUNNER: ${{ inputs.runner }}
      SDK_RUNTIME_DIR: ${{ inputs.sdk_runtime_dir }}
      FINAL_STD_DIR: ${{ github.workspace }}/.release-final-std/${{ inputs.platform }}
      CROSS_STD_DIR: ${{ github.workspace }}/.release-cross-std/${{ inputs.platform }}
      CROSS_STD_TUPLE: ${{ inputs.cross_std_tuple }}
      PYTHON_BUNDLE_DIR: ${{ github.workspace }}/.release-python/${{ inputs.platform }}/bundle
      RELEASE_PLATFORM: ${{ inputs.platform }}
      SOURCE_CJPM_DIR: ${{ github.workspace }}/.release-cjpm/${{ inputs.platform }}
      SOURCE_HLE_DIR: ${{ github.workspace }}/.release-hle/${{ inputs.platform }}
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Validate same-platform final std contract
        shell: bash
        env:
          EXPECTED_STD_ARTIFACT: final-std-${{ inputs.platform }}
          SELECTED_STD_ARTIFACT: ${{ inputs.std_artifact }}
        run: |
          set -euo pipefail
          test "$SELECTED_STD_ARTIFACT" = "$EXPECTED_STD_ARTIFACT"

      - name: Download same-platform source-built final std
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.std_artifact }}
          path: ${{ env.FINAL_STD_DIR }}

      - name: Download cross-tuple source-built final std
        if: inputs.cross_std_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.cross_std_artifact }}
          path: ${{ env.CROSS_STD_DIR }}

      - name: Download same-platform source-built cjpm
        if: runner.os != 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: source-cjpm-${{ inputs.platform }}
          path: ${{ env.SOURCE_CJPM_DIR }}

      - name: Download same-platform source-built hle
        if: runner.os != 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: source-hle-${{ inputs.platform }}
          path: ${{ env.SOURCE_HLE_DIR }}

      - name: Test release build helpers
        if: inputs.platform == 'linux-x64'
        run: node --test build/test/runtime-pin.test.mjs

      - name: Load and validate runtime pin
        shell: bash
        env:
          CJCJ_RUNTIME_REF_OVERRIDE: ${{ inputs.runtime_ref }}
          CJCJ_ALLOW_RUNTIME_OVERRIDE: ${{ inputs.dry_run && inputs.runtime_ref != '' }}
        run: npx --yes zx@8 ci/load_runtime_pin.mjs

      - name: Load LLVM provenance pin
        shell: bash
        run: cat ci/llvm_pin.env >> "$GITHUB_ENV"

      - name: Retain exact official base SDK archive
        shell: bash
        run: |
          node ci/release/prepare_base_sdk.mjs \
            --platform "$RELEASE_PLATFORM" \
            --toolchain "$CJCJ_TOOLCHAIN" \
            --outdir "$RUNNER_TEMP/release-base-sdk"

      - name: Prepare MSYS2/MINGW64 cjcj toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          path-type: inherit
          install: >-
            git make python gzip unzip file binutils
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-compiler-rt
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libc++
            mingw-w64-x86_64-libunwind
            mingw-w64-x86_64-ninja

      - name: Download cross-built Windows runtime
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: runtime-install-windows_x86_64
          path: .platform-ci/runtime-install/windows_release_x86_64

      - name: Verify cross-built Windows runtime
        if: runner.os == 'Windows'
        run: npx --yes zx@8 ci/platform_matrix/verify_windows_runtime_exports.mjs

      - name: Download current-run fixed LLVM tuple (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: fixed-llvm-tools-${{ inputs.llvm_platform }}
          path: ${{ runner.temp }}/current-run-fixed-llvm

      - name: Download native fixed LLVM tuple (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          TUPLE_ARTIFACT_DIR: ${{ runner.temp }}/current-run-fixed-llvm
        run: npx --yes zx@8 ci/platform_matrix/fetch_llvm_tuple.mjs

      - name: Official SDK provision (Windows)
        if: runner.os == 'Windows'
        env:
          CJCJ_SDK_PROVISION_ONLY: '1'
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
        run: npx --yes zx@8 ci/platform_matrix/build_cjcj.mjs

      - name: Download current-run patched cjpm
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: patched-cjpm-windows_x86_64
          path: ${{ runner.temp }}/current-run-patched-cjpm

      - name: Install patched cjpm (Windows)
        id: fetch-cjpm
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          CJPM_ARTIFACT_DIR: ${{ runner.temp }}/current-run-patched-cjpm
        run: npx --yes zx@8 ci/platform_matrix/fetch_cjpm.mjs

      - name: Build cjcj (Windows)
        if: runner.os == 'Windows' && steps.fetch-cjpm.outcome == 'success'
        env:
          CJCJ_SDK_ALREADY_PROVISIONED: '1'
        run: npx --yes zx@8 ci/platform_matrix/build_cjcj.mjs

      - name: Download LLVM tools (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v8
        with:
          name: fixed-llvm-tools-${{ inputs.llvm_platform }}
          path: fixed-toolchain/${{ inputs.llvm_platform }}

      - name: Restore SDK cache
        if: runner.os != 'Windows'
        id: sdkcache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CJCJ_TOOLCHAIN }}

      - name: Install SDK (Linux)
        id: setup
        if: runner.os == 'Linux'
        env:
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
          FIXED_LLC_GZ: ${{ github.workspace }}/fixed-toolchain/${{ inputs.llvm_platform }}/llc.gz
          FIXED_OPT_GZ: ${{ github.workspace }}/fixed-toolchain/${{ inputs.llvm_platform }}/opt.gz
        run: npx --yes zx@8 ci/setup_sdk.mjs

      - name: Save SDK cache (Linux)
        if: runner.os == 'Linux' && steps.setup.outcome == 'success' && steps.sdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CJCJ_TOOLCHAIN }}

      - name: Restore runtime cache
        if: runner.os != 'Windows'
        id: rtcache
        uses: actions/cache/restore@v6
        with:
          path: dist-runtime
          key: rt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner }}-${{ env.RUNTIME_REF }}-${{ inputs.version }}-${{ hashFiles('ci/build_patched_runtime.mjs') }}

      - name: Install packaging dependency (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            binutils build-essential libssl-dev zlib1g-dev libffi-dev libbz2-dev \
            liblzma-dev libreadline-dev libsqlite3-dev libncurses-dev uuid-dev tk-dev

      - name: Install runtime build dependencies (Linux)
        if: runner.os == 'Linux' && steps.rtcache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y -qq clang cmake make

      - name: Build pinned runtime
        if: runner.os != 'Windows' && steps.rtcache.outputs.cache-hit != 'true'
        env:
          RUNTIME_VERSION: ${{ inputs.version }}
        run: npx --yes zx@8 ci/build_patched_runtime.mjs "$PWD/dist-runtime"

      - name: Save runtime cache
        if: runner.os != 'Windows' && steps.rtcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist-runtime
          key: rt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner }}-${{ env.RUNTIME_REF }}-${{ inputs.version }}-${{ hashFiles('ci/build_patched_runtime.mjs') }}

      - name: Download native fixed LLVM tuple (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: fixed-llvm-tools-${{ inputs.llvm_platform }}
          path: ${{ runner.temp }}/current-run-fixed-llvm

      - name: Install native fixed LLVM tuple (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          TUPLE_ARTIFACT_DIR: ${{ runner.temp }}/current-run-fixed-llvm
        run: npx --yes zx@8 ci/platform_matrix/fetch_llvm_tuple.mjs

      - name: Official SDK + cjcj build (macOS)
        id: darwinbuild
        if: runner.os == 'macOS'
        env:
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
        run: npx --yes zx@8 ci/platform_matrix/build_cjcj.mjs

      - name: Save SDK cache (macOS)
        if: runner.os == 'macOS' && steps.darwinbuild.outcome == 'success' && steps.sdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CJCJ_TOOLCHAIN }}

      - name: Capture acceptance gate apparatus (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node ci/release/prepare_gate_apparatus.mjs \
            --sdk "$CANGJIE_HOME" \
            --platform "$RELEASE_PLATFORM" \
            --toolchain-pin "$PWD/ci/cjpm_pin.env" \
            --base-sdk-sidecar "$BASE_SDK_PROVENANCE" \
            --outdir "$RUNNER_TEMP/release-gate-apparatus"

      - name: Capture acceptance gate apparatus (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node ci/release/prepare_gate_apparatus.mjs `
            --sdk "$env:CANGJIE_HOME" `
            --platform "$env:RELEASE_PLATFORM" `
            --toolchain-pin "$PWD\ci\cjpm_pin.env" `
            --base-sdk-sidecar "$env:BASE_SDK_PROVENANCE" `
            --outdir "$env:RUNNER_TEMP\release-gate-apparatus"

      - name: Activate pinned runtime
        if: runner.os != 'Windows'
        run: npx --yes zx@8 ci/install_patched_runtime.mjs "$PWD/dist-runtime"

      - name: Build runtime shim (Linux)
        if: runner.os == 'Linux'
        env:
          CJCJ_LLVM_SHIM_O: ${{ github.workspace }}/fixed-toolchain/${{ inputs.llvm_platform }}/cjselfhost_llvmshim.o
        run: npx --yes zx@8 runtime_shim/build_shim.mjs

      - name: Build workspace (Linux)
        if: runner.os == 'Linux'
        run: cjpm build

      - name: Install source-built cjpm (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node ci/release/install_cjpm_artifact.mjs \
            --platform "$RELEASE_PLATFORM" \
            --artifact "$SOURCE_CJPM_DIR" \
            --sdk "$CANGJIE_HOME"

      - name: Install source-built hle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node ci/release/install_hle_artifact.mjs \
            --platform "$RELEASE_PLATFORM" \
            --artifact "$SOURCE_HLE_DIR" \
            --sdk "$CANGJIE_HOME"

      - name: Prepare Python 3.11 bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: node ci/release/prepare_python_bundle.mjs "${{ inputs.platform }}" "$PYTHON_BUNDLE_DIR"

      - name: Prepare Python 3.11 bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node ci/release/prepare_python_bundle.mjs "${{ inputs.platform }}" "$env:PYTHON_BUNDLE_DIR"

      - name: Compose SDK package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          runtime_lib="$PWD/dist-runtime/libcangjie-runtime.so"
          if [ "$RUNNER_OS" = "macOS" ]; then runtime_lib="$PWD/dist-runtime/libcangjie-runtime.dylib"; fi
          llvm_manifest="${FIXED_LLVM_MANIFEST:-$PWD/fixed-toolchain/${{ inputs.llvm_platform }}/llvm-tools.manifest}"
          # Two words when a cross tuple is configured, zero when not. Plain string
          # rather than an array: macOS runners still ship bash 3.2, where "${a[@]}"
          # on an empty array is an unbound-variable error under set -u.
          cross_std_arg=""
          if [ -n "${CROSS_STD_TUPLE:-}" ]; then
            cross_std_arg="--cross-std-dir ${CROSS_STD_TUPLE}=${CROSS_STD_DIR}"
          fi
          # shellcheck disable=SC2086
          npx --yes zx@8 scripts/package_sdk.mjs \
            $cross_std_arg \
            --sdk "$CANGJIE_HOME" \
            --binary "$PWD/target/release/bin/cjcj::cjc" \
            --runtime-lib "$runtime_lib" \
            --std-dir "$FINAL_STD_DIR" \
            --llvm-manifest "$llvm_manifest" \
            --base-sdk-id "$CJCJ_TOOLCHAIN" \
            --base-sdk-archive "$BASE_SDK_ARCHIVE" \
            --base-sdk-provenance "$BASE_SDK_PROVENANCE" \
            --gate-host-runtime "$GATE_HOST_RUNTIME" \
            --gate-apparatus-provenance "$GATE_APPARATUS_PROVENANCE" \
            --cjcj-source-repo "${{ github.server_url }}/${{ github.repository }}.git" \
            --cjcj-source-sha "${{ github.sha }}" \
            --runtime-source-repo "$RUNTIME_SRC_URL" \
            --runtime-source-sha "$RUNTIME_REF" \
            --llvm-source-repo "$LLVM_URL" \
            --std-source-repo "$RUNTIME_SRC_URL" \
            --cjpm-provenance "$CJPM_PROVENANCE" \
            --cjpm-source-repo "$CJPM_SOURCE_REPOSITORY" \
            --cjpm-source-sha "$CJPM_SOURCE_COMMIT" \
            --python-bundle "$PYTHON_BUNDLE_DIR" \
            --version "${{ inputs.version }}" \
            --platform "${{ inputs.platform }}" \
            --outdir "$PWD/dist"

      - name: Compose SDK package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The patched cjpm names the product cjc@cjcj.exe (swapOrgName); the
          # retired lld wrapper era produced cjcj.exe — probe both, newest wins.
          $binary = @("$PWD\target\release\bin\cjc@cjcj.exe", "$PWD\target\release\bin\cjcj.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $binary) { Write-Error "no cjcj product under target\release\bin"; exit 1 }
          npx --yes zx@8 scripts/package_sdk.mjs `
            --sdk "$env:CANGJIE_HOME" `
            --binary "$binary" `
            --runtime-root "$PWD\.platform-ci\runtime-install\windows_release_x86_64" `
            --std-dir "$env:FINAL_STD_DIR" `
            --llvm-manifest "$env:FIXED_LLVM_MANIFEST" `
            --base-sdk-id "$env:CJCJ_TOOLCHAIN" `
            --base-sdk-archive "$env:BASE_SDK_ARCHIVE" `
            --base-sdk-provenance "$env:BASE_SDK_PROVENANCE" `
            --gate-host-runtime "$env:GATE_HOST_RUNTIME" `
            --gate-apparatus-provenance "$env:GATE_APPARATUS_PROVENANCE" `
            --cjcj-source-repo "${{ github.server_url }}/${{ github.repository }}.git" `
            --cjcj-source-sha "${{ github.sha }}" `
            --runtime-source-repo "$env:RUNTIME_SRC_URL" `
            --runtime-source-sha "$env:RUNTIME_REF" `
            --llvm-source-repo "$env:LLVM_URL" `
            --std-source-repo "$env:RUNTIME_SRC_URL" `
            --cjpm-provenance "$env:CJPM_PROVENANCE" `
            --cjpm-source-repo "$env:CJPM_SOURCE_REPOSITORY" `
            --cjpm-source-sha "$env:CJPM_SOURCE_COMMIT" `
            --python-bundle "$env:PYTHON_BUNDLE_DIR" `
            --version "${{ inputs.version }}" `
            --platform "${{ inputs.platform }}" `
            --outdir "$PWD\dist"

      - name: Verify packaged SDK
        if: inputs.verify && runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          pkg="cjcj-${{ inputs.version }}-${{ inputs.platform }}"
          mkdir -p pkgtest
          tar -C pkgtest -xzf "dist/${pkg}.tar.gz"
          # shellcheck disable=SC1090
          source "$PWD/pkgtest/${pkg}/envsetup.sh"
          export cjHeapSize=12GB
          work="$RUNNER_TEMP/release-smoke"
          # An EXIT trap deleted both of these whatever happened, so a smoke
          # failure took its own evidence with it and the diagnosis upload below
          # would find an empty tree. Clean up only on success, which is what the
          # Windows branch already does.
          trap 'echo "preserving failed Unix smoke: work=$work package=$PWD/pkgtest"' EXIT
          node scripts/verify_packaged_cjdb.mjs "$PWD/pkgtest/${pkg}"
          npx --yes zx@8 ci/smoke/run_smoke.mjs "$PWD/pkgtest/${pkg}/bin/cjc" "$work"
          trap - EXIT
          rm -rf "$work" pkgtest

      - name: Verify packaged SDK (Windows)
        if: inputs.verify && runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "cjcj-${{ inputs.version }}-${{ inputs.platform }}"
          $extract = Join-Path $PWD 'pkgtest'
          $work = Join-Path $env:RUNNER_TEMP 'release-smoke'
          $smokeExit = 1
          try {
            Expand-Archive -LiteralPath "dist\$pkg.zip" -DestinationPath $extract -Force
            $root = Join-Path $extract $pkg
            $env:CJCJ_OFFICIAL_SDK_HOME = $env:CANGJIE_HOME
            $env:CANGJIE_HOME = $root
            $env:cjHeapSize = '12GB'
            $env:PATH = "$root\bin;$root\runtime\lib\windows_x86_64_cjnative;$root\tools\lib;$env:PATH"
            node scripts/verify_packaged_cjdb.mjs $root
            if ($LASTEXITCODE -ne 0) { throw "packaged cjdb verification failed: $LASTEXITCODE" }
            npx --yes zx@8 ci/smoke/run_smoke.mjs "$root\bin\cjc.exe" $work
            $smokeExit = $LASTEXITCODE
          } finally {
            if ($smokeExit -eq 0) {
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $work, $extract
            } else {
              Write-Host "preserving failed Windows smoke: work=$work package=$extract"
            }
          }
          if ($smokeExit -ne 0) { exit $smokeExit }

      # The pkg-* upload below only runs once everything before it succeeded, so a
      # cell that dies leaves nothing behind to look at. srcbuild has carried a
      # failure-only upload since srcbuild.yml's stage diagnostics; this is the
      # package side of the same idea, named per platform so no two cells collide.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pkg-diagnosis-${{ inputs.platform }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            dist/*.sha256
            dist/RELEASE-MANIFEST.jsonl
            pkgtest/**/PROVENANCE.txt
            pkgtest/**/*.log
            ${{ runner.temp }}/release-smoke/**

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ inputs.platform }}
          path: |
            dist/cjcj-${{ inputs.version }}-${{ inputs.platform }}.tar.gz
            dist/cjcj-${{ inputs.version }}-${{ inputs.platform }}.tar.gz.sha256
            dist/cjcj-${{ inputs.version }}-${{ inputs.platform }}.zip
            dist/cjcj-${{ inputs.version }}-${{ inputs.platform }}.zip.sha256
            dist/cjcj-${{ inputs.version }}-${{ inputs.platform }}.RELEASE-MANIFEST.jsonl
          if-no-files-found: error
          retention-days: 90
