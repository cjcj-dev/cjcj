name: Build release package

on:
  workflow_call:
    inputs:
      native_source_selection:
        required: false
        type: string
        default: '{}'
      native_llvm_ref:
        required: false
        type: string
        default: ''
      native_runtime_ref:
        required: false
        type: string
        default: ''
      native_host_version:
        required: false
        type: string
        default: ''
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      llvm_platform:
        required: true
        type: string
      sdk_runtime_dir:
        description: Expected runtime tuple, checked against the selected native target
        required: true
        type: string
      std_artifact:
        description: Same-platform source-built final std artifact
        required: true
        type: string
      release_key:
        description: Official release package key; empty retains the host package name
        required: false
        type: string
        default: ''
      cross_std_artifacts:
        description: JSON array of tuple/artifact pairs from the source cells
        required: false
        type: string
        default: '[]'
      cross_std_artifact:
        description: Legacy single cross std artifact; normalized into the tuple list
        required: false
        type: string
        default: ''
      cross_std_tuple:
        description: Legacy single cross std tuple
        required: false
        type: string
        default: ''
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
      runtime_ref:
        required: false
        type: string
        default: ''
    secrets:
      GITCODE_API_KEY:
        required: false

permissions:
  contents: read
  actions: read

# Whole native SDKs are produced by srcbuild-target's package-install step.
# Component artifacts below are comparison inputs only, never install overlays.
jobs:
  package:
    name: ${{ inputs.platform }} / Build release package
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    env:
      CJCJ_NATIVE_LLVM_REF: ${{ inputs.native_llvm_ref }}
      CJCJ_NATIVE_RUNTIME_REF: ${{ inputs.native_runtime_ref }}
      CJCJ_NATIVE_HOST_VERSION: ${{ inputs.native_host_version }}
      CJCJ_NATIVE_SOURCE_SELECTION: ${{ inputs.native_source_selection }}
      RELEASE_LLVM_PLATFORM: ${{ inputs.llvm_platform }}
      RELEASE_RUNTIME_TUPLE: ${{ inputs.sdk_runtime_dir }}
      RELEASE_PLATFORM: ${{ inputs.platform }}
      RELEASE_KEY: ${{ inputs.release_key }}
      CJCJ_NATIVE_SDK_VERSION: ${{ inputs.version }}
      CJCJ_RELEASE_SOURCE_SHA: ${{ github.sha }}
      NATIVE_SDK_ARTIFACT_DIR: ${{ github.workspace }}/.release-native/input
      NATIVE_SDK_INSTALL_DIR: ${{ github.workspace }}/.release-native/install-${{ github.run_attempt }}
      FINAL_STD_DIR: ${{ github.workspace }}/.release-final-std/${{ inputs.platform }}
      CROSS_STD_DIR: ${{ github.workspace }}/.release-cross-std/${{ inputs.platform }}
      CROSS_STD_ARTIFACTS: ${{ inputs.cross_std_artifacts }}
      CROSS_STD_ARTIFACT: ${{ inputs.cross_std_artifact }}
      CROSS_STD_TUPLE: ${{ inputs.cross_std_tuple }}
      RELEASE_DIST: ${{ github.workspace }}/dist
      CJ_HEAP_SIZE: ${{ inputs.platform == 'darwin-arm64' && '6GB' || '12GB' }}
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'

      - name: Resolve archive identity independently of host toolchain
        run: node ci/release/package-key.mjs

      - name: Load and validate runtime pin
        env:
          CJCJ_RUNTIME_REF_OVERRIDE: ${{ inputs.runtime_ref }}
          CJCJ_NATIVE_LLVM_REF: ${{ inputs.native_llvm_ref }}
          CJCJ_NATIVE_RUNTIME_REF: ${{ inputs.native_runtime_ref }}
          CJCJ_NATIVE_HOST_VERSION: ${{ inputs.native_host_version }}
          CJCJ_ALLOW_RUNTIME_OVERRIDE: ${{ inputs.dry_run && inputs.runtime_ref != '' }}
        run: npx --yes zx@8 ci/load_runtime_pin.mjs

      - name: Download complete native SDK
        uses: actions/download-artifact@v8
        with:
          name: cjcj-srcbuild-${{ inputs.platform }}-${{ inputs.version }}
          path: ${{ env.NATIVE_SDK_ARTIFACT_DIR }}

      - name: Validate same-platform final std contract
        shell: bash
        env:
          EXPECTED_STD_ARTIFACT: ${{ inputs.platform == 'windows-x64' && inputs.native_llvm_ref != '' && 'final-std-native-windows-x64' || format('final-std-{0}', inputs.platform) }}
          SELECTED_STD_ARTIFACT: ${{ inputs.std_artifact }}
        run: |
          set -euo pipefail
          test "$SELECTED_STD_ARTIFACT" = "$EXPECTED_STD_ARTIFACT"

      - name: Download same-platform source-built final std
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.std_artifact }}
          path: ${{ env.FINAL_STD_DIR }}

      - name: Download cross-tuple comparison inputs
        if: inputs.cross_std_artifacts != '[]' || inputs.cross_std_artifact != ''
        uses: actions/download-artifact@v8
        with:
          pattern: final-std-*
          path: ${{ env.CROSS_STD_DIR }}

      # Mandatory for normal and dry-run candidates, on every native runner:
      # archive SHA -> source/target/tool bytes -> std/cross/stdx -> ABI ->
      # installed language/ordinary/macros -> cjdb/Python -> smoke -> same
      # directory archive -> original path hidden -> all consumers again.
      - name: Consume and rearchive complete native SDK
        run: node ci/release/compose-package.mjs

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pkg-diagnosis-${{ env.PACKAGE_KEY }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            dist/**/*.json
            dist/**/*.jsonl
            dist/**/*.log
            .platform-ci/installed-sdk-check/**
            .release-native/install-${{ github.run_attempt }}/cangjie/BUILD-MANIFEST.json

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ env.PACKAGE_KEY }}
          path: |
            dist/cjcj-${{ inputs.version }}-${{ env.PACKAGE_KEY }}.tar.gz
            dist/cjcj-${{ inputs.version }}-${{ env.PACKAGE_KEY }}.tar.gz.sha256
            dist/cjcj-${{ inputs.version }}-${{ env.PACKAGE_KEY }}.zip
            dist/cjcj-${{ inputs.version }}-${{ env.PACKAGE_KEY }}.zip.sha256
            dist/cjcj-${{ inputs.version }}-${{ env.PACKAGE_KEY }}.RELEASE-MANIFEST.jsonl
            dist/cjcj-${{ inputs.version }}-${{ env.PACKAGE_KEY }}.SHA256SUMS
          if-no-files-found: error
          retention-days: 90
