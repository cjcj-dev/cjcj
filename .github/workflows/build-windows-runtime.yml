name: Build Windows runtime

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: 1.2.0-alpha.20260721165458
      toolchain:
        description: Official Cangjie toolchain supplying the std-ast link inputs
        required: false
        type: string
        default: nightly-1.2.0-alpha.20260721165458
      dry_run:
        required: false
        type: boolean
        default: false
      runtime_ref:
        required: false
        type: string
        default: ''
      nongating:
        description: Allow a manual corpus caller to record failures without setting a failing workflow conclusion
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-runtime:
    name: windows-x64 / Cross-build runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    continue-on-error: ${{ inputs.nongating }}
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Load runtime pin
        env:
          CJCJ_RUNTIME_REF_OVERRIDE: ${{ inputs.runtime_ref }}
          CJCJ_ALLOW_RUNTIME_OVERRIDE: ${{ inputs.dry_run && inputs.runtime_ref != '' }}
        run: npx --yes zx@8 ci/load_runtime_pin.mjs

      - name: Checkout pinned runtime
        uses: actions/checkout@v7
        with:
          repository: cjcj-dev/cangjie-runtime
          ref: ${{ env.RUNTIME_REF }}
          fetch-depth: 1
          path: runtime-source

      - name: Restore official MinGW toolchain
        id: mingw-cache
        uses: actions/cache/restore@v6
        with:
          path: .windows-runtime-buildtools/llvm-mingw-w64
          key: windows-runtime-toolchain-20220906-5c68a1cb123161b54b72ce90e7975d95a8eaf2a4-feea9a87fa42591b298b18fe0e07198f0b8c2f63-${{ hashFiles('build/toolchain/mingw.mjs', 'build/lib/archive.mjs', 'build/lib/runner.mjs') }}

      - name: Install toolchain build dependencies
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        run: npx --yes zx@8 build/cli.mjs --target windows-x64 install-system-deps

      - name: Build official MinGW toolchain
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        run: npx --yes zx@8 build/cli.mjs --target windows-x64 --build-root "$GITHUB_WORKSPACE/.windows-runtime-buildtools" install-mingw

      - name: Save official MinGW toolchain
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .windows-runtime-buildtools/llvm-mingw-w64
          key: ${{ steps.mingw-cache.outputs.cache-primary-key }}

      - name: Cross-build pinned Windows runtime
        env:
          RUNTIME_TARGET: windows-x86_64
          RUNTIME_TOOLCHAIN: ${{ github.workspace }}/.windows-runtime-buildtools/llvm-mingw-w64
          RUNTIME_VERSION: ${{ inputs.version }}
        run: npx --yes zx@8 ci/platform_matrix/build_runtime.mjs

      - name: Restore Cangjie toolchain
        id: cjv-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cjv
          key: windows-stdast-cjv-${{ inputs.toolchain }}

      - name: Install Cangjie toolchain
        if: steps.cjv-cache.outputs.cache-hit != 'true'
        env:
          CJCJ_TOOLCHAIN: ${{ inputs.toolchain }}
          CJCJ_SDK_LINK_INPUTS_ONLY: '1'
        run: npx --yes zx@8 ci/setup_sdk.mjs

      - name: Save Cangjie toolchain
        if: steps.cjv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cjv
          key: ${{ steps.cjv-cache.outputs.cache-primary-key }}

      - name: Restore flatc
        id: flatc-cache
        uses: actions/cache/restore@v6
        with:
          path: .windows-stdast-buildtools/flatc
          key: windows-stdast-flatc-${{ hashFiles('ci/runtime_pin.env') }}

      - name: Rebuild host-dispatch std-ast DLL
        env:
          RUNTIME_TOOLCHAIN: ${{ github.workspace }}/.windows-runtime-buildtools/llvm-mingw-w64
          CJCJ_TOOLCHAIN: ${{ inputs.toolchain }}
        run: CANGJIE_HOME="$HOME/.cjv/toolchains/$CJCJ_TOOLCHAIN" npx --yes zx@8 ci/platform_matrix/build_windows_std_ast.mjs

      - name: Save flatc
        if: steps.flatc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .windows-stdast-buildtools/flatc
          key: ${{ steps.flatc-cache.outputs.cache-primary-key }}

      - name: Download Linux fixed LLC for sticky std
        id: fixed-llc
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: fixed-llvm-tools-linux_x86_64
          path: fixed-toolchain/linux_x86_64

      - name: Install full official SDK with sticky LLC
        if: steps.fixed-llc.outcome == 'success'
        env:
          CJCJ_TOOLCHAIN: ${{ inputs.toolchain }}
          FIXED_LLC_GZ: ${{ github.workspace }}/fixed-toolchain/linux_x86_64/llc.gz
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
        run: npx --yes zx@8 ci/setup_sdk.mjs

      - name: Build Windows sticky std closure
        if: steps.fixed-llc.outcome == 'success'
        env:
          RUNTIME_TOOLCHAIN: ${{ github.workspace }}/.windows-runtime-buildtools/llvm-mingw-w64
          CJCJ_STICKY_TARGET_LIB: ${{ github.workspace }}/.platform-ci/runtime-install/windows_release_x86_64/runtime/lib/windows_x86_64_cjnative
        run: |
          # CANGJIE_HOME is exported by the sticky-LLC setup_sdk step via GITHUB_ENV.
          test -n "$CANGJIE_HOME"
          test -f "$CANGJIE_HOME/third_party/llvm/bin/llc"
          "$CANGJIE_HOME/third_party/llvm/bin/llc" --help-hidden | grep -q cjcj-sticky-logged-map
          test -d "$CJCJ_STICKY_TARGET_LIB"
          npx --yes zx@8 ci/build_std_variants.mjs \
            --sdk "$CANGJIE_HOME" \
            --outdir "$PWD/dist-sticky-std-windows" \
            --target windows-x64 \
            --target-toolchain "$RUNTIME_TOOLCHAIN" \
            --target-lib "$CJCJ_STICKY_TARGET_LIB"

      - name: Upload Windows sticky std closure
        if: steps.fixed-llc.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: sticky-std-windows_x86_64
          path: dist-sticky-std-windows
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v7
        with:
          name: runtime-install-windows_x86_64
          path: .platform-ci/runtime-install/windows_release_x86_64
          if-no-files-found: error
          retention-days: 7

      - name: Verify official Windows runtime ABI
        run: npx --yes zx@8 ci/platform_matrix/verify_windows_runtime_exports.mjs
