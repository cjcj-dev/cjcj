name: Build Windows runtime

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: 1.2.0-alpha.20260721165458
      dry_run:
        required: false
        type: boolean
        default: false
      runtime_ref:
        required: false
        type: string
        default: ''
      nongating:
        description: Allow a manual corpus caller to record failures without setting a failing workflow conclusion
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-runtime:
    name: windows-x64 / Cross-build runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    continue-on-error: ${{ inputs.nongating }}
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Load host toolchain pin
        shell: bash
        run: cat ci/cjpm_pin.env >> "$GITHUB_ENV"

      - name: Load runtime pin
        env:
          CJCJ_RUNTIME_REF_OVERRIDE: ${{ inputs.runtime_ref }}
          CJCJ_ALLOW_RUNTIME_OVERRIDE: ${{ inputs.dry_run && inputs.runtime_ref != '' }}
        run: npx --yes zx@8 ci/load_runtime_pin.mjs

      - name: Checkout pinned runtime
        uses: actions/checkout@v7
        with:
          repository: cjcj-dev/cangjie-runtime
          ref: ${{ env.RUNTIME_REF }}
          fetch-depth: 1
          path: runtime-source

      - name: Restore official MinGW toolchain
        id: mingw-cache
        uses: actions/cache/restore@v6
        with:
          path: .windows-runtime-buildtools/llvm-mingw-w64
          key: windows-runtime-toolchain-20220906-5c68a1cb123161b54b72ce90e7975d95a8eaf2a4-feea9a87fa42591b298b18fe0e07198f0b8c2f63-${{ hashFiles('build/toolchain/mingw.mjs', 'build/lib/archive.mjs', 'build/lib/runner.mjs') }}

      - name: Install toolchain build dependencies
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        run: npx --yes zx@8 build/cli.mjs --target windows-x64 install-system-deps

      - name: Build official MinGW toolchain
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        run: npx --yes zx@8 build/cli.mjs --target windows-x64 --build-root "$GITHUB_WORKSPACE/.windows-runtime-buildtools" install-mingw

      - name: Save official MinGW toolchain
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .windows-runtime-buildtools/llvm-mingw-w64
          key: ${{ steps.mingw-cache.outputs.cache-primary-key }}

      # actions/cache 6.1.0 does not retry HTTP 429 reservations. Confirm that
      # the product cache became visible, then retry once beyond the observed
      # three-second rate-limit window without rebuilding the toolchain.
      - name: Verify official MinGW toolchain cache save
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        id: mingw-cache-probe
        uses: actions/cache/restore@v6
        with:
          path: .windows-runtime-buildtools/llvm-mingw-w64
          key: ${{ steps.mingw-cache.outputs.cache-primary-key }}
          lookup-only: true

      - name: Back off before retrying official MinGW toolchain cache save
        if: steps.mingw-cache.outputs.cache-hit != 'true' && steps.mingw-cache-probe.outputs.cache-hit != 'true'
        run: sleep 5

      - name: Retry official MinGW toolchain cache save
        if: steps.mingw-cache.outputs.cache-hit != 'true' && steps.mingw-cache-probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .windows-runtime-buildtools/llvm-mingw-w64
          key: ${{ steps.mingw-cache.outputs.cache-primary-key }}

      - name: Verify retried official MinGW toolchain cache save
        if: steps.mingw-cache.outputs.cache-hit != 'true' && steps.mingw-cache-probe.outputs.cache-hit != 'true'
        id: mingw-cache-retry-probe
        uses: actions/cache/restore@v6
        with:
          path: .windows-runtime-buildtools/llvm-mingw-w64
          key: ${{ steps.mingw-cache.outputs.cache-primary-key }}
          lookup-only: true

      - name: Report official MinGW toolchain cache persistence
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FIRST_PROBE_HIT: ${{ steps.mingw-cache-probe.outputs.cache-hit }}
          RETRY_PROBE_HIT: ${{ steps.mingw-cache-retry-probe.outputs.cache-hit }}
        run: |
          if [[ "$FIRST_PROBE_HIT" == true || "$RETRY_PROBE_HIT" == true ]]; then
            echo "Official MinGW toolchain cache is visible for the exact primary key."
          else
            echo "::warning::Official MinGW toolchain cache is still absent after one bounded retry."
          fi

      # The MinGW cross runtime, AST support archive and std-ast object compile
      # through sccache; the report step fails this job if the launcher saw no compile.
      - name: Start sccache
        uses: ./.github/actions/sccache
        with:
          component: windows-runtime
          platform: windows_x86_64
          pin: ${{ env.RUNTIME_REF }}
          cache-size: 1G

      - name: Cross-build pinned Windows runtime
        env:
          RUNTIME_TARGET: windows-x86_64
          RUNTIME_TOOLCHAIN: ${{ github.workspace }}/.windows-runtime-buildtools/llvm-mingw-w64
          RUNTIME_VERSION: ${{ inputs.version }}
        run: npx --yes zx@8 ci/platform_matrix/build_runtime.mjs

      - name: Restore Cangjie toolchain
        id: cjv-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cjv
          key: windows-stdast-cjv-${{ env.CJCJ_TOOLCHAIN }}

      - name: Install Cangjie toolchain
        if: steps.cjv-cache.outputs.cache-hit != 'true'
        env:
          CJCJ_SDK_LINK_INPUTS_ONLY: '1'
        run: npx --yes zx@8 ci/setup_sdk.mjs

      - name: Save Cangjie toolchain
        if: steps.cjv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cjv
          key: ${{ steps.cjv-cache.outputs.cache-primary-key }}

      - name: Load compiler pins
        run: cat ci/source_pin.env ci/llvm_pin.env ci/host_sdk_pin.env >> "$GITHUB_ENV"

      - name: Install AST support build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build

      - name: Fetch pinned compiler
        run: |
          set -euo pipefail
          git init compiler
          git -C compiler remote add origin "$COMPILER_SRC_URL"
          git -C compiler fetch --depth=1 origin "$COMPILER_REF"
          git -C compiler checkout --detach FETCH_HEAD
          test "$(git -C compiler rev-parse HEAD)" = "$COMPILER_REF"
          git init compiler/third_party/flatbuffers
          git -C compiler/third_party/flatbuffers remote add origin "$FLATBUFFERS_URL"
          git -C compiler/third_party/flatbuffers fetch --depth=1 origin "$FLATBUFFERS_SHA"
          git -C compiler/third_party/flatbuffers checkout --detach FETCH_HEAD

      - name: Build Windows AST support archive
        env:
          RUNTIME_TOOLCHAIN: ${{ github.workspace }}/.windows-runtime-buildtools/llvm-mingw-w64
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/compiler/cmake/mingw_x86_64_toolchain.cmake
          AST_CMAKE_PREFIX_PATH: ${{ github.workspace }}/.windows-runtime-buildtools/llvm-mingw-w64/x86_64-w64-mingw32
          NM: llvm-nm
        run: |
          set -euo pipefail
          export PATH="$RUNTIME_TOOLCHAIN/bin:$PATH"
          sdk="$HOME/.cjv/toolchains/$CJCJ_TOOLCHAIN"
          bash ci/build_ast_support.sh \
            "$GITHUB_WORKSPACE/compiler" \
            "$GITHUB_WORKSPACE/.windows-stdast-buildtools/ast-support-build" \
            "$GITHUB_WORKSPACE/.windows-stdast-buildtools/ast-support-artifact" \
            "$sdk"
          printf 'compiler=%s\nflatbuffers=%s\nplatform=windows_x86_64\nrun_id=%s\nrun_attempt=%s\n' \
            "$COMPILER_REF" "$FLATBUFFERS_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$GITHUB_WORKSPACE/.windows-stdast-buildtools/ast-support-artifact/PROVENANCE"

      - name: Install same-generation AST inputs
        run: |
          set -euo pipefail
          python3 ci/install_std_sdk_inputs.py \
            "$GITHUB_WORKSPACE/.windows-stdast-buildtools/ast-support-artifact" \
            "$HOME/.cjv/toolchains/$CJCJ_TOOLCHAIN" \
            windows_x86_64_cjnative

      - name: Cross-build stdlib AST object
        working-directory: runtime-source/stdlib
        env:
          RUNTIME_TOOLCHAIN: ${{ github.workspace }}/.windows-runtime-buildtools/llvm-mingw-w64
        run: |
          set -euo pipefail
          sdk="$HOME/.cjv/toolchains/$CJCJ_TOOLCHAIN"
          mingw="$RUNTIME_TOOLCHAIN"
          export PATH="$sdk/bin:$sdk/tools/bin:$mingw/bin:$PATH"
          export CANGJIE_HOME="$sdk"
          export ARCH=x86_64
          python3 build.py clean
          python3 build.py build -t release --target windows-x86_64 \
            --target-lib "$GITHUB_WORKSPACE/.platform-ci/runtime-install/windows_release_x86_64" \
            --target-lib "$mingw/x86_64-w64-mingw32/lib" \
            --target-sysroot "$mingw/" \
            --target-toolchain "$mingw/bin"
          ast_o=$(find "$GITHUB_WORKSPACE/runtime-source/stdlib" -path '*/modules/windows_x86_64_cjnative/std/ast.o' -type f -print -quit)
          test -n "$ast_o"
          test -f "$ast_o"
          schema_sha=$(sha256sum "$sdk/schema/StdAstFormat.fbs" | awk '{print $1}')
          provenance="$GITHUB_WORKSPACE/.windows-stdast-buildtools/std-ast.provenance"
          printf 'schema_sha256=%s\ncompiler=%s\nobject=%s\n' "$schema_sha" "$COMPILER_REF" "$ast_o" > "$provenance"
          {
            echo "STDLIB_AST_OBJECT=$ast_o"
            echo "STDLIB_AST_PROVENANCE=$provenance"
          } >> "$GITHUB_ENV"

      - name: Rebuild host-dispatch std-ast DLL
        env:
          RUNTIME_TOOLCHAIN: ${{ github.workspace }}/.windows-runtime-buildtools/llvm-mingw-w64
          COMPILER_SOURCE: ${{ github.workspace }}/compiler
          AST_SUPPORT_ARTIFACT: ${{ github.workspace }}/.windows-stdast-buildtools/ast-support-artifact
        run: CANGJIE_HOME="$HOME/.cjv/toolchains/$CJCJ_TOOLCHAIN" npx --yes zx@8 ci/platform_matrix/build_windows_std_ast.mjs

      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache-report
        with:
          component: windows-runtime
          platform: windows_x86_64
          require-compiles: ${{ job.status == 'success' }}

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v7
        with:
          name: runtime-install-windows_x86_64
          path: .platform-ci/runtime-install/windows_release_x86_64
          if-no-files-found: error
          retention-days: 7

      - name: Verify official Windows runtime ABI
        run: npx --yes zx@8 ci/platform_matrix/verify_windows_runtime_exports.mjs
