name: Static LLVM tuple contract
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ci/llvm*'
      - 'ci/runtime_pin.env'
      - 'ci/check-llvm-runtime-abi.sh'
      - 'ci/test-runtime-layout.sh'
      - 'ci/test-codegen-layout-sync.sh'
      - 'ci/*codegen-runtime-layout*'
      - 'packages/codegen/src/**'
      - 'tests/runtime_layout/**'
      - 'ci/test-llvm-tuple*.sh'
      - 'ci/llvm-tuple-platform.test.mjs'
      - 'ci/bootstrap_inputs_pin.json'
      - 'ci/release/prepare_bootstrap_inputs*'
      - 'ci/release/acquire_fixed_tuple*'
      - 'ci/release/tuple_platform.mjs'
      - 'tools/srcbuild_kkk2.sh'
      - 'ci/release/prepare_bootstrap_fixture.mjs'
      - 'ci/release/prepare_llvm_dylib.test.mjs'
      - 'ci/llvm-dylib/**'
      - 'ci/release/colour_runtime*'
      - 'ci/colour-runtime/**'
      - '.github/workflows/test-llvm-tuple.yml'
permissions:
  contents: read
  actions: read
jobs:
  layout-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check pinned generated layout and precise offset faults
        shell: bash
        run: |
          set -euo pipefail
          source ci/runtime_pin.env
          source ci/llvm_pin.env
          for side in runtime llvm; do
            dest="$RUNNER_TEMP/layout-sources/$side"
            git init "$dest"
            if [ "$side" = runtime ]; then
              url=$RUNTIME_SRC_URL
              ref=$RUNTIME_REF
            else
              url=$LLVM_URL
              ref=$LLVM_SHA
            fi
            git -C "$dest" fetch --depth=1 "$url" "$ref"
          done
          bash ci/test-runtime-layout.sh "$RUNNER_TEMP/layout-evidence" \
            "$RUNNER_TEMP/layout-sources/runtime" "$RUNNER_TEMP/layout-sources/llvm"
          bash ci/test-codegen-layout-sync.sh "$RUNNER_TEMP/codegen-layout-evidence" \
            "$RUNNER_TEMP/layout-sources/runtime" "$RUNNER_TEMP/layout-sources/llvm"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-layout-evidence
          path: |
            ${{ runner.temp }}/layout-evidence/*.log
            ${{ runner.temp }}/layout-evidence/*.diff
            ${{ runner.temp }}/layout-evidence/*.sha256
            ${{ runner.temp }}/codegen-layout-evidence/*.log
            ${{ runner.temp }}/codegen-layout-evidence/*.diff
            ${{ runner.temp }}/codegen-layout-evidence/*.sha256
  dylib-contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux_x86_64
          - runner: ubuntu-24.04-arm
            platform: linux_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Read reviewed dylib pin
        run: |
          set -euo pipefail
          source ci/llvm_pin.env
          source ci/llvm-dylib/${{ matrix.platform }}.env
          test "$LLVM_DYLIB_SOURCE_SHA" = "$LLVM_SHA"
          cat ci/llvm_pin.env ci/llvm-dylib/${{ matrix.platform }}.env >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.LLVM_DYLIB_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          run-id: ${{ env.LLVM_DYLIB_RUN_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/dylib
      - name: Verify downloaded library and manifest rejection
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dylib"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'dylib/manifest.json').read_text())
          assert manifest['run_id'] == os.environ['LLVM_DYLIB_RUN_ID']
          assert manifest['run_attempt'] == os.environ['LLVM_DYLIB_RUN_ATTEMPT']
          assert manifest['targets'] == ['X86', 'ARM', 'AArch64']
          PY
          python3 ci/llvm-dylib/verify.py "$root" "$LLVM_SHA" "$LLVM_DYLIB_SHA256"
          cp "$root/manifest.json" "$RUNNER_TEMP/manifest.original.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          file = Path(os.environ['RUNNER_TEMP']) / 'dylib/manifest.json'
          manifest = json.loads(file.read_text())
          value = manifest['sha256']
          manifest['sha256'] = ('0' if value[0] != '0' else '1') + value[1:]
          file.write_text(json.dumps(manifest) + '\n')
          PY
          if python3 ci/llvm-dylib/verify.py "$root" "$LLVM_SHA" "$LLVM_DYLIB_SHA256" > "$RUNNER_TEMP/manifest-cut.log" 2>&1; then
            echo 'changed manifest digest unexpectedly accepted' >&2
            exit 1
          fi
          grep -F LLVM_DYLIB_SHA256_MISMATCH "$RUNNER_TEMP/manifest-cut.log"
          cp "$RUNNER_TEMP/manifest.original.json" "$root/manifest.json"
          python3 ci/llvm-dylib/verify.py "$root" "$LLVM_SHA" "$LLVM_DYLIB_SHA256"
  contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux_x86_64
            target: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux_aarch64
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Read reviewed artifact pin
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pin = JSON.parse(fs.readFileSync('ci/bootstrap_inputs_pin.json')).platforms[process.env.PLATFORM];
          if (pin.platform !== process.env.PLATFORM) throw new Error('wrong tuple platform pin');
          fs.appendFileSync(process.env.GITHUB_ENV,
            `LLVM_TUPLE_ARTIFACT_ID=${pin.artifact}\nLLVM_TUPLE_RUN_ID=${pin.run}\nLLVM_TUPLE_SUMS_SHA=${pin.tuple_sums_sha256}\n`);
          NODE
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.LLVM_TUPLE_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          run-id: ${{ env.LLVM_TUPLE_RUN_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/tuple
      - name: Check reviewed digest and precise layout fault
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/tuple/SHA256SUMS" | cut -d' ' -f1)" = "$LLVM_TUPLE_SUMS_SHA"
          grep -Fx 'PLATFORM=${{ matrix.platform }}' "$RUNNER_TEMP/tuple/MANIFEST"
          if [ '${{ matrix.platform }}' = linux_x86_64 ]; then
            cmp ci/llvm_tuple_SHA256SUMS "$RUNNER_TEMP/tuple/SHA256SUMS"
          fi
          bash ci/test-llvm-tuple-layout.sh "$RUNNER_TEMP/layout-test" "$RUNNER_TEMP/tuple"
          chmod +x "$RUNNER_TEMP/tuple/bin/"*
          "$RUNNER_TEMP/tuple/bin/llc" --version
          "$RUNNER_TEMP/tuple/bin/opt" --version
          "$RUNNER_TEMP/tuple/bin/ld.lld" --version
      - name: Exercise bootstrap input consumer
        env:
          REAL_BOOTSTRAP_TUPLE_DIR: ${{ runner.temp }}/tuple
          REAL_BOOTSTRAP_TARGET: ${{ matrix.target }}
        run: node --test ci/release/acquire_fixed_tuple.test.mjs ci/llvm-tuple-platform.test.mjs ci/release/publish_bootstrap_inputs.test.mjs ci/release/prepare_bootstrap_inputs.test.mjs ci/release/prepare_llvm_dylib.test.mjs ci/release/colour_runtime.test.mjs
      - name: Cut producer and consumer script wiring
        run: bash ci/test-llvm-tuple-wiring.sh "$RUNNER_TEMP/wiring-test"
      - name: Cut each platform publication and selection guard
        run: bash ci/test-llvm-tuple-platform-wiring.sh "$RUNNER_TEMP/platform-wiring-test"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tuple-layout-evidence-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/layout-test/*.log
            ${{ runner.temp }}/wiring-test/*.log
            ${{ runner.temp }}/wiring-test/*.diff
            ${{ runner.temp }}/wiring-test/*.sha256
            ${{ runner.temp }}/platform-wiring-test/logs/*
          if-no-files-found: error
