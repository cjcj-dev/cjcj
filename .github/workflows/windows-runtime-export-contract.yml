name: Windows runtime export contract

on:
  pull_request:
    paths:
      - 'ci/platform_matrix/verify_windows_runtime_exports*.mjs'
      - 'ci/platform_matrix/windows_runtime_*.mjs'
      - 'ci/platform_matrix/windows_runtime_toolchain.cmake'
      - 'ci/platform_matrix/build_runtime.mjs'
      - '.github/workflows/windows-runtime-export-contract.yml'
  workflow_dispatch:
    inputs:
      runtime_ref:
        description: Published full runtime commit for normal Windows link (source approval is not DLL qualification)
        required: true
        default: ee7cd9f5a532957a2f45a45ca111e4cf07a8851b
        type: string

permissions:
  contents: read

jobs:
  native-contract:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # Requires source publication/exact-fetch before dispatch; never an old binary.
      RUNTIME_REF: ${{ inputs.runtime_ref || 'ee7cd9f5a532957a2f45a45ca111e4cf07a8851b' }}
      RUNTIME_TARGET: windows-x86_64
      RUNTIME_BUILD_JOBS: '4'
      COMPILER_CALLER_REF: 8ba3eb11c18527d5641794225b901202071d726f
      LLVM_CALLER_REF: de7f37458b456c4a7ef1ebe2726d81fcfd9904c2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: cjcj-dev/cangjie-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: runtime-source
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          path-type: inherit
          install: >-
            git make python gzip unzip file binutils
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-compiler-rt
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libc++
            mingw-w64-x86_64-libunwind
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm-tools
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      # The runtime's find_program prefers ccache over sccache. Remove the
      # runner image's ccache so every arm, including cut-entry, selects sccache.
      - name: Remove the runner's preinstalled ccache
        shell: msys2 {0}
        run: |
          set -euo pipefail
          while cache=$(command -v ccache); do
            echo "Removing preinstalled compiler cache: $cache"
            rm -f -- "$cache" "$cache.exe"
            hash -r
          done
      - name: Start sccache
        uses: ./.github/actions/sccache
        with:
          component: windows-runtime
          platform: windows-x86_64
          pin: ${{ env.RUNTIME_REF }}
      - name: Build through the production MINGW64 entry
        id: native
        shell: bash
        run: npx --yes zx@8 ci/platform_matrix/build_runtime.mjs
      - name: Verify the installed runtime contract
        shell: bash
        run: npx --yes zx@8 ci/platform_matrix/verify_windows_runtime_exports.mjs --reference-services
      - name: Compile and run installed native OS consumers
        shell: bash
        run: node ci/platform_matrix/windows_runtime_consumers.mjs
      - name: Package and consume the same installed runtime
        shell: bash
        run: npx --yes zx@8 ci/platform_matrix/windows_runtime_package.mjs
      - name: Preserve link and install outputs even after a failed post-build contract
        if: always()
        shell: bash
        env:
          WINDOWS_RUNTIME_BUILD_OUTCOME: ${{ steps.native.outcome }}
        run: node ci/platform_matrix/windows_runtime_capture.mjs collect
      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache-report
        with:
          component: windows-runtime
          platform: windows-x86_64
          require-compiles: ${{ job.status == 'success' }}
      - name: Retain native inputs and build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-runtime-contract-inputs
          include-hidden-files: true
          path: |
            .platform-ci/
            runtime-source/runtime/src/windows_x86_64_exports.def
            runtime-source/runtime/src/windows_export_references.json
            runtime-source/runtime/CMakebuild/**/windows_x86_64_exports.raw.def
          if-no-files-found: error
          retention-days: 7
