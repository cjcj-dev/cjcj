# Build native fixed-LLVM tuples for the platform matrix. macOS 26 consumes the
# macOS 15 artifact of the same architecture (same Darwin target, older deployment
# baseline); Ubuntu 24.04 ARM consumes the Ubuntu 22.04 ARM artifact; Windows 2025
# consumes the Windows 2022 x64 artifact.
name: Platform fixed LLVM tuples

on:
  push:
    branches: [ci/platform-matrix]
  workflow_dispatch:
  workflow_call:
    inputs:
      platform_set:
        description: Tuple subset to build in this caller run
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: platform-tuples-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-tuple:
    name: fixed LLVM tuple / ${{ matrix.platform }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform_set == 'windows-only' && '[{"runner":"windows-2022","platform":"windows_x86_64","llvm-targets":"AArch64;ARM;X86"}]' || inputs.platform_set == 'darwin-windows' && '[{"runner":"macos-15","platform":"darwin_aarch64","llvm-targets":"AArch64"},{"runner":"macos-15-intel","platform":"darwin_x86_64","llvm-targets":"X86"},{"runner":"windows-2022","platform":"windows_x86_64","llvm-targets":"AArch64;ARM;X86"}]' || '[{"runner":"macos-15","platform":"darwin_aarch64","llvm-targets":"AArch64"},{"runner":"macos-15-intel","platform":"darwin_x86_64","llvm-targets":"X86"},{"runner":"ubuntu-22.04","platform":"linux_x86_64","llvm-targets":"X86"},{"runner":"ubuntu-22.04-arm","platform":"linux_aarch64","llvm-targets":"AArch64"},{"runner":"windows-2022","platform":"windows_x86_64","llvm-targets":"AArch64;ARM;X86"}]') }}
    env:
      TUPLE_PLATFORM: ${{ matrix.platform }}
      LLVM_TARGETS: ${{ matrix.llvm-targets }}
      TUPLE_ROOT: .tuple-build

    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Load LLVM pin
        id: llvm-pin
        run: |
          cat ci/llvm_pin.env >> "$GITHUB_ENV"
          source ci/llvm_pin.env
          echo "sha=$LLVM_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore fixed LLVM tuple cache
        id: tuple-cache
        uses: actions/cache@v6
        with:
          path: fixed-toolchain/${{ matrix.platform }}
          key: tuple-${{ matrix.platform }}-${{ steps.llvm-pin.outputs.sha }}-${{ hashFiles('.github/workflows/platform-tuples.yml', 'ci/platform_tuples/**', 'ci/platform_matrix/**') }}

      - name: Prepare MSYS2/MinGW LLVM toolchain
        id: msys2-setup
        if: runner.os == 'Windows' && steps.tuple-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            git gzip unzip file binutils
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: Install Linux build dependencies
        id: linux-deps
        if: runner.os == 'Linux' && steps.tuple-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build gzip file binutils

      - name: Install macOS build dependencies
        id: macos-deps
        if: runner.os == 'macOS' && steps.tuple-cache.outputs.cache-hit != 'true'
        run: brew install ninja

      - name: Fetch exact shallow source trees
        id: source-fetch
        if: runner.os != 'Windows' && steps.tuple-cache.outputs.cache-hit != 'true'
        run: bash ci/platform_tuples/fetch_sources.sh

      - name: Fetch exact shallow source trees (MSYS2)
        id: source-fetch-windows
        if: runner.os == 'Windows' && steps.tuple-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash ci/platform_tuples/fetch_sources.sh

      - name: Configure and build llc + shim
        id: tuple-build
        if: runner.os != 'Windows' && steps.tuple-cache.outputs.cache-hit != 'true'
        run: bash ci/platform_tuples/build_tuple.sh

      - name: Configure and build llc + shim (MSYS2)
        id: tuple-build-windows
        if: runner.os == 'Windows' && steps.tuple-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash ci/platform_tuples/build_tuple.sh

      - name: Verify fixed LLVM tuple payload
        run: |
          test -s "fixed-toolchain/$TUPLE_PLATFORM/llc.gz"
          test -s "fixed-toolchain/$TUPLE_PLATFORM/cjselfhost_llvmshim.o"
          if [ "$TUPLE_PLATFORM" = windows_x86_64 ]; then
            test -s "fixed-toolchain/$TUPLE_PLATFORM/llvm-static-libs.txt"
            test -s "fixed-toolchain/$TUPLE_PLATFORM/llvm-system-libs.txt"
          fi

      - name: Summarize tuple result
        if: always()
        env:
          MSYS2_OUTCOME: ${{ steps.msys2-setup.outcome }}
          LINUX_DEPS_OUTCOME: ${{ steps.linux-deps.outcome }}
          MACOS_DEPS_OUTCOME: ${{ steps.macos-deps.outcome }}
          SOURCE_OUTCOME: ${{ steps.source-fetch.outcome }}
          WINDOWS_SOURCE_OUTCOME: ${{ steps.source-fetch-windows.outcome }}
          CACHE_OUTCOME: ${{ steps.tuple-cache.outcome }}
          CACHE_HIT: ${{ steps.tuple-cache.outputs.cache-hit }}
          BUILD_OUTCOME: ${{ steps.tuple-build.outcome }}
          WINDOWS_BUILD_OUTCOME: ${{ steps.tuple-build-windows.outcome }}
        run: bash ci/platform_tuples/summarize.sh

      - name: Upload fixed LLVM tuple
        uses: actions/upload-artifact@v7
        with:
          name: fixed-llvm-tools-${{ matrix.platform }}
          path: fixed-toolchain/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
