name: Darwin private signal observer calibration
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  calibration:
    name: arm64-calibration-only
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build private helper once and run one native process
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'signal-observation'
          retained = root / 'retained'
          identity = json.loads(pathlib.Path('ci/bootstrap/signal_observation/calibration_identity.json').read_text())
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          retained.mkdir(parents=True, exist_ok=True)
          binary = retained / 'calibrator'
          sdk = subprocess.check_output(['xcrun', '--show-sdk-path'], text=True).strip()
          xcode = subprocess.check_output(['xcodebuild', '-version'], text=True)
          if xcode != identity['xcode']: raise SystemExit('Xcode ABI mismatch')
          source = pathlib.Path('ci/bootstrap/signal_observation/calibrate.c')
          subprocess.run(['xcrun', 'clang', '-g', '-O0', '-arch', 'arm64', '-isysroot', sdk,
                          str(source), '-o', str(binary)], check=True)
          subprocess.run(['dsymutil', str(binary)], check=True)
          actual = {str(p.relative_to(retained)): sha(p) for p in retained.rglob('*') if p.is_file()}
          if sha(pathlib.Path('ci/bootstrap/signal_observation/observer.py')) != '11fb38b66573654a14791ba25d2edaef2109c83b3dc4d501bfe28349e0821fb6':
              raise SystemExit('observer identity mismatch')
          info = {'sdkroot': sdk, 'xcode': xcode, 'previous_identity': identity, 'actual_files': actual,
                  'source_sha256': sha(source),
                  'observer_sha256': sha(pathlib.Path('ci/bootstrap/signal_observation/observer.py')),
                  'runner': subprocess.check_output(['uname', '-a'], text=True),
                  'lldb': subprocess.check_output(['/usr/bin/lldb', '--version'], text=True)}
          for name, argv in [('file', ['file', str(binary)]),
                             ('dependencies', ['otool', '-L', str(binary)]),
                             ('uuid', ['dwarfdump', '--uuid', str(binary), str(retained / 'calibrator.dSYM')]),
                             ('assembly', ['otool', '-tvV', str(binary)])]:
              value = subprocess.run(argv, capture_output=True, text=True)
              info[name] = {'rc': value.returncode, 'output': value.stdout + value.stderr}
              if value.returncode: raise SystemExit('retained ABI inspection failed: ' + name)
          (root / 'identity.json').write_text(json.dumps(info, indent=2))
          if 'arm64' not in info['file']['output']: raise SystemExit('retained architecture mismatch')
          cfg = {'binary': str(binary), 'binary_sha256': sha(binary), 'mode': 'calibrate',
                 'selected_size': 0, 'cwd': str(root), 'argv': [],
                 'stdout': str(root / 'calibration.stdout'), 'stderr': str(root / 'calibration.stderr'),
                 'output': str(root / 'calibration.json'), 'layout': None, 'expected_libraries': {},
                 'environment': {'HOME': os.environ['HOME'], 'TMPDIR': os.environ['TMPDIR'],
                                 'PATH': '/usr/bin:/bin:/usr/sbin:/sbin'}}
          config = root / 'calibration.config.json'
          config.write_text(json.dumps(cfg, indent=2))
          observer = pathlib.Path('ci/bootstrap/signal_observation/observer.py').resolve()
          start = time.monotonic()
          with (root / 'calibration.lldb.log').open('w') as log:
              try:
                  rc = subprocess.run(['/usr/bin/lldb', '--batch', '-o', 'command script import ' + str(observer),
                                       '-o', 'signal-observe'], stdout=log, stderr=subprocess.STDOUT,
                                      env=dict(os.environ, SIGNAL_OBSERVER_CONFIG=str(config)), timeout=120).returncode
              except subprocess.TimeoutExpired:
                  rc = 124
          (root / 'execution.json').write_text(json.dumps({'rc': rc, 'wall': time.monotonic()-start,
                                                        'native_launch_limit': 1}, indent=2))
          if rc or not pathlib.Path(cfg['output']).is_file(): raise SystemExit('LLDB unqualified: ' + str(rc))
          result = json.loads(pathlib.Path(cfg['output']).read_text())
          print('NATIVE_CALIBRATION', result['status'])
          if 'SAFE_FREE' not in pathlib.Path(cfg['stdout']).read_text(): raise SystemExit('safe free missing')
          if result['status'] != 'CALIBRATED': raise SystemExit('stop: native calibration unqualified')
          PY
      - name: Preserve all raw calibration records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signal-calibration-${{ github.run_id }}
          path: ${{ runner.temp }}/signal-observation
          if-no-files-found: error
          retention-days: 30
