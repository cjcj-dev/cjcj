# Non-gating GC young-collection corpus across hosted platform runners.
#
# NONGATING_SAFE = yes:
#   - on: workflow_dispatch only (no push / no pull_request)
#   - every job is continue-on-error, including the reusable Windows runtime
#     build through its opt-in nongating input, so a failed manual run does not
#     set a failing workflow conclusion on the selected commit
#   - not workflow_call'd from ci.yml / release.yml
#
# Scope: prove young collection can fire on linux-aarch64, Darwin x64/arm64,
# and Windows x64 with the pinned runtime. Not full smoke15, not sticky-closure
# product acceptance.

name: GC young corpus (platform matrix)

on:
  workflow_dispatch:
    inputs:
      min_young:
        description: Minimum young collections required
        required: false
        type: number
        default: 20

permissions:
  contents: read
  actions: read

concurrency:
  group: gc-young-corpus-${{ github.ref }}
  cancel-in-progress: true

env:
  CJCJ_TOOLCHAIN: nightly-1.2.0-alpha.20260721165458
  CJ_HEAP_SIZE: 2GB

jobs:
  gc-young-linux-aarch64:
    name: ubuntu-24.04-arm / GC young corpus
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Load runtime pin
        shell: bash
        run: cat ci/runtime_pin.env >> "$GITHUB_ENV"

      - name: Restore SDK cache
        id: sdkcache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CJCJ_TOOLCHAIN }}

      - name: Install SDK (stock llc; official cjc only)
        id: setup
        env:
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
          # This job never feeds cjcj IR to llc — only official cjc compiles the corpus.
          CJCJ_SDK_STOCK_LLC: '1'
        run: npx --yes zx@8 ci/setup_sdk.mjs

      - name: Save SDK cache
        if: steps.setup.outcome == 'success' && steps.sdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CJCJ_TOOLCHAIN }}

      - name: Restore patched runtime cache
        id: rtcache
        uses: actions/cache/restore@v6
        with:
          path: dist-runtime
          key: rt-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-arm-${{ env.RUNTIME_REF }}-${{ env.RUNTIME_VERSION }}-${{ hashFiles('ci/build_patched_runtime.mjs') }}

      - name: Install runtime build dependencies
        if: steps.rtcache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake make python3

      - name: Build patched runtime
        if: steps.rtcache.outputs.cache-hit != 'true'
        env:
          RUNTIME_VERSION: ${{ env.RUNTIME_VERSION }}
        run: npx --yes zx@8 ci/build_patched_runtime.mjs "$PWD/dist-runtime"

      - name: Save patched runtime cache
        if: steps.rtcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist-runtime
          key: rt-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-arm-${{ env.RUNTIME_REF }}-${{ env.RUNTIME_VERSION }}-${{ hashFiles('ci/build_patched_runtime.mjs') }}

      - name: Install patched runtime into SDK
        run: npx --yes zx@8 ci/install_patched_runtime.mjs "$PWD/dist-runtime"

      - name: Run young-collection corpus
        timeout-minutes: 10
        env:
          GC_YOUNG_MIN: ${{ inputs.min_young }}
          GC_YOUNG_WORK: ${{ github.workspace }}/.gc-young-work
          MRT_STICKY_MINOR_YOUNG_BYTES: '1048576'
          cjHeapSize: 2GB
          GC_YOUNG_COMPILER: cjc
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$CANGJIE_HOME/envsetup.sh" 2>/dev/null || true
          command -v cjc
          uname -m
          test "$(uname -m)" = "aarch64"
          npx --yes zx@8 ci/gc_young/run_gc_young.mjs

      - name: Upload young corpus logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gc-young-linux-aarch64-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            .gc-young-work/**

  gc-young-darwin:
    name: ${{ matrix.platform }} / GC young corpus
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-x64
            runner: macos-15-intel
            uname_arch: x86_64
          - platform: darwin-arm64
            runner: macos-15
            uname_arch: arm64
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Load runtime pin
        shell: bash
        run: cat ci/runtime_pin.env >> "$GITHUB_ENV"

      - name: Restore SDK cache
        id: sdkcache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CJCJ_TOOLCHAIN }}

      - name: Install SDK (stock llc; official cjc only)
        id: setup
        env:
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
          CJCJ_SDK_STOCK_LLC: '1'
        run: npx --yes zx@8 ci/setup_sdk.mjs

      - name: Save SDK cache
        if: steps.setup.outcome == 'success' && steps.sdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CJCJ_TOOLCHAIN }}

      - name: Restore patched runtime cache
        id: rtcache
        uses: actions/cache/restore@v6
        with:
          path: dist-runtime
          key: rt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ env.RUNTIME_REF }}-${{ env.RUNTIME_VERSION }}-${{ hashFiles('ci/build_patched_runtime.mjs') }}

      - name: Build patched runtime
        if: steps.rtcache.outputs.cache-hit != 'true'
        env:
          RUNTIME_VERSION: ${{ env.RUNTIME_VERSION }}
        run: npx --yes zx@8 ci/build_patched_runtime.mjs "$PWD/dist-runtime"

      - name: Save patched runtime cache
        if: steps.rtcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist-runtime
          key: rt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ env.RUNTIME_REF }}-${{ env.RUNTIME_VERSION }}-${{ hashFiles('ci/build_patched_runtime.mjs') }}

      - name: Install patched runtime into SDK
        run: npx --yes zx@8 ci/install_patched_runtime.mjs "$PWD/dist-runtime"

      - name: Run young-collection corpus
        timeout-minutes: 10
        env:
          GC_YOUNG_MIN: ${{ inputs.min_young }}
          GC_YOUNG_WORK: ${{ github.workspace }}/.gc-young-work
          MRT_STICKY_MINOR_YOUNG_BYTES: '1048576'
          cjHeapSize: 2GB
          GC_YOUNG_COMPILER: cjc
        run: |
          set -euo pipefail
          command -v cjc
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "${{ matrix.uname_arch }}"
          npx --yes zx@8 ci/gc_young/run_gc_young.mjs

      - name: Upload young corpus logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gc-young-${{ matrix.platform }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            .gc-young-work/**

  windows-runtime:
    name: windows-x64 / Build runtime for corpus
    uses: ./.github/workflows/build-windows-runtime.yml
    with:
      version: 1.2.0-alpha.20260721165458
      nongating: true
    secrets: inherit

  gc-young-windows-x64:
    name: windows-2025 / GC young corpus
    needs: windows-runtime
    if: always()
    runs-on: windows-2025
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Load runtime pin
        run: npx --yes zx@8 ci/load_runtime_pin.mjs

      - name: Download cross-built Windows runtime
        uses: actions/download-artifact@v8
        with:
          name: runtime-install-windows_x86_64
          path: .platform-ci/runtime-install/windows_release_x86_64

      - name: Provision official Windows SDK
        env:
          CJCJ_SDK_PROVISION_ONLY: '1'
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
        run: npx --yes zx@8 ci/platform_matrix/build_cjcj.mjs

      - name: Install cross-built runtime into SDK
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $PWD '.platform-ci/runtime-install/windows_release_x86_64'
          $sourceSha = (Get-Content (Join-Path $runtimeRoot 'SOURCE_SHA') -Raw).Trim()
          if ($sourceSha -ne $env:RUNTIME_REF) {
            Write-Error "runtime source mismatch: $sourceSha != $env:RUNTIME_REF"
            exit 1
          }
          $layouts = @(
            'runtime/lib/windows_x86_64_cjnative',
            'lib/windows_x86_64_cjnative'
          )
          foreach ($layout in $layouts) {
            $source = Join-Path $runtimeRoot $layout
            $destination = Join-Path $env:CANGJIE_HOME $layout
            if (-not (Test-Path $source -PathType Container)) {
              Write-Error "runtime artifact layout missing: $source"
              exit 1
            }
            New-Item -ItemType Directory -Force $destination | Out-Null
            Copy-Item -Recurse -Force (Join-Path $source '*') $destination
            Write-Host "installed runtime layout: $layout"
          }
          $runtimeDll = Join-Path $env:CANGJIE_HOME 'runtime/lib/windows_x86_64_cjnative/libcangjie-runtime.dll'
          if (-not (Test-Path $runtimeDll -PathType Leaf)) {
            Write-Error "installed runtime DLL missing: $runtimeDll"
            exit 1
          }

      - name: Run young-collection corpus
        timeout-minutes: 10
        shell: pwsh
        env:
          GC_YOUNG_MIN: ${{ inputs.min_young }}
          GC_YOUNG_WORK: ${{ github.workspace }}\.gc-young-work
          MRT_STICKY_MINOR_YOUNG_BYTES: '1048576'
          cjHeapSize: 2GB
          cjStackSize: 64MB
          GC_YOUNG_COMPILER: cjc.exe
        run: |
          where.exe cjc.exe
          npx --yes zx@8 ci/gc_young/run_gc_young.mjs

      - name: Upload young corpus logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gc-young-windows-x64-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            .gc-young-work/**
