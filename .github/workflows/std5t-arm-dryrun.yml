name: Sticky std Linux ARM dry run

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CJCJ_TOOLCHAIN: nightly-1.2.0-alpha.20260721165458
  cjHeapSize: 12GB

jobs:
  fixed-llvm-tools:
    name: Build fixed LLVM tools
    uses: ./.github/workflows/build-fixed-llc.yml

  sticky-std-linux-aarch64:
    name: linux-aarch64 / Build and attest sticky std
    needs: fixed-llvm-tools
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Load runtime pin
        run: npx --yes zx@8 ci/load_runtime_pin.mjs

      - name: Download ARM fixed LLVM tuple
        uses: actions/download-artifact@v8
        with:
          name: fixed-llvm-tools-linux_aarch64
          path: fixed-toolchain/linux_aarch64

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake make ninja-build libssl-dev

      - name: Install official SDK with fixed LLC
        env:
          FIXED_LLC_GZ: ${{ github.workspace }}/fixed-toolchain/linux_aarch64/llc.gz
        run: npx --yes zx@8 ci/setup_sdk.mjs

      # CANGJIE_HOME lands in $GITHUB_ENV, which only takes effect in the next step
      - name: Verify fixed LLC in SDK
        run: '"$CANGJIE_HOME/third_party/llvm/bin/llc" --help-hidden | grep -q cjcj-sticky-logged-map'

      - name: Build pinned runtime
        run: npx --yes zx@8 ci/build_patched_runtime.mjs "$PWD/dist-runtime"

      - name: Activate pinned runtime
        run: npx --yes zx@8 ci/install_patched_runtime.mjs "$PWD/dist-runtime"

      - name: Build and attest sticky std
        id: sticky
        run: |
          set -o pipefail
          npx --yes zx@8 ci/build_std_variants.mjs \
            --sdk "$CANGJIE_HOME" \
            --outdir "$PWD/dist-sticky-std" \
            --target linux-aarch64 2>&1 | tee sticky-std-linux-aarch64.log
          attest="$(grep '^STICKY_CLOSURE ' sticky-std-linux-aarch64.log | tail -1)"
          test -n "$attest"
          echo "attestation=$attest" >> "$GITHUB_OUTPUT"
          {
            echo "### linux-aarch64 sticky std"
            echo '```text'
            echo "$attest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sticky std closure and attestation
        uses: actions/upload-artifact@v7
        with:
          name: sticky-std-linux_aarch64-dryrun
          path: |
            dist-sticky-std
            sticky-std-linux-aarch64.log
          if-no-files-found: error
          retention-days: 7
