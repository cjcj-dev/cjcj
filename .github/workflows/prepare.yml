name: Prepare
'on':
  workflow_dispatch:
    inputs:
      version:
        description: SDK version
        type: string
        required: true
        default: 0.0.2
      platform:
        description: Native base platform (leave empty to build all five)
        type: string
        required: false
        default: ''
      llvm_ref:
        description: LLVM commit override (full SHA)
        type: string
        required: false
      runtime_ref:
        description: Runtime commit override (full SHA)
        type: string
        required: false
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  native-base:
    runs-on: >-
      ${{ fromJSON('{"linux-x64":"ubuntu-22.04","linux-aarch64":"ubuntu-24.04-arm",
                     "darwin-arm64":"macos-15","darwin-x64":"macos-15","windows-x64":"windows-2025"}')[matrix.platform] }}
    strategy:
      fail-fast: false
      matrix:
        platform: >-
          ${{ fromJSON(inputs.platform && format('[{0}]', toJSON(inputs.platform)) ||
                      '["linux-x64","linux-aarch64","darwin-arm64","darwin-x64","windows-x64"]') }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Read tool versions
      run: node -e 'const p=require("./build/pins.json").toolchains; console.log("node="+p.node+"\nsccache="+p.sccache)' >> "$GITHUB_OUTPUT"
      id: pins
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ steps.pins.outputs.node }}
    - name: Fetch selected source commits
      run: |-
        overrides=()
        [[ -z "$LLVM_REF" ]] || overrides+=(--override "llvm=$LLVM_REF")
        [[ -z "$RUNTIME_REF" ]] || overrides+=(--override "runtime=$RUNTIME_REF")
        node build/setup.mjs sources --repos compiler,llvm,runtime,bounds,flatbuffers --out ../sources "${overrides[@]}"
        mkdir -p ../base
        git -C ../sources/llvm rev-parse HEAD > ../base/llvm.ref
        git -C ../sources/runtime rev-parse HEAD > ../base/runtime.ref
        echo "llvm=$(cat ../base/llvm.ref)" >> "$GITHUB_OUTPUT"
      env:
        LLVM_REF: ${{ inputs.llvm_ref }}
        RUNTIME_REF: ${{ inputs.runtime_ref }}
      id: sources
    - uses: ./.github/actions/native-windows-tools
      with:
        native-compiler: 'true'
      if: runner.os == 'Windows'
    - name: Install build dependencies
      run: node build/setup.mjs deps --platform "$PLATFORM" --mode prepare
    - uses: ./.github/actions/sccache
      with:
        component: native
        platform: ${{ matrix.platform }}
        pin: ${{ steps.sources.outputs.llvm }}
        sccache-version: ${{ steps.pins.outputs.sccache }}
        cache-size: 5G
    - name: Install bootstrap SDK
      run: node build/setup.mjs host-sdk --platform "$PLATFORM" --out ../base/host
    - name: Build the runtime
      run: node build/build-runtime.mjs --platform "$PLATFORM" --sources ../sources --out ../base/runtime --language-inputs ../language
    - name: Archive deferred runtime test inputs
      if: runner.os == 'Linux'
      run: node build/setup.mjs pack --archive runtime-tests.tar --dir ../language
    - uses: actions/upload-artifact@v7.0.2
      if: runner.os == 'Linux'
      with:
        name: runtime-tests-${{ matrix.platform }}
        path: runtime-tests.tar
        compression-level: 0
        if-no-files-found: error
    - name: Build LLVM, CJDB and the compiler shim
      run: node build/build-llvm.mjs --platform "$PLATFORM" --sources ../sources --out ../base/native --work ../native-work
    - name: Install cjbind
      run: node build/setup.mjs cjbind --platform "$PLATFORM" --host-sdk ../base/host --out ../base/tools
    - name: Archive native base
      run: node build/setup.mjs pack --archive native-base.tar --dir ../base
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: native-base-${{ matrix.platform }}
        path: native-base.tar
        if-no-files-found: error
        compression-level: 0
    - uses: ./.github/actions/sccache
      with:
        mode: report
        component: native
        platform: ${{ matrix.platform }}
        require-compiles: ${{ job.status == 'success' }}
        save: ${{ job.status == 'success' }}
      if: always()
  ci-sdk:
    if: inputs.platform == '' || inputs.platform == 'linux-x64'
    needs: native-base
    runs-on: ubuntu-24.04
    env:
      cjHeapSize: ${{ vars.cjHeapSize || '20GB' }}
      cjHeapSwap: 'on'
      PLATFORM: linux-x64
      VERSION: ${{ inputs.version }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Read tool versions
      run: node -e 'const p=require("./build/pins.json").toolchains; console.log("node="+p.node+"\nsccache="+p.sccache)' >> "$GITHUB_OUTPUT"
      id: pins
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ steps.pins.outputs.node }}
    - name: Enable Linux bootstrap swap
      if: runner.os == 'Linux'
      run: node build/setup.mjs swap
    - uses: actions/download-artifact@v8.0.2
      with:
        name: native-base-linux-x64
    - name: Unpack native base
      run: |-
        mkdir -p ../base
        node build/setup.mjs unpack --archive native-base.tar --dir ../base
        rm native-base.tar
    - name: Fetch bootstrap and SDK sources
      run: node build/setup.mjs sources --out ../src --repos runtime,bounds,pcre2,tools,stdx,javaInterop,compiler --override "runtime=$(cat ../base/runtime.ref)"
    - uses: ./.github/actions/native-windows-tools
      with:
        native-compiler: 'true'
      if: runner.os == 'Windows'
    - name: Install build dependencies
      run: node build/setup.mjs deps --platform "$PLATFORM" --mode full
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
      if: env.PLATFORM == 'linux-x64' || env.PLATFORM == 'windows-x64'
    - name: Build H1 with the official SDK
      run: node build/build-compiler.mjs --stage stage0 --host-sdk ../base/host --native ../base/native --runtime ../base/runtime --out
        ../stage0
    - name: Bootstrap the standard library
      run: |-
        node build/build-stdlib.mjs --stage std-bootstrap --sources ../src --runtime ../base/runtime --sdk ../stage0 --out ../initial
        rm -rf ../stage0 ../stage0.target
    - name: Rebuild the standard library using the bootstrap modules
      run: |-
        node build/build-stdlib.mjs --stage stage1-std --sources ../src --runtime ../base/runtime --sdk ../initial --out ../stage1
    - name: Build stage 2
      run: |-
        node build/build-compiler.mjs --stage stage2 --sdk ../initial --std ../stage1 --native ../base/native --host-sdk ../base/host --out ../stage2 --version "$VERSION"
        rm -rf ../initial ../stage1
    - name: Build final std
      run: |-
        node build/build-stdlib.mjs --stage stage3-std --sources ../src --runtime ../base/runtime --sdk ../stage2 --include ../stage2/include --local-mode-api --out ../final-std
    - name: Build stage 3
      run: |-
        node build/build-compiler.mjs --stage stage3 --sdk ../stage2 --std ../final-std --native ../base/native --host-sdk ../base/host --out ../host-sdk --version "$VERSION"
        rm -rf ../stage2 ../final-std
    - name: Prepare the Java annotation processor
      run: mvn -q dependency:copy -Dartifact=org.projectlombok:lombok:1.18.36 -DoutputDirectory=../jars
      if: env.PLATFORM == 'linux-x64' || env.PLATFORM == 'windows-x64'
    - name: Build stdx, SDK tools and applicable interop libraries
      run: |-
        suffix=""
        [[ "$PLATFORM" != windows-x64 ]] || suffix=.exe
        node build/build-extras.mjs --sdk ../host-sdk --host-sdk ../base/host --sources ../src --cjbind "../base/tools/cjbind$suffix" --lombok ../jars/lombok-1.18.36.jar
    - name: Package and smoke test the CI SDK
      run: |-
        node build/package-sdk.mjs --sdk ../host-sdk --compiler-source ../src/compiler --version "$VERSION" --out ../dist
        mkdir -p ../ci-sdk
        node build/setup.mjs unpack --archive "../dist/cjcj-$VERSION-linux-x64.tar.gz" --dir ../ci-sdk --sdk-root cangjie
        node build/test-sdk.mjs --sdk ../ci-sdk/cangjie --mode smoke
        mv "../dist/cjcj-$VERSION-linux-x64.tar.gz" ci-sdk.tar.gz
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: ci-sdk-linux-x64
        path: ci-sdk.tar.gz
        if-no-files-found: error
        compression-level: 0
