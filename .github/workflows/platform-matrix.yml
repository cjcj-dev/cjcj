name: Platform runtime + cjcj matrix

on:
  push:
    branches: [ci/platform-matrix]
  workflow_dispatch:
    inputs:
      darwin_verify_only:
        description: Verify the published Darwin input and source classification
        type: boolean
        default: false
      darwin_host_only:
        description: Extract the pinned official Darwin host runtime pair
        type: boolean
        default: false
      darwin_runtime_only:
        description: Build the pinned Darwin native runtime pair on both official runners
        type: boolean
        default: false
      runtime_only:
        description: Build only the pinned Linux bootstrap runtime artifact
        type: boolean
        default: false
      linux_native_only:
        description: Build only the Linux aarch64 native libraries without coloured std
        type: boolean
        default: false

      std_evidence_only:
        description: Only compile std evidence; no native gate verdict or publication
        type: boolean
        default: false
      diagnostics_run_id:
        description: Same-pin failed gate diagnostics run for std evidence
        type: string
      runtime_sha256:
        description: Recorded target runtime digest for std evidence
        type: string
      boundscheck_sha256:
        description: Recorded target boundscheck digest for std evidence
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: platform-matrix-${{ github.ref }}${{ inputs.linux_native_only && '-linux-native' || '' }}
  cancel-in-progress: false

env:
  # RUNTIME_REF/RUNTIME_SRC_URL come from ci/runtime_pin.env via the
  # "Load runtime pin" step — the pin lives in exactly one file.
  RUNTIME_VERSION: 1.2.0-alpha.20260721165458
  CJ_HEAP_SIZE: 12GB

jobs:
  matrix-scope:
    name: Report matrix coverage scope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Record requested coverage
        env:
          MATRIX_INPUTS: ${{ toJSON(inputs) }}
        run: |
          node ci/platform_matrix/summarize_scope.mjs
          cat "$GITHUB_STEP_SUMMARY"

  darwin-source-input:
    if: ${{ inputs.darwin_verify_only }}
    uses: ./.github/workflows/verify-darwin-runtime.yml

  darwin-host:
    if: ${{ inputs.darwin_host_only }}
    uses: ./.github/workflows/build-host-runtime.yml

  std-input-evidence:
    if: ${{ inputs.std_evidence_only }}
    uses: ./.github/workflows/std-input-evidence.yml
    with:
      diagnostics_run_id: ${{ inputs.diagnostics_run_id }}
      runtime_sha256: ${{ inputs.runtime_sha256 }}
      boundscheck_sha256: ${{ inputs.boundscheck_sha256 }}

  darwin-runtime:
    if: ${{ inputs.darwin_runtime_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, platform: darwin_aarch64}
          - {runner: macos-15-intel, platform: darwin_x86_64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Load runtime pin
        run: cat ci/runtime_pin.env >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: cjcj-dev/cangjie-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: runtime-source
      - uses: ./.github/actions/sccache
        with:
          component: runtime
          platform: ${{ matrix.platform }}
          pin: ${{ env.RUNTIME_REF }}
          cache-size: 1G
      - name: Build pinned native runtime
        env:
          RUNTIME_BUILD_TYPE: relwithdebinfo
        run: |
          set -euo pipefail
          ulimit -c 0
          CANGJIE_BUILD_JOBS=$(sysctl -n hw.logicalcpu)
          export CANGJIE_BUILD_JOBS
          npx --yes zx@8 ci/platform_matrix/build_runtime.mjs
      - name: Package independent native libraries
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node ci/release/darwin_runtime.mjs prepare colour-runtime "$PLATFORM" .platform-ci/runtime-install
          COLOUR_RT_MANIFEST_SHA256=$(shasum -a 256 colour-runtime/manifest.json | awk '{print $1}')
          export COLOUR_RT_MANIFEST_SHA256
          export COLOUR_RT_RUN_ID=$GITHUB_RUN_ID COLOUR_RT_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT
          node ci/release/darwin_runtime.mjs verify colour-runtime "$PLATFORM" .platform-ci/runtime-install | tee colour-runtime/verified.log
      - name: Test native producer and consumer with controlled cuts
        env:
          PLATFORM: ${{ matrix.platform }}
          DARWIN_RT_NATIVE_SOURCE: .platform-ci/runtime-install
        run: bash ci/release/test_darwin_runtime_controls.sh colour-runtime/controls
      - name: Record native build identity
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          lib="colour-runtime/runtime/lib/${PLATFORM}_cjnative"
          file "$lib/libcangjie-runtime.dylib" "$lib/libboundscheck.dylib" "colour-runtime/lib/${PLATFORM}_cjnative/libcangjie-runtime.a" | tee colour-runtime/architecture.txt
          shasum -a 256 "$lib/libcangjie-runtime.dylib" "$lib/libboundscheck.dylib" "colour-runtime/lib/${PLATFORM}_cjnative/libcangjie-runtime.a" | tee colour-runtime/SHA256SUMS
          nm -U "$lib/libcangjie-runtime.dylib" > colour-runtime/defined-symbols.txt
          echo "NM_DEFINED_RC=0"
          grep -E ' _CJ_MCC_HandleSafepoint$' colour-runtime/defined-symbols.txt
          grep -E ' _CJ_MCC_HandleReturnSafepoint$' colour-runtime/defined-symbols.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: darwin-runtime-diagnostics-${{ matrix.platform }}
          path: .platform-ci/runtime-install
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: colour-runtime-${{ matrix.platform }}
          path: colour-runtime
          if-no-files-found: error
      - uses: ./.github/actions/sccache-report
        if: always()
        with:
          component: runtime
          platform: ${{ matrix.platform }}
          require-compiles: ${{ job.status == 'success' }}
  linux-native-runtime:
    if: ${{ inputs.runtime_only || inputs.linux_native_only }}
    name: Pinned Linux aarch64 native libraries
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      PLATFORM: linux_aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Load runtime pin
        run: cat ci/runtime_pin.env >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: cjcj-dev/cangjie-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: runtime-source
      - uses: ./.github/actions/sccache
        with:
          component: runtime
          platform: linux_aarch64
          pin: ${{ env.RUNTIME_REF }}
          cache-size: 1G
      - name: Build pinned native libraries
        env:
          RUNTIME_BUILD_TYPE: relwithdebinfo
          GC_UNIT_GATE_LANGUAGE_TESTS: defer
        run: |
          set -euo pipefail
          ulimit -c 0
          export CANGJIE_BUILD_JOBS=$(nproc)
          npx --yes zx@8 ci/platform_matrix/build_runtime.mjs
      - name: Package and verify native libraries without std
        run: |
          set -euo pipefail
          ulimit -c 0
          node ci/release/darwin_runtime.mjs prepare colour-runtime "$PLATFORM" .platform-ci/runtime-install
          export COLOUR_RT_MANIFEST_SHA256=$(sha256sum colour-runtime/manifest.json | cut -d' ' -f1)
          export COLOUR_RT_RUN_ID=$GITHUB_RUN_ID COLOUR_RT_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT
          node ci/release/darwin_runtime.mjs verify colour-runtime "$PLATFORM" .platform-ci/runtime-install
          file colour-runtime/runtime/lib/*/*.so colour-runtime/lib/*/*.a | tee colour-runtime/architecture.txt
      - name: Test native producer and consumer with controlled cuts
        env:
          DARWIN_RT_NATIVE_SOURCE: .platform-ci/runtime-install
        run: |
          ulimit -c 0
          bash ci/release/test_darwin_runtime_controls.sh colour-runtime/controls
      - uses: actions/upload-artifact@v7
        with:
          name: colour-runtime-linux_aarch64
          path: colour-runtime
          if-no-files-found: error
      - uses: ./.github/actions/sccache-report
        if: always()
        with:
          component: runtime
          platform: linux_aarch64
          require-compiles: ${{ job.status == 'success' }}
  colour-runtime:
    if: ${{ !inputs.linux_native_only && !inputs.std_evidence_only && !inputs.darwin_runtime_only && !inputs.darwin_host_only && !inputs.darwin_verify_only }}
    name: Pinned Linux colour runtime
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Load runtime pin
        run: cat ci/runtime_pin.env >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          repository: cjcj-dev/cangjie-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: runtime-source
      - uses: ./.github/actions/sccache
        with:
          component: runtime
          platform: ubuntu-22.04
          pin: ${{ env.RUNTIME_REF }}
          cache-size: 1G
      - name: Fetch pinned H48 language tuple
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ci/release/publish_language_tuple.py fetch \
            --pin ci/h48_language_tuple_pin.json --output "$RUNNER_TEMP/h48-download"
      - name: Provision native gate debugger
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
      - name: Build runtime and native gate
        id: runtime-build
        env:
          RUNTIME_BUILD_TYPE: relwithdebinfo
          # The target pair must exist before it can be installed in the private
          # language SDK. The complete gate below is mandatory before upload.
          GC_UNIT_GATE_LANGUAGE_TESTS: defer
        run: |
          source ci/platform_matrix/runtime_core_setup.sh || echo "::warning::Core setup incomplete; see setup.log"
          npx --yes zx@8 ci/platform_matrix/build_runtime.mjs
      - name: Complete gate with pinned language tuple and same-build target
        run: |
          bash ci/release/gate_colour_runtime.sh runtime-source \
            "$RUNNER_TEMP/h48-download/installed/tuple" "$RUNNER_TEMP/h48-active" \
            .platform-ci/runtime-install
      - name: Load same-generation AST SDK inputs
        run: cat ci/ast_support/linux_x86_64.env >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.AST_SUPPORT_ARTIFACT_ID }}
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.AST_SUPPORT_RUN_ID }}
          path: ${{ runner.temp }}/ast-support
      - name: Rebuild and install alpha.06 std with coloured cjc
        run: |
          bash ci/release/build_colour_std.sh runtime-source "$RUNNER_TEMP/h48-active" \
            "$RUNNER_TEMP/ast-support" .platform-ci/runtime-install
      - name: Package same-build runtime pair
        id: package
        run: |
          # Use the exact published pair selected and verified by the gate.
          # The output layout also retains staging and earlier configurations.
          source "$RUNNER_TEMP/h48-active.env"
          cp "$GCV2_RUNTIME_LIB_DIR/libboundscheck.so" .platform-ci/runtime-install/runtime/lib/linux_x86_64_cjnative/libboundscheck.so
          node ci/release/colour_runtime.mjs .platform-ci/runtime-install colour-runtime
          nm --defined-only colour-runtime/runtime/lib/linux_x86_64_cjnative/libcangjie-runtime.so > colour-runtime/symbols.txt
          test "$(grep -Ec ' g_cjLoadBadMask(@@?[^[:space:]]+)?$' colour-runtime/symbols.txt)" = 1
          nm -D --defined-only colour-runtime/runtime/lib/linux_x86_64_cjnative/libcangjie-runtime.so > colour-runtime/exports.txt
          test "$(grep -Ec ' g_cjLoadBadMask(@@?[^[:space:]]+)?$' colour-runtime/exports.txt)" = 1
      - uses: actions/upload-artifact@v7
        id: artifact
        with:
          name: colour-runtime-linux_x86_64
          path: colour-runtime/
          if-no-files-found: error
          retention-days: 7
      - name: Emit consumer pin
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          MANIFEST_SHA: ${{ steps.package.outputs.sha256 }}
        run: |
          {
            echo "COLOUR_RT_RUN_ID=$GITHUB_RUN_ID"
            echo "COLOUR_RT_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "COLOUR_RT_ARTIFACT_ID=$ARTIFACT_ID"
            echo "COLOUR_RT_MANIFEST_SHA256=$MANIFEST_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache-report
        with:
          component: runtime
          platform: ubuntu-22.04
          require-compiles: ${{ job.status == 'success' }}

      - name: Report runtime gate log availability
        if: always()
        shell: bash
        run: |
          shopt -s globstar nullglob
          logs=(runtime-source/runtime/**/gate_run.log)
          if (( ${#logs[@]} == 0 )); then
            echo "::warning::No runtime gate_run.log found; the build may have stopped before the gate ran."
          else
            printf 'Runtime gate log: %s\n' "${logs[@]}"
          fi
      - name: Collect runtime core backtraces
        if: ${{ failure() && steps.runtime-build.outcome == 'failure' }}
        run: python3 ci/platform_matrix/collect_runtime_cores.py
      - name: Upload runtime gate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colour-runtime-gate-diagnostics
          path: |
            ci/runtime_pin.env
            ci/h48_language_tuple_pin.json
            ${{ runner.temp }}/h48-active.env
            ${{ steps.runtime-build.outcome == 'failure' && '.platform-ci/runtime-gate-diagnostics/' || '' }}
            runtime-source/runtime/**/gate_run.log
            runtime-source/runtime/**/gc_unit_gate.status
            runtime-source/runtime/**/runtime-build-config.txt
            runtime-source/runtime/tests/gc_unit/build*/**/*.log
            runtime-source/runtime/tests/gc_unit/build*/**/*.sha256
            runtime-source/runtime/tests/gc_unit/build*/**/gate_tally.txt
            runtime-source/runtime/tests/gc_unit/build*/**/*.receipt
            runtime-source/runtime/tests/gc_unit/build*/**/*identity*
            runtime-source/runtime/tests/gc_unit/build*/**/*provenance*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  fixed-llvm-tuples:
    if: ${{ !inputs.linux_native_only && !inputs.runtime_only && !inputs.std_evidence_only && !inputs.darwin_runtime_only && !inputs.darwin_host_only && !inputs.darwin_verify_only }}
    name: Build fixed LLVM tuples
    uses: ./.github/workflows/platform-tuples.yml

  patched-cjpm:
    if: ${{ !inputs.linux_native_only && !inputs.runtime_only && !inputs.std_evidence_only && !inputs.darwin_runtime_only && !inputs.darwin_host_only && !inputs.darwin_verify_only }}
    name: Build patched cjpm
    uses: ./.github/workflows/build-cjpm.yml
    secrets: inherit

  windows-runtime:
    if: ${{ !inputs.linux_native_only && !inputs.runtime_only && !inputs.std_evidence_only && !inputs.darwin_runtime_only && !inputs.darwin_host_only && !inputs.darwin_verify_only }}
    name: Build Windows runtime
    uses: ./.github/workflows/build-windows-runtime.yml
    with:
      version: 1.2.0-alpha.20260721165458

  platform:
    name: ${{ matrix.runner }} / runtime + cjcj + smoke
    needs: [fixed-llvm-tuples, patched-cjpm, windows-runtime]
    if: ${{ always() && !inputs.linux_native_only && !inputs.runtime_only && !inputs.std_evidence_only && !inputs.darwin_runtime_only && !inputs.darwin_host_only && !inputs.darwin_verify_only }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            llvm_platform: darwin_aarch64
            sdk_runtime_dir: darwin_aarch64_cjnative
          - runner: macos-26-intel
            llvm_platform: darwin_x86_64
            sdk_runtime_dir: darwin_x86_64_cjnative
          - runner: macos-15
            llvm_platform: darwin_aarch64
            sdk_runtime_dir: darwin_aarch64_cjnative
          - runner: macos-15-intel
            llvm_platform: darwin_x86_64
            sdk_runtime_dir: darwin_x86_64_cjnative
          - runner: ubuntu-24.04
            llvm_platform: linux_x86_64
            sdk_runtime_dir: linux_x86_64_cjnative
          - runner: ubuntu-24.04-arm
            llvm_platform: linux_aarch64
            sdk_runtime_dir: linux_aarch64_cjnative
          - runner: ubuntu-22.04
            llvm_platform: linux_x86_64
            sdk_runtime_dir: linux_x86_64_cjnative
          - runner: ubuntu-22.04-arm
            llvm_platform: linux_aarch64
            sdk_runtime_dir: linux_aarch64_cjnative
          - runner: windows-2025
            llvm_platform: windows_x86_64
            sdk_runtime_dir: windows_x86_64_cjnative
          - runner: windows-2022
            llvm_platform: windows_x86_64
            sdk_runtime_dir: windows_x86_64_cjnative
    env:
      MATRIX_RUNNER: ${{ matrix.runner }}
      SDK_RUNTIME_DIR: ${{ matrix.sdk_runtime_dir }}

    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Load host toolchain pin
        shell: bash
        run: cat ci/cjpm_pin.env >> "$GITHUB_ENV"

      - name: Load runtime pin
        shell: bash
        run: cat ci/runtime_pin.env >> "$GITHUB_ENV"

      # The consolidated cangjie-runtime main already carries the GC and Darwin
      # fixes; no per-runner patch overlay is needed.
      - name: Checkout pinned runtime
        if: always() && runner.os != 'Windows'
        uses: actions/checkout@v7
        with:
          repository: cjcj-dev/cangjie-runtime
          ref: ${{ env.RUNTIME_REF }}
          fetch-depth: 1
          path: runtime-source

      - name: Prepare MSYS2/MINGW64 cjcj toolchain
        if: always() && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # release:false = provision the runner's preinstalled C:\msys64 instead of a
          # fresh RUNNER_TEMP\msys64; build_cjcj.mjs stages the MINGW64 tuple DLLs
          # from C:\msys64\mingw64\bin next to the fixed llc.
          release: false
          update: true
          path-type: inherit
          install: >-
            git make python gzip unzip file binutils
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-compiler-rt
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libc++
            mingw-w64-x86_64-libunwind
            mingw-w64-x86_64-ninja

      - name: Start sccache
        if: always() && runner.os != 'Windows'
        uses: ./.github/actions/sccache
        with:
          component: runtime
          platform: ${{ matrix.runner }}
          pin: ${{ env.RUNTIME_REF }}
          cache-size: 1G

      - name: Runtime build (Linux/macOS native)
        if: always() && runner.os != 'Windows'
        run: npx --yes zx@8 ci/platform_matrix/build_runtime.mjs

      - name: Download cross-built Windows runtime
        if: always() && runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: runtime-install-windows_x86_64
          path: .platform-ci/runtime-install/windows_release_x86_64

      - name: Verify cross-built Windows runtime
        if: always() && runner.os == 'Windows'
        run: npx --yes zx@8 ci/platform_matrix/verify_windows_runtime_exports.mjs

      - name: Download current-run fixed LLVM tuple
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: fixed-llvm-tools-${{ matrix.llvm_platform }}
          path: ${{ runner.temp }}/current-run-fixed-llvm

      - name: Download native fixed LLVM tuple
        if: always() && runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          TUPLE_ARTIFACT_DIR: ${{ runner.temp }}/current-run-fixed-llvm
        run: npx --yes zx@8 ci/platform_matrix/fetch_llvm_tuple.mjs

      - name: Download native fixed LLVM tuple (Windows)
        if: always() && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          TUPLE_ARTIFACT_DIR: ${{ runner.temp }}/current-run-fixed-llvm
        run: npx --yes zx@8 ci/platform_matrix/fetch_llvm_tuple.mjs

      - name: Official SDK provision (Windows)
        if: always() && runner.os == 'Windows'
        env:
          CJCJ_SDK_PROVISION_ONLY: '1'
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
        run: npx --yes zx@8 ci/platform_matrix/build_cjcj.mjs

      - name: Download current-run patched cjpm
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: patched-cjpm-windows_x86_64
          path: ${{ runner.temp }}/current-run-patched-cjpm

      - name: Install patched cjpm (Windows)
        id: fetch-cjpm
        if: always() && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          CJPM_ARTIFACT_DIR: ${{ runner.temp }}/current-run-patched-cjpm
        run: npx --yes zx@8 ci/platform_matrix/fetch_cjpm.mjs

      - name: Official SDK + O1 cjcj build
        if: always() && runner.os != 'Windows'
        env:
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
        run: npx --yes zx@8 ci/platform_matrix/build_cjcj.mjs

      - name: O1 cjcj build (Windows)
        if: always() && runner.os == 'Windows' && steps.fetch-cjpm.outcome == 'success'
        env:
          CJCJ_SDK_ALREADY_PROVISIONED: '1'
        run: npx --yes zx@8 ci/platform_matrix/build_cjcj.mjs

      - name: cjcj compile/run + pinned-runtime combination smoke
        if: always()
        run: npx --yes zx@8 ci/platform_matrix/run_smoke.mjs

      - name: Report sccache
        if: always() && runner.os != 'Windows'
        uses: ./.github/actions/sccache-report
        with:
          component: runtime
          platform: ${{ matrix.runner }}
          require-compiles: ${{ job.status == 'success' }}

      - name: Summarize final key error
        if: always()
        run: npx --yes zx@8 ci/platform_matrix/summarize_job.mjs

      - name: Upload diagnostics and key products
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.runner }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            .platform-ci/logs/**
            .platform-ci/step-summary.md
            .platform-ci/runtime-install/**
            .platform-ci/bin/**
