name: Independent official H input identity contract
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ci/bootstrap/stage1_host*'
      - 'ci/bootstrap/sdk-host-inputs.integration.test.mjs'
      - 'ci/host_sdk_pin.env'
      - 'ci/release/host_llvm.mjs'
      - '.github/workflows/test-host-identities.yml'
permissions:
  contents: read
  actions: read
jobs:
  aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read fixed native archive and host LLVM provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          node ci/release/host_llvm.mjs env >> "$GITHUB_ENV"
          source ci/host_sdk_pin.env
          CJCJ_TOOLCHAIN="$(node ci/host-toolchain-pin.mjs)"
          export CJCJ_TOOLCHAIN
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          prefix = '# HOST_SDK_PROVENANCE '
          rows = [json.loads(line[len(prefix):]) for line in Path('ci/bootstrap/stage1_host_identities.txt').read_text().splitlines() if line.startswith(prefix)]
          rows = [row for row in rows if row['platform'] == 'linux_aarch64']
          assert len(rows) == 1
          pin = rows[0]
          version = os.environ['CJCJ_TOOLCHAIN'].removeprefix('nightly-')
          assert pin['archive'] == f'cangjie-sdk-linux-aarch64-{version}.tar.gz'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f"SDK_ARCHIVE={pin['archive']}\nSDK_SHA256={pin['sha256']}\nSDK_VERSION={version}\n")
          PY
      - name: Download verified prerelease input
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/release/download_pinned.mjs cjcj-dev/cjcj "${{ env.HOST_LLVM_ARTIFACT_ID }}" "${{ runner.temp }}/host-llvm"
      - name: Get the fixed official SDK archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --max-time 300 \
            "https://gitcode.com/Cangjie/nightly_build/releases/download/$SDK_VERSION/$SDK_ARCHIVE" \
            -o "$RUNNER_TEMP/$SDK_ARCHIVE"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/$SDK_ARCHIVE" | sha256sum --check
          mkdir "$RUNNER_TEMP/fixed-sdk"
          tar -xzf "$RUNNER_TEMP/$SDK_ARCHIVE" -C "$RUNNER_TEMP/fixed-sdk"
      - name: Verify original official H archive and separate repaired H producer
        shell: bash
        env:
          HOST_IDENTITY_SDK: ${{ runner.temp }}/fixed-sdk/cangjie
          HOST_IDENTITY_ARCHIVE: ${{ runner.temp }}/${{ env.SDK_ARCHIVE }}
          HOST_IDENTITY_LLVM: ${{ runner.temp }}/host-llvm/libLLVM-15.so
          HOST_IDENTITY_LLVM_ARTIFACT: ${{ runner.temp }}/host-llvm
        run: |
          set -euo pipefail
          ulimit -c 0
          mkdir -p "$RUNNER_TEMP/identity-evidence"
          uname -a > "$RUNNER_TEMP/identity-evidence/machine.txt"
          uptime >> "$RUNNER_TEMP/identity-evidence/machine.txt"
          node ci/bootstrap/sdk-host-inputs.integration.test.mjs > "$RUNNER_TEMP/identity-evidence/inputs.log" 2>&1
          uptime >> "$RUNNER_TEMP/identity-evidence/machine.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-host-identities-aarch64
          path: ${{ runner.temp }}/identity-evidence
          if-no-files-found: warn
