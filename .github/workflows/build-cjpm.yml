name: Patched cjpm for Windows

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      GITCODE_API_KEY:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-cjpm:
    name: patched cjpm / windows_x86_64 / windows-2022
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Load cjpm pin
        id: cjpm-pin
        run: |
          cat ci/source_pin.env >> "$GITHUB_ENV"
          source ci/source_pin.env
          source ci/host_sdk_pin.env
          CJCJ_TOOLCHAIN=$(node ci/host-toolchain-pin.mjs)
          export CJCJ_TOOLCHAIN
          echo "CJCJ_TOOLCHAIN=$CJCJ_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "ref=$TOOLS_REF" >> "$GITHUB_OUTPUT"
          echo "toolchain=$CJCJ_TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Restore patched cjpm cache
        id: cjpm-cache
        uses: actions/cache@v6
        with:
          path: patched-cjpm/windows_x86_64
          key: cjpm-win-${{ steps.cjpm-pin.outputs.ref }}-${{ steps.cjpm-pin.outputs.toolchain }}

      - name: Prepare MSYS2/MinGW build toolchain
        if: steps.cjpm-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            git gzip python cmake make
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libc++
            mingw-w64-x86_64-libunwind
            mingw-w64-x86_64-make
            mingw-w64-x86_64-python

      - name: Install pinned Cangjie SDK with stdx
        if: steps.cjpm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
        run: |
          $cjvRoot = Join-Path $env:USERPROFILE '.local\bin'
          $archive = Join-Path $env:RUNNER_TEMP 'cjv_windows_amd64.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'cjv-windows'
          New-Item -ItemType Directory -Force $cjvRoot | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/Zxilly/cjv/releases/download/v0.2.20/cjv_windows_amd64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $downloaded = Get-ChildItem -Path $extract -Filter cjv.exe -Recurse | Select-Object -First 1
          if (-not $downloaded) { throw 'cjv.exe missing from downloaded archive' }
          Copy-Item -LiteralPath $downloaded.FullName -Destination (Join-Path $cjvRoot 'cjv.exe') -Force
          $env:PATH = "$cjvRoot;$env:PATH"
          if ($env:GITCODE_API_KEY) { cjv set gitcode-api-key $env:GITCODE_API_KEY }
          cjv install $env:CJCJ_TOOLCHAIN -c stdx
          $cjvRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch selected cjcj-tools source
        if: steps.cjpm-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: node ci/release/build_cjpm.mjs fetch

      - name: Build Cangjie cjpm
        if: steps.cjpm-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: MINGW_PATH="$(cygpath -w /mingw64)" node ci/release/build_cjpm.mjs build

      - name: Verify patched cjpm payload
        run: |
          node ci/release/prepare_cjpm_artifact.mjs \
            --platform windows-x64 \
            --binary patched-cjpm/windows_x86_64/cjpm.exe \
            --outdir "$RUNNER_TEMP/cjpm-provenance"
          cp "$RUNNER_TEMP/cjpm-provenance/cjpm.exe" patched-cjpm/windows_x86_64/cjpm.exe
          gzip -n -c -9 patched-cjpm/windows_x86_64/cjpm.exe > patched-cjpm/windows_x86_64/cjpm.exe.gz
          cp "$RUNNER_TEMP/cjpm-provenance/CJPM-PROVENANCE.json" \
            patched-cjpm/windows_x86_64/CJPM-PROVENANCE.json
          test -s patched-cjpm/windows_x86_64/cjpm.exe.gz
          test -s patched-cjpm/windows_x86_64/CJPM-PROVENANCE.json

      - name: Upload patched cjpm
        uses: actions/upload-artifact@v7
        with:
          name: patched-cjpm-windows_x86_64
          path: |
            patched-cjpm/windows_x86_64/cjpm.exe.gz
            patched-cjpm/windows_x86_64/CJPM-PROVENANCE.json
          if-no-files-found: error
          retention-days: 14
