# Release. Repackages the official SDK tree as a cjcj SDK: bin/cjc is our
# Cangjie-built compiler and runtime/lib/<plat>/libcangjie-runtime.{so,dylib,dll} is rebuilt
# from the pinned cjcj-dev/cangjie-runtime main commit. The Windows runtime is
# cross-built with the official source-pinned MinGW toolchain. Smoke runs against the
# packaged bin/cjc. Linux x64/arm64, macOS x64/arm64, and Windows x64 are
# enabled; set dry_run to build artifacts without publishing.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.0.1"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: true
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Build artifacts only, skip GitHub release"
        required: false
        type: boolean
        default: false
      runtime_ref:
        description: "Dry-run only: test an exact 40-character runtime commit instead of ci/runtime_pin.env"
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

env:
  CJCJ_TOOLCHAIN: nightly-1.2.0-alpha.20260721165458
  # RUNTIME_REF comes from ci/runtime_pin.env via the "Load runtime pin" step —
  # the pin lives in exactly one file (a stale copy here once poisoned the
  # runtime cache key while the build itself followed the pin file).

jobs:
  source-final-std:
    name: Build source SDK and final std artifacts
    uses: ./.github/workflows/srcbuild.yml
    with:
      build_type: relwithdebinfo
      dry_run: ${{ inputs.dry_run }}
      runtime_ref: ${{ inputs.runtime_ref }}

  windows-fixed-llvm-tuple:
    name: Build Windows LLVM tuple
    uses: ./.github/workflows/platform-tuples.yml
    with:
      platform_set: windows-only

  patched-cjpm:
    name: Build patched cjpm
    uses: ./.github/workflows/build-cjpm.yml
    secrets: inherit

  windows-runtime:
    name: Build Windows runtime
    uses: ./.github/workflows/build-windows-runtime.yml
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
      runtime_ref: ${{ inputs.runtime_ref }}
    secrets: inherit

  build:
    name: ${{ matrix.platform }} / Build release
    needs: [source-final-std, windows-fixed-llvm-tuple, patched-cjpm, windows-runtime]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x64, llvm_platform: linux_x86_64, sdk_runtime_dir: linux_x86_64_cjnative, std_artifact: final-std-linux-x64, cross_std_artifact: final-std-windows-x64, cross_std_tuple: windows_x86_64_cjnative}
          # linux-aarch64 re-enabled 0724: the R1 llc SEGV was the un-activated
          # fixed llc (setup only mapped Linux/x86_64, fixed in 8e2f9ea6); the
          # arm-soak ×20 packaged smoke run 30069890604 passed clean.
          - { runner: ubuntu-24.04-arm, platform: linux-aarch64, llvm_platform: linux_aarch64, sdk_runtime_dir: linux_aarch64_cjnative, std_artifact: final-std-linux-aarch64, cross_std_artifact: final-std-windows-x64, cross_std_tuple: windows_x86_64_cjnative}
          - { runner: macos-15-intel, platform: darwin-x64, llvm_platform: darwin_x86_64, sdk_runtime_dir: darwin_x86_64_cjnative, std_artifact: final-std-darwin-x64 }
          - { runner: macos-15, platform: darwin-arm64, llvm_platform: darwin_aarch64, sdk_runtime_dir: darwin_aarch64_cjnative, std_artifact: final-std-darwin-arm64 }
          - { runner: windows-2025, platform: windows-x64, llvm_platform: windows_x86_64, sdk_runtime_dir: windows_x86_64_cjnative, std_artifact: final-std-windows-x64 }
    uses: ./.github/workflows/build-release-package.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      llvm_platform: ${{ matrix.llvm_platform }}
      sdk_runtime_dir: ${{ matrix.sdk_runtime_dir }}
      std_artifact: ${{ matrix.std_artifact }}
      cross_std_artifact: ${{ matrix.cross_std_artifact || '' }}
      cross_std_tuple: ${{ matrix.cross_std_tuple || '' }}
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
      runtime_ref: ${{ inputs.runtime_ref }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [source-final-std, windows-fixed-llvm-tuple, patched-cjpm, windows-runtime, build]
    if: >-
      ${{
        always() &&
        !inputs.dry_run &&
        needs.source-final-std.result == 'success' &&
        needs.windows-fixed-llvm-tuple.result == 'success' &&
        needs.patched-cjpm.result == 'success' &&
        needs.windows-runtime.result == 'success' &&
        needs.build.result == 'success'
      }}
    environment:
      name: release-draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7
      - name: Verify manual approval environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/environments/release-draft" \
            | jq -e '
                [.protection_rules[]
                 | select(.type == "required_reviewers")
                 | select(.prevent_self_review == true)
                 | select((.reviewers | length) >= 1)]
                | length == 1
              '
      - name: Download SDK artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Render release notes from package manifests
        run: |
          node scripts/render_release_notes.mjs \
            --version "${{ inputs.version }}" \
            --dist dist \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--title "cjcj v${{ inputs.version }}" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          if [ "${{ inputs.draft }}" = "true" ]; then flags+=(--draft); fi
          mapfile -t assets < <(find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.zip' -o -name '*.RELEASE-MANIFEST.jsonl' \) | sort)
          gh release create "v${{ inputs.version }}" "${flags[@]}" "${assets[@]}"

# Source-build owns the four native LLVM artifacts; platform-tuples.yml owns
# only the Windows tuple. Each release cell consumes final-std-${platform} from
# the same matrix row, and artifact download failure is intentionally gating.
