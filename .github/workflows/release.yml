name: Release
'on':
  workflow_dispatch:
    inputs:
      version:
        description: SDK version
        type: string
        required: true
        default: 0.0.2
      prepare_run_id:
        description: Successful Prepare run
        type: string
        required: true
      ci_run_id:
        description: Successful CI run for this commit
        type: string
        required: false
      dry_run:
        description: Build and verify without publishing
        type: boolean
        required: false
        default: true
      prerelease:
        description: Mark as prerelease
        type: boolean
        required: false
        default: true
      draft:
        description: Create a draft release
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  host-sdk:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux-x64
          runner: ubuntu-24.04
        - platform: linux-aarch64
          runner: ubuntu-24.04-arm
        - platform: darwin-arm64
          runner: macos-15
        - platform: windows-x64
          runner: windows-2025
    env:
      CJCJ_HEAP_SIZE: ${{ vars.cjHeapSize }}
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ inputs.version }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Read tool versions
      run: node -e 'const p=require("./build/pins.json").toolchains; console.log("node="+p.node+"\nsccache="+p.sccache)' >> "$GITHUB_OUTPUT"
      id: pins
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ steps.pins.outputs.node }}
    - name: Enable Linux bootstrap swap
      if: runner.os == 'Linux'
      run: node build/setup.mjs swap
    - name: Select successful Prepare run
      run: |-
        id="$PREPARE_RUN"
        [[ "$id" =~ ^[0-9]+$ ]]
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '[.path,.conclusion] | join(" ")' | grep -Fx '.github/workflows/prepare.yml success'
        echo "run=$id" >> "$GITHUB_OUTPUT"
      id: prepare
      env:
        GH_TOKEN: ${{ github.token }}
        PREPARE_RUN: ${{ inputs.prepare_run_id }}
    - uses: actions/download-artifact@v8.0.2
      with:
        name: native-base-${{ matrix.platform }}
        github-token: ${{ github.token }}
        run-id: ${{ steps.prepare.outputs.run }}
    - name: Unpack native base
      run: |-
        mkdir -p ../base
        node build/setup.mjs unpack --archive native-base.tar --dir ../base
        rm native-base.tar
    - name: Fetch bootstrap and SDK sources
      run: node build/setup.mjs sources --out ../src --repos runtime,bounds,pcre2,tools,stdx,javaInterop,compiler --override "runtime=$(cat ../base/runtime.ref)"
    - uses: ./.github/actions/native-windows-tools
      with:
        native-compiler: 'true'
      if: runner.os == 'Windows'
    - name: Install build dependencies
      run: node build/setup.mjs deps --platform "$PLATFORM" --mode full
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
      if: env.PLATFORM == 'linux-x64' || env.PLATFORM == 'windows-x64'
    - name: Build H1 with the official SDK
      run: node build/build-compiler.mjs --stage stage0 --host-sdk ../base/host --native ../base/native --runtime ../base/runtime --out
        ../stage0
    - name: Bootstrap the standard library
      run: |-
        node build/build-stdlib.mjs --stage std-bootstrap --sources ../src --runtime ../base/runtime --sdk ../stage0 --out ../initial
        rm -rf ../stage0 ../stage0.target
    - name: Rebuild the standard library using the bootstrap modules
      run: |-
        node build/build-stdlib.mjs --stage stage1-std --sources ../src --runtime ../base/runtime --sdk ../initial --out ../stage1
    - name: Build stage 2
      run: |-
        node build/build-compiler.mjs --stage stage2 --sdk ../initial --std ../stage1 --native ../base/native --host-sdk ../base/host --out ../stage2 --version "$VERSION"
        rm -rf ../initial ../stage1
    - name: Archive the cross-build SDK and source selections
      run: |-
        cp ../base/*.ref ../stage2/
        node build/setup.mjs pack --archive stage2.tar --dir ../stage2
        rm ../stage2/{llvm,runtime}.ref
      if: matrix.platform == 'linux-x64' || matrix.platform == 'darwin-arm64'
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: stage2-sdk-${{ matrix.platform }}
        path: stage2.tar
        if-no-files-found: error
        compression-level: 0
      if: matrix.platform == 'linux-x64' || matrix.platform == 'darwin-arm64'
    - name: Build final std
      run: |-
        node build/build-stdlib.mjs --stage stage3-std --sources ../src --runtime ../base/runtime --sdk ../stage2 --include ../base/native/include --local-mode-api --out ../final-std
    - name: Build stage 3
      run: |-
        node build/build-compiler.mjs --stage stage3 --sdk ../stage2 --std ../final-std --native ../base/native --host-sdk ../base/host --out ../host-sdk --version "$VERSION"
        rm -rf ../stage2 ../final-std
    - name: Prepare the Java annotation processor
      run: mvn -q dependency:copy -Dartifact=org.projectlombok:lombok:1.18.36 -DoutputDirectory=../jars
      if: env.PLATFORM == 'linux-x64' || env.PLATFORM == 'windows-x64'
    - name: Build stdx, SDK tools and applicable interop libraries
      run: |-
        suffix=""
        [[ "$PLATFORM" != windows-x64 ]] || suffix=.exe
        node build/build-extras.mjs --sdk ../host-sdk --include ../base/native/include --host-sdk ../base/host --sources ../src --cjbind "../base/tools/cjbind$suffix" --lombok ../jars/lombok-1.18.36.jar
    - name: Archive host SDK
      run: node build/setup.mjs pack --archive host-sdk.tar --dir ../host-sdk
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: host-sdk-${{ matrix.platform }}
        path: host-sdk.tar
        if-no-files-found: error
        compression-level: 0
    - name: Archive Linux libraries for the Windows Android package
      if: matrix.platform == 'linux-x64'
      run: node build/setup.mjs pack --linux-overlay --archive cross.tar --dir ../host-sdk
    - uses: actions/upload-artifact@v7.0.2
      if: matrix.platform == 'linux-x64'
      with:
        name: cross-std-linux-x64
        path: cross.tar
        if-no-files-found: error
        compression-level: 0
    - name: Archive Windows libraries for cross packages
      if: matrix.platform == 'windows-x64'
      run: node build/setup.mjs pack --windows-overlay --archive cross.tar --dir ../host-sdk
    - uses: actions/upload-artifact@v7.0.2
      if: matrix.platform == 'windows-x64'
      with:
        name: cross-std-windows-x64
        path: cross.tar
        if-no-files-found: error
        compression-level: 0
    - name: Read package matrix
      run: node --input-type=module -e 'import {RELEASE_TARGETS as include} from "./build/common.mjs"; console.log("packages="+JSON.stringify({include}))'
        >> "$GITHUB_OUTPUT"
      id: matrix
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
  host-sdk-darwin-x64:
    needs: host-sdk
    runs-on: macos-15
    env:
      CJCJ_HEAP_SIZE: ${{ vars.cjHeapSize }}
      VERSION: ${{ inputs.version }}
    steps:
    - uses: actions/checkout@v7.0.1
    - id: pins
      run: node -e 'console.log("node="+require("./build/pins.json").toolchains.node)' >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ steps.pins.outputs.node }}
        architecture: arm64
    - uses: actions/download-artifact@v8.0.2
      with:
        name: native-base-darwin-x64
        github-token: ${{ github.token }}
        run-id: ${{ inputs.prepare_run_id }}
    - uses: actions/download-artifact@v8.0.2
      with:
        name: stage2-sdk-darwin-arm64
    - name: Unpack stage 2 and matching target native base
      run: |
        node build/setup.mjs unpack --archive native-base.tar --dir ../base
        node build/setup.mjs unpack --archive stage2.tar --dir ../stage2 --sdk-root .
        rm native-base.tar stage2.tar
        cmp ../base/runtime.ref ../stage2/runtime.ref
        cmp ../base/llvm.ref ../stage2/llvm.ref
        node build/setup.mjs sources --repos runtime,bounds,pcre2,tools,stdx,compiler --out ../src --override "runtime=$(cat ../base/runtime.ref)"
    - name: Install dependencies and the ARM64 cjpm used to drive stage 2
      run: |
        node build/setup.mjs deps --platform darwin-x64 --mode full
        node build/setup.mjs host-sdk --platform darwin-arm64 --out ../arm-host
    - name: Cross-build final std, stage 3 and stdx with ARM64 stage 2
      run: |
        node build/build-stdlib.mjs --stage stage3-std --platform darwin-x64 --sdk ../stage2 --sources ../src --runtime ../base/runtime --native ../base/native --include ../base/native/include --local-mode-api --out ../final-std
        node build/build-compiler.mjs --stage stage3 --platform darwin-x64 --sdk ../stage2 --std ../final-std --native ../base/native --host-sdk ../arm-host --out ../host-sdk --version "$VERSION"
        rm -rf ../final-std ../host-sdk.target ../arm-host
        node build/build-extras.mjs --only stdx --platform darwin-x64 --sdk ../host-sdk --host-sdk ../stage2 --sources ../src --include ../base/native/include
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ steps.pins.outputs.node }}
        architecture: x64
    - name: Build x64 tools under Rosetta and archive the host SDK
      run: |
        node build/build-extras.mjs --only tools --platform darwin-x64 --sdk ../host-sdk --host-sdk ../base/host --sources ../src --include ../base/native/include --cjbind ../base/tools/cjbind
        node build/setup.mjs pack --archive host-sdk.tar --dir ../host-sdk
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: host-sdk-darwin-x64
        path: host-sdk.tar
        if-no-files-found: error
        compression-level: 0
  cross-std:
    needs: host-sdk
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: android-aarch64
          host: linux-x64
          runner: ubuntu-24.04
          kind: android-ndk
        - target: ohos-aarch64
          host: linux-x64
          runner: ubuntu-24.04
          kind: ohos
        - target: ohos-x86_64
          host: linux-x64
          runner: ubuntu-24.04
          kind: ohos
        - target: wasm32-wasi
          host: linux-x64
          runner: ubuntu-24.04
          kind: wasi
        - target: ios-aarch64
          host: darwin-arm64
          runner: macos-15
          kind: xcode-ios
        - target: ios-simulator-aarch64
          host: darwin-arm64
          runner: macos-15
          kind: xcode-ios
        - target: ios-simulator-x86_64
          host: darwin-arm64
          runner: macos-15
          kind: xcode-ios
    env:
      PLATFORM: ${{ matrix.host }}
      TARGET: ${{ matrix.target }}
      KIND: ${{ matrix.kind }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Read tool versions
      run: node -e 'const p=require("./build/pins.json").toolchains; console.log("node="+p.node+"\nsccache="+p.sccache)' >> "$GITHUB_OUTPUT"
      id: pins
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ steps.pins.outputs.node }}
    - uses: actions/download-artifact@v8.0.2
      with:
        name: stage2-sdk-${{ matrix.host }}
    - name: Unpack stage 2 and fetch matching sources
      run: |-
        mkdir -p ../stage2
        node build/setup.mjs unpack --archive stage2.tar --dir ../stage2 --sdk-root .
        repos=runtime,bounds,pcre2
        overrides=(--override "runtime=$(cat ../stage2/runtime.ref)")
        if [[ "$TARGET" != wasm32-wasi ]]; then repos+=,compiler,llvm,flatbuffers; overrides+=(--override "llvm=$(cat ../stage2/llvm.ref)"); fi
        node build/setup.mjs sources --repos "$repos" --out ../src "${overrides[@]}"
    - name: Install build dependencies
      run: node build/setup.mjs deps --platform "$PLATFORM" --mode full
    - name: Install cross SDK
      run: node build/setup.mjs cross-sdk --kind "$KIND" --out ../cross-sdk
    - name: Build cross runtime and stdlib
      run: |-
        node build/build-runtime.mjs --sdk ../stage2 --cross "$TARGET" --sources ../src --out ../runtime
        include=()
        if [[ "$TARGET" != wasm32-wasi ]]; then include=(--include ../src/compiler/include); fi
        node build/build-stdlib.mjs --sdk ../stage2 --cross "$TARGET" --sources ../src --runtime ../runtime --out ../cross "${include[@]}"
        node build/setup.mjs pack --dereference --archive cross.tar --dir ../cross
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: cross-std-${{ matrix.target }}
        path: cross.tar
        if-no-files-found: error
        compression-level: 0
  package:
    needs:
    - host-sdk
    - host-sdk-darwin-x64
    - cross-std
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host-sdk.outputs.packages) }}
    env:
      PLATFORM: ${{ matrix.host }}
      CROSS: ${{ toJSON(matrix.cross) }}
      TARGET: ${{ matrix.key }}
      VERSION: ${{ inputs.version }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Read tool versions
      run: node -e 'const p=require("./build/pins.json").toolchains; console.log("node="+p.node+"\nsccache="+p.sccache)' >> "$GITHUB_OUTPUT"
      id: pins
    - name: Ensure Rosetta before selecting x64 Node
      if: matrix.host == 'darwin-x64'
      run: node build/setup.mjs rosetta --platform darwin-x64
    - uses: actions/setup-node@v7.1.0
      if: matrix.host != 'darwin-x64'
      with:
        node-version: ${{ steps.pins.outputs.node }}
    - uses: actions/setup-node@v7.1.0
      if: matrix.host == 'darwin-x64'
      with:
        architecture: x64
        node-version: ${{ steps.pins.outputs.node }}
    - uses: ./.github/actions/native-windows-tools
      with:
        native-compiler: 'true'
      if: runner.os == 'Windows'
    - uses: actions/download-artifact@v8.0.2
      with:
        name: host-sdk-${{ matrix.host }}
    - name: Unpack host and required target libraries
      run: |-
        mkdir -p ../host
        node build/setup.mjs unpack --archive host-sdk.tar --dir ../host --sdk-root .
        node --input-type=module <<'NODE'
        import {run,extractArchive} from './build/common.mjs';
        for(const target of JSON.parse(process.env.CROSS)){
          const dir='../downloads/'+target;
          run('gh',['run','download',process.env.GITHUB_RUN_ID,'--name','cross-std-'+target,'--dir',dir]);
          extractArchive(dir+'/cross.tar','../overlays/'+target);
        }
        NODE
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/setup-java@v5
      if: matrix.host == 'linux-x64' || matrix.host == 'windows-x64'
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@v8.0.2
      if: runner.os == 'Linux'
      with:
        name: runtime-tests-${{ matrix.host }}
        github-token: ${{ github.token }}
        run-id: ${{ inputs.prepare_run_id }}
    - name: Package and test relocated SDK
      run: |-
        overlays=()
        if [[ -f runtime-tests.tar ]]; then mkdir ../language; node build/setup.mjs unpack --archive runtime-tests.tar --dir ../language; overlays+=(--language-inputs ../language); fi
        for dir in ../overlays/*; do [[ ! -d "$dir" ]] || overlays+=(--cross-dir "$dir"); done
        node build/package-sdk.mjs --sdk ../host --target "$TARGET" --version "$VERSION" --out archives --verify-relocated "${overlays[@]}"
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: pkg-${{ matrix.archiveKey }}
        path: archives/*
        if-no-files-found: error
        compression-level: 0
  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Read tool versions
      run: node -e 'const p=require("./build/pins.json").toolchains; console.log("node="+p.node+"\nsccache="+p.sccache)' >> "$GITHUB_OUTPUT"
      id: pins
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ steps.pins.outputs.node }}
    - uses: actions/download-artifact@v8.0.2
      with:
        pattern: pkg-*
        merge-multiple: true
        path: archives
    - name: Verify all assets and publish tag
      run: |-
        opts=()
        [[ -z "$CI_RUN" ]] || opts+=(--ci-run-id "$CI_RUN")
        node build/package-sdk.mjs --publish --version "$VERSION" --out archives --prerelease="$PRERELEASE" --draft="$DRAFT" "${opts[@]}"
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        CI_RUN: ${{ inputs.ci_run_id }}
        PRERELEASE: ${{ inputs.prerelease }}
        DRAFT: ${{ inputs.draft }}
    if: ${{ !inputs.dry_run }}
    environment: release-publish
    permissions:
      contents: write
      actions: read
