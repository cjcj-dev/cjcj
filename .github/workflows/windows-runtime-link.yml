name: Windows runtime link controls
on:
  push:
    branches: ['sym/586-implement-r5858614396']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  link:
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: ['3c3bacda906b208db161819e51b3eea63406ac05', '1d0c8be495d4b6378fefbd27fb08135b3db288fd']
    env:
      RUNTIME_REF: ${{ matrix.runtime }}
      RUNTIME_TARGET: windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: cjcj-dev/cangjie-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: runtime-source
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          path-type: inherit
          install: >-
            git make python gzip unzip file binutils
            mingw-w64-x86_64-clang mingw-w64-x86_64-cmake
            mingw-w64-x86_64-compiler-rt mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libc++ mingw-w64-x86_64-libunwind
            mingw-w64-x86_64-ninja mingw-w64-x86_64-python mingw-w64-x86_64-lld
      - name: Preserve native cache directories
        shell: pwsh
        run: |
          $cacheHome = $env:USERPROFILE.Replace('\', '/')
          $cacheConfigHome = $env:LOCALAPPDATA.Replace('\', '/')
          "export USERPROFILE='$cacheHome' LOCALAPPDATA='$cacheConfigHome'" | Set-Content -NoNewline -Encoding utf8 C:/msys64/etc/profile.d/runtime-link.sh
      - name: Run unchanged production entry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          npx --yes zx@8 ci/platform_matrix/build_runtime.mjs *> evidence/build.log
          $rc = $LASTEXITCODE
          "baseline_rc=$rc" | Tee-Object -FilePath evidence/result.txt
          Get-Content evidence/build.log -Tail 25
          exit 0
      - name: Relink identical objects with official linker choice
        shell: msys2 {0}
        run: |
          set +e
          set -uo pipefail
          pacman -Q > evidence/packages.txt
          clang++ --version > evidence/clang.txt
          ld --version > evidence/ld.txt
          ld.lld --version > evidence/lld.txt
          cd runtime-source/runtime/CMakebuild/src
          sha256sum CMakeFiles/cangjie-runtime.dir/objects.a > ../../../../evidence/objects.sha256
          python3 - <<'PYLINK'
          from pathlib import Path
          lines = Path('../../../../evidence/build.log').read_text(encoding='utf-8-sig').splitlines()
          commands = [line.split(' && ', 1)[1] for line in lines if line.startswith('cd ') and ' && clang++.exe ' in line and '-shared ' in line]
          assert commands, 'actual DLL link command was not observed'
          command = commands[-1]
          Path('../../../../evidence/link.txt').write_text(command + '\n')
          Path('link-lld.sh').write_text(command.replace('clang++.exe ', 'clang++.exe -fuse-ld=lld ', 1) + '\n')
          PYLINK
          bash link-lld.sh > ../../../../evidence/lld-link.log 2>&1
          rc=$?
          echo "lld_relink_rc=$rc" | tee -a ../../../../evidence/result.txt
          tail -20 ../../../../evidence/lld-link.log
          sha256sum CMakeFiles/cangjie-runtime.dir/objects.a > ../../../../evidence/objects-after.sha256
          find .. -name 'libcangjie-runtime.dll' -exec sha256sum '{}' ';' > ../../../../evidence/dll.sha256
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-link-${{ matrix.runtime }}
          path: evidence/
          retention-days: 7
