name: Self-hosted source SDK and final std

on:
  workflow_call:
    inputs:
      native_runtime_artifact:
        description: Existing native-runtime-install artifact prefix
        type: string
        required: false
        default: ''
      native_runtime_run_id:
        description: Frozen producer run for native runtime installation
        type: string
        required: false
        default: ''
      native_llvm_ref:
        description: Explicit paired LLVM full commit
        type: string
        required: false
        default: ''
      native_runtime_ref:
        description: Explicit paired runtime full commit
        type: string
        required: false
        default: ''
      native_host_version:
        description: Exact official bootstrap host version for this pair
        type: string
        required: false
        default: ''
      shim_source_selection:
        description: Cjo header source repository and full commit JSON; private fixed sources require reachable repositories
        type: string
        required: false
        default: "{}"
      native_source_selection:
        description: Explicit native source repository and full commit JSON; empty preserves fixed defaults
        type: string
        required: false
        default: '{}'
      native_build_inputs_artifact:
        description: Optional native-cjdb source/dependency artifact prefix; runs the existing producer before SDK configuration
        type: string
        required: false
        default: ''
      native_build_inputs_run_id:
        description: Original run containing native-cjdb.json and its real dependencies
        type: string
        required: false
        default: ''
      source_selection:
        description: Ordinary build repository options JSON, including explicit full stdx url/tag; empty keeps defaults
        type: string
        required: false
        default: '{}'
      native_inputs_artifact:
        description: Reviewed complete native installations and exported paired tools artifact
        required: true
        type: string
      native_inputs_run_id:
        description: Original native installation producer run
        required: true
        type: string
      cangjie_ref:
        description: Optional SDK version label; source repository revisions remain pinned
        required: false
        type: string
        default: ''
      build_type:
        description: C++ SDK build type for native hosts
        required: false
        type: string
        default: relwithdebinfo
      dry_run:
        description: Authorize an exact runtime_ref override without publishing
        required: false
        type: boolean
        default: false
      runtime_ref:
        description: Dry-run only; exact runtime commit, otherwise ci/runtime_pin.env is used
        required: false
        type: string
        default: ''
      targets:
        description: >-
          Comma-separated source targets to build; "all" builds every one. A
          release phase passes its own target so it pays for that target and no
          other.
        required: false
        type: string
        default: all
      build_ohos:
        description: Build both OHOS runtime and final std tuples on the Linux source cell
        required: false
        type: boolean
        default: false
      build_ios:
        description: Build the three iOS runtime and final std tuples on Darwin ARM64
        required: false
        type: boolean
        default: false
      build_android:
        description: Build the Android runtime and final std needed by Android release packages
        required: false
        type: boolean
        default: false
      rebuild_llvm:
        description: Bypass the whole-artifact LLVM tools cache so the LLVM sccache hit rate can be measured.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      native_runtime_artifact:
        description: Existing native-runtime-install artifact prefix
        type: string
        required: false
        default: ''
      native_runtime_run_id:
        description: Frozen producer run for native runtime installation
        type: string
        required: false
        default: ''
      native_llvm_ref:
        description: Explicit paired LLVM full commit
        type: string
        required: false
        default: ''
      native_runtime_ref:
        description: Explicit paired runtime full commit
        type: string
        required: false
        default: ''
      native_host_version:
        description: Exact official bootstrap host version for this pair
        type: string
        required: false
        default: ''
      shim_source_selection:
        description: Cjo header source repository and full commit JSON; private fixed sources require reachable repositories
        type: string
        required: false
        default: "{}"
      native_source_selection:
        description: Explicit native source repository and full commit JSON; empty preserves fixed defaults
        type: string
        required: false
        default: '{}'
      native_build_inputs_artifact:
        description: Optional native-cjdb source/dependency artifact prefix; runs the existing producer before SDK configuration
        type: string
        required: false
        default: ''
      native_build_inputs_run_id:
        description: Original run containing native-cjdb.json and its real dependencies
        type: string
        required: false
        default: ''
      source_selection:
        description: Ordinary build repository options JSON, including explicit full stdx url/tag; empty keeps defaults
        type: string
        required: false
        default: '{}'
      native_inputs_artifact:
        description: Reviewed complete native installations and exported paired tools artifact
        required: true
        type: string
      native_inputs_run_id:
        description: Original native installation producer run
        required: true
        type: string
      cangjie_ref:
        description: Optional SDK version label; source repository revisions remain pinned
        required: false
        type: string
      build_type:
        description: C++ SDK build type
        required: true
        default: relwithdebinfo
        type: choice
        options: [release, relwithdebinfo, debug]
      dry_run:
        description: Authorize an exact runtime_ref override without publishing
        required: false
        type: boolean
        default: false
      runtime_ref:
        description: Dry-run only; exact runtime commit, otherwise ci/runtime_pin.env is used
        required: false
        type: string
        default: ''
      targets:
        description: >-
          Comma-separated source targets to build; "all" builds every one. A
          release phase passes its own target so it pays for that target and no
          other.
        required: false
        type: string
        default: all
      build_ohos:
        description: Build both OHOS runtime and final std tuples on the Linux source cell
        required: false
        type: boolean
        default: false
      build_ios:
        description: Build the three iOS runtime and final std tuples on Darwin ARM64
        required: false
        type: boolean
        default: false
      build_android:
        description: Build the Android runtime and final std needed by Android release packages
        required: false
        type: boolean
        default: false
      rebuild_llvm:
        description: Bypass the whole-artifact LLVM tools cache so the LLVM sccache hit rate can be measured.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Per target set, not per ref alone: release-matrix.yml calls this workflow once
# per platform in the same run, and one group for all of them would leave every
# call but one pending -- and cancel all but the newest pending one.
concurrency:
  group: srcbuild-native-${{ github.ref }}-${{ inputs.targets || 'all' }}
  cancel-in-progress: false

env:
  CJCJ_NATIVE_RUNTIME_ARTIFACT: ${{ inputs.native_runtime_artifact }}
  CJCJ_NATIVE_RUNTIME_RUN_ID: ${{ inputs.native_runtime_run_id }}
  CJCJ_NATIVE_LLVM_REF: ${{ inputs.native_llvm_ref }}
  CJCJ_NATIVE_RUNTIME_REF: ${{ inputs.native_runtime_ref }}
  CJCJ_NATIVE_HOST_VERSION: ${{ inputs.native_host_version }}
  CJCJ_NATIVE_INPUTS_ARTIFACT: ${{ inputs.native_inputs_artifact }}
  CJCJ_NATIVE_INPUTS_RUN_ID: ${{ inputs.native_inputs_run_id }}
  CJCJ_NATIVE_BUILD_INPUTS_ARTIFACT: ${{ inputs.native_build_inputs_artifact }}
  CJCJ_NATIVE_BUILD_INPUTS_RUN_ID: ${{ inputs.native_build_inputs_run_id }}
  CJCJ_NATIVE_SOURCE_SELECTION: ${{ inputs.native_source_selection }}
  CJCJ_SOURCE_SELECTION: ${{ inputs.source_selection }}

jobs:
  # Four source SDK builds are the expensive part of a release, and starting all
  # of them before phase 1 has reported anything is what the phase policy exists
  # to prevent. Selecting here lets each phase call this workflow for its own
  # target; the tuple list stays in one place.
  plan:
    name: Select targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      llvm_platforms: ${{ steps.select.outputs.llvm_platforms }}
      has_runnable: ${{ steps.select.outputs.has_runnable }}
      has_blocked: ${{ steps.select.outputs.has_blocked }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the requested targets
        id: select
        env:
          REQUESTED: ${{ inputs.targets }}
        run: node ci/srcbuild/target-matrix.mjs --targets "$REQUESTED"

  srcbuild:
    name: ${{ matrix.target }} / source SDK
    needs: plan
    if: needs.plan.outputs.has_runnable == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/srcbuild-target.yml
    with:
      native_build_inputs_artifact: ${{ inputs.native_build_inputs_artifact }}
      native_build_inputs_run_id: ${{ inputs.native_build_inputs_run_id }}
      source_selection: ${{ inputs.source_selection }}
      native_inputs_artifact: ${{ inputs.native_inputs_artifact }}
      shim_source_selection: ${{ inputs.shim_source_selection }}
      native_source_selection: ${{ inputs.native_source_selection }}
      native_inputs_run_id: ${{ inputs.native_inputs_run_id }}
      native_runtime_artifact: ${{ inputs.native_runtime_artifact }}
      native_runtime_run_id: ${{ inputs.native_runtime_run_id }}
      native_llvm_ref: ${{ inputs.native_llvm_ref }}
      native_runtime_ref: ${{ inputs.native_runtime_ref }}
      native_host_version: ${{ inputs.native_host_version }}
      targets: ${{ matrix.target }}
      cangjie_ref: ${{ inputs.cangjie_ref }}
      build_type: ${{ inputs.build_type }}
      dry_run: ${{ inputs.dry_run || false }}
      runtime_ref: ${{ inputs.runtime_ref }}
      build_android: ${{ inputs.build_android || false }}
      build_ohos: ${{ inputs.build_ohos || false }}
      build_ios: ${{ inputs.build_ios || false }}
      rebuild_llvm: ${{ inputs.rebuild_llvm || false }}

  blocked:
    name: Report blocked source targets
    needs: plan
    if: needs.plan.outputs.has_blocked == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report missing source inputs
        env:
          REQUESTED: ${{ inputs.targets }}
        run: node ci/srcbuild/target-matrix.mjs --targets "$REQUESTED" --require-ready
