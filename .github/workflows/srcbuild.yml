name: Self-hosted source SDK and final std

on:
  workflow_call:
    inputs:
      cangjie_ref:
        description: Optional SDK version label; source repository revisions remain pinned
        required: false
        type: string
        default: ''
      build_type:
        description: C++ SDK build type for native hosts
        required: false
        type: string
        default: relwithdebinfo
      dry_run:
        description: Authorize an exact runtime_ref override without publishing
        required: false
        type: boolean
        default: false
      language_tuple:
        description: Build the source language tuple from a same-run runtime artifact (Linux x64 only)
        required: false
        type: boolean
        default: false
      runtime_artifact_id:
        description: Same-run compiler runtime artifact ID for language_tuple
        required: false
        type: string
        default: ''
      runtime_manifest_sha256:
        description: Same-run compiler runtime manifest digest for language_tuple
        required: false
        type: string
        default: ''
      runtime_ref:
        description: Exact runtime commit for dry-run or language_tuple; otherwise ci/runtime_pin.env is used
        required: false
        type: string
        default: ''
      targets:
        description: >-
          Comma-separated source targets to build; "all" builds every one. A
          release phase passes its own target so it pays for that target and no
          other.
        required: false
        type: string
        default: all
      build_android:
        description: Build the Android runtime and final std needed by Android release packages
        required: false
        type: boolean
        default: false
      rebuild_llvm:
        description: Bypass the whole-artifact LLVM tools cache so the LLVM sccache hit rate can be measured.
        required: false
        type: boolean
        default: false
    outputs:
      final_compiler_linux_x64:
        description: Same-run final compiler for linux-x64
        value: ${{ jobs.artifact-contract.outputs.final_compiler_linux_x64 }}
      final_std_linux_x64:
        description: Linux x64 source-built std artifact
        value: ${{ jobs.artifact-contract.outputs.final_std_linux_x64 }}
      final_compiler_linux_aarch64:
        description: Same-run final compiler for linux-aarch64
        value: ${{ jobs.artifact-contract.outputs.final_compiler_linux_aarch64 }}
      final_std_linux_aarch64:
        description: Linux AArch64 source-built std artifact
        value: ${{ jobs.artifact-contract.outputs.final_std_linux_aarch64 }}
      final_compiler_darwin_x64:
        description: Same-run final compiler for darwin-x64
        value: ${{ jobs.artifact-contract.outputs.final_compiler_darwin_x64 }}
      final_std_darwin_x64:
        description: Darwin x64 source-built std artifact
        value: ${{ jobs.artifact-contract.outputs.final_std_darwin_x64 }}
      final_compiler_darwin_arm64:
        description: Same-run final compiler for darwin-arm64
        value: ${{ jobs.artifact-contract.outputs.final_compiler_darwin_arm64 }}
      final_std_darwin_arm64:
        description: Darwin arm64 source-built std artifact
        value: ${{ jobs.artifact-contract.outputs.final_std_darwin_arm64 }}
      final_std_windows_x64:
        description: Windows x64 source-built std artifact
        value: ${{ jobs.artifact-contract.outputs.final_std_windows_x64 }}
  workflow_dispatch:
    inputs:
      cangjie_ref:
        description: Optional SDK version label; source repository revisions remain pinned
        required: false
        type: string
      build_type:
        description: C++ SDK build type
        required: true
        default: relwithdebinfo
        type: choice
        options: [release, relwithdebinfo, debug]
      dry_run:
        description: Authorize an exact runtime_ref override without publishing
        required: false
        type: boolean
        default: false
      language_tuple:
        description: Build the source language tuple from a same-run runtime artifact (Linux x64 only)
        required: false
        type: boolean
        default: false
      runtime_artifact_id:
        description: Same-run compiler runtime artifact ID for language_tuple
        required: false
        type: string
        default: ''
      runtime_manifest_sha256:
        description: Same-run compiler runtime manifest digest for language_tuple
        required: false
        type: string
        default: ''
      runtime_ref:
        description: Exact runtime commit for dry-run or language_tuple; otherwise ci/runtime_pin.env is used
        required: false
        type: string
        default: ''
      targets:
        description: >-
          Comma-separated source targets to build; "all" builds every one. A
          release phase passes its own target so it pays for that target and no
          other.
        required: false
        type: string
        default: all
      build_android:
        description: Build the Android runtime and final std needed by Android release packages
        required: false
        type: boolean
        default: false
      rebuild_llvm:
        description: Bypass the whole-artifact LLVM tools cache so the LLVM sccache hit rate can be measured.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Per target set, not per ref alone: release-matrix.yml calls this workflow once
# per platform in the same run, and one group for all of them would leave every
# call but one pending -- and cancel all but the newest pending one.
concurrency:
  group: srcbuild-native-${{ github.ref }}-${{ inputs.targets || 'all' }}
  cancel-in-progress: false

jobs:
  # Four source SDK builds are the expensive part of a release, and starting all
  # of them before phase 1 has reported anything is what the phase policy exists
  # to prevent. Selecting here lets each phase call this workflow for its own
  # target; the tuple list stays in one place.
  plan:
    name: Select targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      llvm_platforms: ${{ steps.select.outputs.llvm_platforms }}
    steps:
      - name: Select the requested targets
        id: select
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          all='[
            {"target":"linux-aarch64","runner":"ubuntu-24.04-arm","llvm_platform":"linux_aarch64","static_libs":true},
            {"target":"darwin-arm64","runner":"macos-15","llvm_platform":"darwin_aarch64","static_libs":false},
            {"target":"darwin-x64","runner":"macos-15-intel","llvm_platform":"darwin_x86_64","static_libs":false},
            {"target":"linux-x64","runner":"ubuntu-22.04","llvm_platform":"linux_x86_64","static_libs":true}
          ]'
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = all ]; then
            selected="$all"
          else
            selected="$(printf '%s' "$all" | jq -c --arg want "$REQUESTED" \
              '[.[] | select(.target as $t | ($want | split(",") | map(gsub("^ +| +$";"")) | index($t)))]')"
          fi
          count="$(printf '%s' "$selected" | jq 'length')"
          # An empty matrix skips every dependent job while reporting nothing wrong.
          if [ "$count" -eq 0 ]; then
            echo "no target matched targets=$REQUESTED" >&2
            exit 1
          fi
          echo "selected $count target(s) for targets=$REQUESTED"
          printf 'matrix=%s\n' "$(printf '%s' "$selected" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          printf 'llvm_platforms=%s\n' "$(printf '%s' "$selected" | jq -r '[.[].llvm_platform] | join(",")')" >> "$GITHUB_OUTPUT"

  srcbuild:
    name: ${{ matrix.target }} / source SDK
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/srcbuild-target.yml
    with:
      targets: ${{ matrix.target }}
      cangjie_ref: ${{ inputs.cangjie_ref }}
      build_type: ${{ inputs.build_type }}
      dry_run: ${{ inputs.dry_run || false }}
      runtime_ref: ${{ inputs.runtime_ref }}
      build_android: ${{ inputs.build_android || false }}
      rebuild_llvm: ${{ inputs.rebuild_llvm || false }}
      language_tuple: ${{ inputs.language_tuple || false }}
      runtime_artifact_id: ${{ inputs.runtime_artifact_id }}
      runtime_manifest_sha256: ${{ inputs.runtime_manifest_sha256 }}

  artifact-contract:
    name: Publish final std artifact contract
    needs: srcbuild
    runs-on: ubuntu-22.04
    outputs:
      final_compiler_linux_x64: ${{ steps.contract.outputs.final_compiler_linux_x64 }}
      final_std_linux_x64: ${{ steps.contract.outputs.final_std_linux_x64 }}
      final_compiler_linux_aarch64: ${{ steps.contract.outputs.final_compiler_linux_aarch64 }}
      final_std_linux_aarch64: ${{ steps.contract.outputs.final_std_linux_aarch64 }}
      final_compiler_darwin_x64: ${{ steps.contract.outputs.final_compiler_darwin_x64 }}
      final_std_darwin_x64: ${{ steps.contract.outputs.final_std_darwin_x64 }}
      final_compiler_darwin_arm64: ${{ steps.contract.outputs.final_compiler_darwin_arm64 }}
      final_std_darwin_arm64: ${{ steps.contract.outputs.final_std_darwin_arm64 }}
      final_std_windows_x64: ${{ steps.contract.outputs.final_std_windows_x64 }}
    steps:
      - name: Export artifact names
        id: contract
        run: |
          {
            echo "final_compiler_linux_x64=final-compiler-linux-x64"
            echo "final_std_linux_x64=final-std-linux-x64"
            echo "final_compiler_linux_aarch64=final-compiler-linux-aarch64"
            echo "final_std_linux_aarch64=final-std-linux-aarch64"
            echo "final_compiler_darwin_x64=final-compiler-darwin-x64"
            echo "final_std_darwin_x64=final-std-darwin-x64"
            echo "final_compiler_darwin_arm64=final-compiler-darwin-arm64"
            echo "final_std_darwin_arm64=final-std-darwin-arm64"
            echo "final_std_windows_x64=final-std-windows-x64"
          } >> "$GITHUB_OUTPUT"
