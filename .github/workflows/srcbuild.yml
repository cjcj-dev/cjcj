name: Self-hosted source SDK and final std

on:
  workflow_call:
    inputs:
      native_inputs_only:
        description: Prepare complete Linux x64 native inputs only, without building or qualifying an SDK
        type: boolean
        required: false
        default: false
      native_input_stage:
        description: Native preparation scope; development-dependencies builds no N or SDK
        type: string
        required: false
        default: all
      native_runtime_artifact:
        description: Existing native-runtime-install artifact prefix
        type: string
        required: false
        default: ''
      native_runtime_run_id:
        description: Frozen producer run for native runtime installation
        type: string
        required: false
        default: ''
      native_llvm_ref:
        description: Explicit paired LLVM full commit
        type: string
        required: false
        default: ''
      native_runtime_ref:
        description: Explicit paired runtime full commit
        type: string
        required: false
        default: ''
      native_host_version:
        description: Exact official bootstrap host version for this pair
        type: string
        required: false
        default: ''
      shim_source_selection:
        description: Cjo header source repository and full commit JSON; private fixed sources require reachable repositories
        type: string
        required: false
        default: "{}"
      native_build_inputs_artifact:
        description: Optional native-cjdb source/dependency artifact prefix; runs the existing producer before SDK configuration
        type: string
        required: false
        default: ''
      native_build_inputs_run_id:
        description: Original run containing native-cjdb.json and its real dependencies
        type: string
        required: false
        default: ''
      source_selection:
        description: Ordinary build repository options JSON, including explicit full stdx url/tag; empty keeps defaults
        type: string
        required: false
        default: '{}'
      native_inputs_artifact:
        description: Reviewed complete native installations and exported paired tools artifact
        required: false
        default: ''
        type: string
      native_inputs_run_id:
        description: Original native installation producer run
        required: false
        default: ''
        type: string
      cangjie_ref:
        description: Optional SDK version label; source repository revisions remain pinned
        required: false
        type: string
        default: ''
      build_type:
        description: C++ SDK build type for native hosts
        required: false
        type: string
        default: relwithdebinfo
      dry_run:
        description: Authorize an exact runtime_ref override without publishing
        required: false
        type: boolean
        default: false
      runtime_ref:
        description: Dry-run only; exact runtime commit, otherwise ci/runtime_pin.env is used
        required: false
        type: string
        default: ''
      targets:
        description: >-
          Comma-separated source targets to build; "all" builds every one. A
          release phase passes its own target so it pays for that target and no
          other.
        required: false
        type: string
        default: all
      build_ohos:
        description: Build both OHOS runtime and final std tuples on the Linux source cell
        required: false
        type: boolean
        default: false
      build_ios:
        description: Build the three iOS runtime and final std tuples on Darwin ARM64
        required: false
        type: boolean
        default: false
      build_android:
        description: Build the Android runtime and final std needed by Android release packages
        required: false
        type: boolean
        default: false
      rebuild_llvm:
        description: Bypass the whole-artifact LLVM tools cache so the LLVM sccache hit rate can be measured.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      native_inputs_only:
        description: Prepare complete Linux x64 native inputs only, without building or qualifying an SDK
        type: boolean
        required: false
        default: false
      native_input_stage:
        description: Native preparation scope; development-dependencies builds no N or SDK
        type: choice
        required: false
        default: all
        options: [all, development-dependencies]
      native_runtime_artifact:
        description: Existing native-runtime-install artifact prefix
        type: string
        required: false
        default: ''
      native_runtime_run_id:
        description: Frozen producer run for native runtime installation
        type: string
        required: false
        default: ''
      native_llvm_ref:
        description: Explicit paired LLVM full commit
        type: string
        required: false
        default: ''
      native_runtime_ref:
        description: Explicit paired runtime full commit
        type: string
        required: false
        default: ''
      native_host_version:
        description: Exact official bootstrap host version for this pair
        type: string
        required: false
        default: ''
      shim_source_selection:
        description: Cjo header source repository and full commit JSON; private fixed sources require reachable repositories
        type: string
        required: false
        default: "{}"
      native_build_inputs_artifact:
        description: Optional native-cjdb source/dependency artifact prefix; runs the existing producer before SDK configuration
        type: string
        required: false
        default: ''
      native_build_inputs_run_id:
        description: Original run containing native-cjdb.json and its real dependencies
        type: string
        required: false
        default: ''
      source_selection:
        description: Ordinary build repository options JSON, including explicit full stdx url/tag; empty keeps defaults
        type: string
        required: false
        default: '{}'
      native_inputs_artifact:
        description: Reviewed complete native installations and exported paired tools artifact
        required: false
        default: ''
        type: string
      native_inputs_run_id:
        description: Original native installation producer run
        required: false
        default: ''
        type: string
      cangjie_ref:
        description: Optional SDK version label; source repository revisions remain pinned
        required: false
        type: string
      build_type:
        description: C++ SDK build type
        required: true
        default: relwithdebinfo
        type: choice
        options: [release, relwithdebinfo, debug]
      dry_run:
        description: Authorize an exact runtime_ref override without publishing
        required: false
        type: boolean
        default: false
      runtime_ref:
        description: Dry-run only; exact runtime commit, otherwise ci/runtime_pin.env is used
        required: false
        type: string
        default: ''
      targets:
        description: >-
          Comma-separated source targets to build; "all" builds every one. A
          release phase passes its own target so it pays for that target and no
          other.
        required: false
        type: string
        default: all
      build_ohos:
        description: Build both OHOS runtime and final std tuples on the Linux source cell
        required: false
        type: boolean
        default: false
      build_ios:
        description: Build the three iOS runtime and final std tuples on Darwin ARM64
        required: false
        type: boolean
        default: false
      build_android:
        description: Build the Android runtime and final std needed by Android release packages
        required: false
        type: boolean
        default: false
      rebuild_llvm:
        description: Bypass the whole-artifact LLVM tools cache so the LLVM sccache hit rate can be measured.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Per target set, not per ref alone: release-matrix.yml calls this workflow once
# per platform in the same run, and one group for all of them would leave every
# call but one pending -- and cancel all but the newest pending one.
concurrency:
  group: srcbuild-native-${{ github.ref }}-${{ inputs.targets || 'all' }}
  cancel-in-progress: false

env:
  CJCJ_NATIVE_RUNTIME_ARTIFACT: ${{ inputs.native_runtime_artifact }}
  CJCJ_NATIVE_RUNTIME_RUN_ID: ${{ inputs.native_runtime_run_id }}
  CJCJ_NATIVE_LLVM_REF: ${{ inputs.native_llvm_ref }}
  CJCJ_NATIVE_RUNTIME_REF: ${{ inputs.native_runtime_ref }}
  CJCJ_NATIVE_HOST_VERSION: ${{ inputs.native_host_version }}
  CJCJ_NATIVE_INPUTS_ARTIFACT: ${{ inputs.native_inputs_artifact }}
  CJCJ_NATIVE_INPUTS_RUN_ID: ${{ inputs.native_inputs_run_id }}
  CJCJ_NATIVE_BUILD_INPUTS_ARTIFACT: ${{ inputs.native_build_inputs_artifact }}
  CJCJ_NATIVE_BUILD_INPUTS_RUN_ID: ${{ inputs.native_build_inputs_run_id }}
  CJCJ_SOURCE_SELECTION: ${{ inputs.source_selection }}

jobs:
  native-inputs:
    name: Linux x64 / native input preparation
    if: inputs.native_inputs_only
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CJCJ_SRCBUILD_TARGET: ${{ inputs.targets }}
      CJCJ_NATIVE_INPUT_STAGE: ${{ inputs.native_input_stage }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Require the selected preparation scope and actual optional producer pair
        run: |
          set -euo pipefail
          ulimit -S -c 0
          ulimit -H -c 0
          test "$CJCJ_SRCBUILD_TARGET" = linux-x64
          case "$CJCJ_NATIVE_INPUT_STAGE" in all|development-dependencies) ;; *) exit 1;; esac
          printf 'CJCJ_NATIVE_CJDB_INSTALL=%s/native-preparation/native/install\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CJCJ_NATIVE_RUNTIME_INSTALL=%s/native-runtime-install\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          if test -n "$CJCJ_NATIVE_BUILD_INPUTS_ARTIFACT$CJCJ_NATIVE_BUILD_INPUTS_RUN_ID"; then
            test -n "$CJCJ_NATIVE_BUILD_INPUTS_ARTIFACT"
            test -n "$CJCJ_NATIVE_BUILD_INPUTS_RUN_ID"
          fi
          if test "$CJCJ_NATIVE_INPUT_STAGE" = all; then
            test -n "$CJCJ_NATIVE_RUNTIME_ARTIFACT"
            test -n "$CJCJ_NATIVE_RUNTIME_RUN_ID"
          fi
      - name: Receive proven compatible development installations when explicitly supplied
        if: inputs.native_build_inputs_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native_build_inputs_artifact }}-linux-x64
          run-id: ${{ inputs.native_build_inputs_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-dependencies
      - name: Receive the accepted exact runtime installation
        if: inputs.native_input_stage == 'all'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native_runtime_artifact }}-linux_x86_64
          run-id: ${{ inputs.native_runtime_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.CJCJ_NATIVE_RUNTIME_INSTALL }}
      - name: Prepare the normal Unix CMake tools
        run: |
          ulimit -S -c 0
          ulimit -H -c 0
          npx --yes zx@8 build/cli.mjs --target linux-x64 install-system-deps
          sudo apt-get install -y libffi-dev libbz2-dev libsqlite3-dev liblzma-dev pkg-config
      - uses: ./.github/actions/sccache
        with:
          component: native-cjdb
          platform: linux_x86_64
          pin: ${{ inputs.native_llvm_ref }}
          cache-size: 2G
      - name: Produce the missing normal development installations from fixed official distributions
        if: inputs.native_build_inputs_artifact == ''
        run: |
          set -euo pipefail
          ulimit -S -c 0
          ulimit -H -c 0
          node ci/bootstrap/native-cjdb-job.mjs dependencies "$RUNNER_TEMP/native-dependencies" "$RUNNER_TEMP/native-preparation/dependencies"
      - name: Retain development installations and original configuration, without source trees
        uses: actions/upload-artifact@v7
        with:
          name: native-development-dependencies-linux-x64
          path: |
            ${{ runner.temp }}/native-dependencies/native-cjdb.json
            ${{ runner.temp }}/native-dependencies/locations.json
            ${{ runner.temp }}/native-dependencies/native-inputs.tar
          if-no-files-found: error
      - name: Fetch fixed sources on this official runner and build the normal N and AST targets
        if: inputs.native_input_stage == 'all'
        run: |
          set -euo pipefail
          ulimit -S -c 0
          ulimit -H -c 0
          node ci/bootstrap/native-cjdb-job.mjs prepare-inputs "$RUNNER_TEMP/native-dependencies" "$RUNNER_TEMP/native-preparation"
          node ci/bootstrap/native-cjdb-job.mjs build "$RUNNER_TEMP/native-preparation/prepared" "$RUNNER_TEMP/native-preparation/native"
      - name: Package N, AST, runtime and host installations using the existing location map
        if: inputs.native_input_stage == 'all'
        run: |
          ulimit -S -c 0
          ulimit -H -c 0
          node ci/bootstrap/native-cjdb-job.mjs package-inputs "$RUNNER_TEMP/native-dependencies" "$RUNNER_TEMP/native-preparation"
      - uses: actions/upload-artifact@v7
        if: inputs.native_input_stage == 'all'
        with:
          name: native-inputs-linux-x64
          path: |
            ${{ runner.temp }}/native-preparation/native-inputs/locations.json
            ${{ runner.temp }}/native-preparation/native-inputs/native-inputs.tar
          if-no-files-found: error
      - name: Retain original native preparation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-inputs-diagnostics-linux-x64
          path: |
            ${{ runner.temp }}/native-preparation/dependencies/dependency-commands.json
            ${{ runner.temp }}/native-preparation/dependencies/python-configuration.json
            ${{ runner.temp }}/native-dependencies/.native-inputs/python-original.json
            ${{ runner.temp }}/native-dependencies/.native-inputs/DEVELOPMENT-INPUTS.json
            ${{ runner.temp }}/native-preparation/prepare-commands.json
            ${{ runner.temp }}/native-preparation/prepared/native-cjdb.json
            ${{ runner.temp }}/native-preparation/native/commands.json
            ${{ runner.temp }}/native-preparation/native/install/BUILD-INPUTS.json
            ${{ runner.temp }}/native-preparation/native/build/CMakeCache.txt
            ${{ runner.temp }}/native-preparation/package-inputs-commands.json
          if-no-files-found: warn
      - uses: ./.github/actions/sccache-report
        if: always()
        with:
          component: native-cjdb
          platform: linux_x86_64
          require-compiles: ${{ job.status == 'success' }}

  # Four source SDK builds are the expensive part of a release, and starting all
  # of them before phase 1 has reported anything is what the phase policy exists
  # to prevent. Selecting here lets each phase call this workflow for its own
  # target; the tuple list stays in one place.
  plan:
    name: Select targets
    if: ${{ !inputs.native_inputs_only }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      llvm_platforms: ${{ steps.select.outputs.llvm_platforms }}
      has_runnable: ${{ steps.select.outputs.has_runnable }}
      has_blocked: ${{ steps.select.outputs.has_blocked }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Select the requested targets
        id: select
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          test -n "$CJCJ_NATIVE_INPUTS_ARTIFACT"
          test -n "$CJCJ_NATIVE_INPUTS_RUN_ID"
          node ci/srcbuild/target-matrix.mjs --targets "$REQUESTED"

  srcbuild:
    name: ${{ matrix.target }} / source SDK
    needs: plan
    if: needs.plan.outputs.has_runnable == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/srcbuild-target.yml
    with:
      native_build_inputs_artifact: ${{ inputs.native_build_inputs_artifact }}
      native_build_inputs_run_id: ${{ inputs.native_build_inputs_run_id }}
      source_selection: ${{ inputs.source_selection }}
      native_inputs_artifact: ${{ inputs.native_inputs_artifact }}
      shim_source_selection: ${{ inputs.shim_source_selection }}
      native_inputs_run_id: ${{ inputs.native_inputs_run_id }}
      native_runtime_artifact: ${{ inputs.native_runtime_artifact }}
      native_runtime_run_id: ${{ inputs.native_runtime_run_id }}
      native_llvm_ref: ${{ inputs.native_llvm_ref }}
      native_runtime_ref: ${{ inputs.native_runtime_ref }}
      native_host_version: ${{ inputs.native_host_version }}
      targets: ${{ matrix.target }}
      cangjie_ref: ${{ inputs.cangjie_ref }}
      build_type: ${{ inputs.build_type }}
      dry_run: ${{ inputs.dry_run || false }}
      runtime_ref: ${{ inputs.runtime_ref }}
      build_android: ${{ inputs.build_android || false }}
      build_ohos: ${{ inputs.build_ohos || false }}
      build_ios: ${{ inputs.build_ios || false }}
      rebuild_llvm: ${{ inputs.rebuild_llvm || false }}

  blocked:
    name: Report blocked source targets
    needs: plan
    if: needs.plan.outputs.has_blocked == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Report missing source inputs
        env:
          REQUESTED: ${{ inputs.targets }}
        run: node ci/srcbuild/target-matrix.mjs --targets "$REQUESTED" --require-ready
