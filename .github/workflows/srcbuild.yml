name: Self-hosted source SDK (linux-x64)

on:
  workflow_dispatch:
    inputs:
      cangjie_ref:
        description: Optional SDK version label; source repository revisions remain pinned
        required: false
        type: string
      build_type:
        description: C++ SDK build type
        required: true
        default: relwithdebinfo
        type: choice
        options: [release, relwithdebinfo, debug]

permissions:
  contents: read

concurrency:
  group: srcbuild-linux-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixed-llc:
    name: Build LLVM tools
    uses: ./.github/workflows/build-fixed-llc.yml

  srcbuild:
    name: Build source SDK
    needs: fixed-llc
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CANGJIE_WORKSPACE: ${{ github.workspace }}/.srcbuild/workspace
      CANGJIE_BUILD_ROOT: ${{ github.workspace }}/.srcbuild/buildtools
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_MULTILEVEL_CHAIN: "disk,gha"
      SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY: "l0"
      SCCACHE_DIR: ${{ github.workspace }}/.srcbuild/sccache
      SCCACHE_CACHE_SIZE: 5G
      cjHeapSize: 12GB
      cjHeapSwap: "on"
      CJCJ_STAGE3_STDLIB_BUILD_TYPE: ${{ inputs.build_type || 'relwithdebinfo' }}
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Load source pins
        run: cat ci/source_pin.env ci/runtime_pin.env >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: npx --yes zx@8 build/cli.mjs --target linux-x64 install-system-deps

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Restore support library cache
        id: support-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CANGJIE_BUILD_ROOT }}
          key: cangjie-srcbuild-support-linux-x64-${{ hashFiles('build/toolchain/static-libs.mjs', 'build/lib/archive.mjs', 'build/lib/runner.mjs') }}

      - name: Build support libraries
        if: steps.support-cache.outputs.cache-hit != 'true'
        run: npx --yes zx@8 build/cli.mjs --target linux-x64 install-static-libs

      - name: Save support library cache
        if: steps.support-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CANGJIE_BUILD_ROOT }}
          key: cangjie-srcbuild-support-linux-x64-${{ hashFiles('build/toolchain/static-libs.mjs', 'build/lib/archive.mjs', 'build/lib/runner.mjs') }}

      - name: Generate SDK version
        id: version
        env:
          REQUESTED_REF: ${{ inputs.cangjie_ref }}
        run: |
          value=$(npx --yes zx@8 build/cli.mjs --cangjie-version "$REQUESTED_REF" print-version)
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Download pinned source
        run: |
          npx --yes zx@8 build/cli.mjs \
            --target linux-x64 \
            --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" \
            --cangjie-version "${{ steps.version.outputs.value }}" \
            fetch \
            --repo-url "compiler=$COMPILER_SRC_URL" \
            --repo-tag "compiler=$COMPILER_REF" \
            --repo-url "runtime=$RUNTIME_SRC_URL" \
            --repo-tag "runtime=$RUNTIME_REF" \
            --repo-url "tools=$TOOLS_SRC_URL" \
            --repo-tag "tools=$TOOLS_REF" \
            --repo-url "stdx=$STDX_SRC_URL" \
            --repo-tag "stdx=$STDX_REF"

      - name: Verify source revisions
        run: npx --yes zx@8 ci/srcbuild/steps/verify-source-pins.mjs

      - name: Configure compiler LLVM
        # LLVM dev rejects seven-operand enum reflection; pin ERT_MAX=7.
        # Source and revision come from ci/llvm_pin.env so this stays one place:
        # the fork carries CJBarrierLowering's mask test, the fast-read uncolour,
        # and the two stack-map fixes stage2 needs. Upstream b462fbd9 has none.
        run: |
          set -euo pipefail
          source ci/llvm_pin.env
          export LLVM_URL LLVM_REF="$LLVM_SHA"
          npx --yes zx@8 ci/srcbuild/steps/pin-compiler-llvm.mjs

      - name: Build compiler oracle
        run: npx --yes zx@8 build/cli.mjs --target linux-x64 --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" build compiler

      - name: Build runtime from source
        run: npx --yes zx@8 build/cli.mjs --target linux-x64 --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" build runtime

      - name: Build stdlib from source
        run: npx --yes zx@8 build/cli.mjs --target linux-x64 --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" build stdlib

      - name: Build stdx from source
        run: npx --yes zx@8 build/cli.mjs --target linux-x64 --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" build stdx

      - name: Build SDK tools from source
        run: npx --yes zx@8 build/cli.mjs --target linux-x64 --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" build tools

      - name: Verify bootstrap SDK
        run: |
          npx --yes zx@8 build/cli.mjs --target linux-x64 --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" package
          npx --yes zx@8 build/cli.mjs --target linux-x64 --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" verify

      - name: Download LLVM tools
        uses: actions/download-artifact@v8
        with:
          name: fixed-llvm-tools-linux_x86_64
          path: .srcbuild/fixed-llc

      - name: Install source SDK
        run: npx --yes zx@8 ci/srcbuild/steps/activate-source-sdk.mjs

      - name: Build compiler shim
        env:
          CANGJIE_CPP_SRC: ${{ env.CANGJIE_WORKSPACE }}/cangjie_compiler
        run: npx --yes zx@8 ci/srcbuild/steps/build-shim.mjs

      - name: Inject selfhost compiler version
        env:
          SOURCE_SDK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          npx --yes zx@8 ci/srcbuild/tests/inject-version.test.mjs
          npx --yes zx@8 ci/srcbuild/steps/inject-version.mjs

      - name: Build stage 1 compiler
        # Upstream cjc miscompiles cjcj at -O2; build the seed at -O1.
        run: npx --yes zx@8 ci/srcbuild/steps/build-stage1.mjs

      - name: Add swap for stage2 chir heap
        # The O1-seed stage1 needs >14GB Cangjie heap for the chir package
        # (rc2 OOM at 12GB/frag 27%, rc3 OOM at 14GB/frag 38%; 24GB passes
        # locally at ~26GB RSS). 16GB RAM + 16GB swap carries a 20GB heap.
        # The runner already runs a 4G /swapfile (fallocate on it: Text file
        # busy, rc5). Keep it and add 12G on the /mnt ephemeral disk.
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build stage 2 compiler
        # Use the stage 1 compiler to avoid the upstream -O2 CHIR bug.
        run: npx --yes zx@8 ci/srcbuild/steps/build-stage2.mjs

      - name: Build stage 3 compiler and final std
        # Stage2 still embeds bootstrap std. Rebuild std with stage2, then build
        # the final compiler against that exact rebuilt std before composition.
        run: npx --yes zx@8 ci/srcbuild/steps/build-stage3.mjs

      # Keep the seed compiler and stage2 CJOs when a stage fails: reproducing a
      # stage2 frontier locally otherwise requires rebuilding the full C++ oracle.
      - name: Upload stage diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: srcbuild-diagnosis-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.CANGJIE_WORKSPACE }}/software/cangjie/bin/cjcj-stage1
            target/release/**/*.cjo

      - name: Compose self-hosted SDK
        env:
          SOURCE_SDK_VERSION: ${{ steps.version.outputs.value }}
        run: npx --yes zx@8 ci/srcbuild/steps/compose-sdk.mjs

      - name: Verify self-hosted SDK
        run: npx --yes zx@8 ci/srcbuild/steps/verify.mjs "$CANGJIE_WORKSPACE/software/cangjie"

      - name: Upload self-hosted SDK and gate logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cjcj-srcbuild-linux-x64-${{ steps.version.outputs.value }}
          path: |
            ${{ env.CANGJIE_WORKSPACE }}/software/cangjie-sdk-linux-x64-${{ steps.version.outputs.value }}-cjcj.tar.gz
            ${{ env.CANGJIE_WORKSPACE }}/software/cangjie-sdk-linux-x64-${{ steps.version.outputs.value }}-cjcj.tar.gz.sha256
            ${{ runner.temp }}/cjcj-srcbuild-verify/*.log
            .srcbuild/shim-build.log
          if-no-files-found: warn
