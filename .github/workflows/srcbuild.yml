name: Self-hosted source SDK and final std

on:
  workflow_call:
    inputs:
      cangjie_ref:
        description: Optional SDK version label; source repository revisions remain pinned
        required: false
        type: string
        default: ''
      build_type:
        description: C++ SDK build type for native hosts
        required: false
        type: string
        default: relwithdebinfo
      dry_run:
        description: Authorize an exact runtime_ref override without publishing
        required: false
        type: boolean
        default: false
      runtime_ref:
        description: Dry-run only; exact runtime commit, otherwise ci/runtime_pin.env is used
        required: false
        type: string
        default: ''
      targets:
        description: >-
          Comma-separated source targets to build; "all" builds every one. A
          release phase passes its own target so it pays for that target and no
          other.
        required: false
        type: string
        default: all
    outputs:
      final_std_linux_x64:
        description: Linux x64 source-built std artifact
        value: ${{ jobs.artifact-contract.outputs.final_std_linux_x64 }}
      final_std_linux_aarch64:
        description: Linux AArch64 source-built std artifact
        value: ${{ jobs.artifact-contract.outputs.final_std_linux_aarch64 }}
      final_std_darwin_x64:
        description: Darwin x64 source-built std artifact
        value: ${{ jobs.artifact-contract.outputs.final_std_darwin_x64 }}
      final_std_darwin_arm64:
        description: Darwin arm64 source-built std artifact
        value: ${{ jobs.artifact-contract.outputs.final_std_darwin_arm64 }}
      final_std_windows_x64:
        description: Windows x64 source-built std artifact
        value: ${{ jobs.artifact-contract.outputs.final_std_windows_x64 }}
  workflow_dispatch:
    inputs:
      cangjie_ref:
        description: Optional SDK version label; source repository revisions remain pinned
        required: false
        type: string
      build_type:
        description: C++ SDK build type
        required: true
        default: relwithdebinfo
        type: choice
        options: [release, relwithdebinfo, debug]
      dry_run:
        description: Authorize an exact runtime_ref override without publishing
        required: false
        type: boolean
        default: false
      runtime_ref:
        description: Dry-run only; exact runtime commit, otherwise ci/runtime_pin.env is used
        required: false
        type: string
        default: ''
      targets:
        description: >-
          Comma-separated source targets to build; "all" builds every one. A
          release phase passes its own target so it pays for that target and no
          other.
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: srcbuild-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Four source SDK builds are the expensive part of a release, and starting all
  # of them before phase 1 has reported anything is what the phase policy exists
  # to prevent. Selecting here lets each phase call this workflow for its own
  # target; the tuple list stays in one place.
  plan:
    name: Select targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      llvm_platforms: ${{ steps.select.outputs.llvm_platforms }}
    steps:
      - name: Select the requested targets
        id: select
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          all='[
            {"target":"linux-aarch64","runner":"ubuntu-24.04-arm","llvm_platform":"linux_aarch64","static_libs":true},
            {"target":"darwin-arm64","runner":"macos-15","llvm_platform":"darwin_aarch64","static_libs":false},
            {"target":"darwin-x64","runner":"macos-15-intel","llvm_platform":"darwin_x86_64","static_libs":false},
            {"target":"linux-x64","runner":"ubuntu-22.04","llvm_platform":"linux_x86_64","static_libs":true}
          ]'
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = all ]; then
            selected="$all"
          else
            selected="$(printf '%s' "$all" | jq -c --arg want "$REQUESTED" \
              '[.[] | select(.target as $t | ($want | split(",") | map(gsub("^ +| +$";"")) | index($t)))]')"
          fi
          count="$(printf '%s' "$selected" | jq 'length')"
          # An empty matrix skips every dependent job while reporting nothing wrong.
          if [ "$count" -eq 0 ]; then
            echo "no target matched targets=$REQUESTED" >&2
            exit 1
          fi
          echo "selected $count target(s) for targets=$REQUESTED"
          printf 'matrix=%s\n' "$(printf '%s' "$selected" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          printf 'llvm_platforms=%s\n' "$(printf '%s' "$selected" | jq -r '[.[].llvm_platform] | join(",")')" >> "$GITHUB_OUTPUT"

  fixed-llvm:
    name: Build native LLVM tools
    needs: plan
    uses: ./.github/workflows/build-fixed-llc.yml
    with:
      platforms: ${{ needs.plan.outputs.llvm_platforms }}

  srcbuild:
    name: ${{ matrix.target }} / source SDK
    needs: [plan, fixed-llvm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      CANGJIE_WORKSPACE: ${{ github.workspace }}/.srcbuild/workspace
      CANGJIE_BUILD_ROOT: ${{ github.workspace }}/.srcbuild/buildtools
      CJCJ_SRCBUILD_TARGET: ${{ matrix.target }}
      CJCJ_FIXED_LLVM_DIR: ${{ github.workspace }}/.srcbuild/fixed-llc
      # GitHub's cache is the wrong shape for sccache here, measured rather than
      # assumed. Run 31551077927 reported 230 hits against 6585 misses -- 3% --
      # while spending 4162 s writing 6565 entries, and the repository's cache
      # then held 27840 entries totalling 6.9 GB of a 10 GB cap, of which only 36
      # were the whole-artifact caches (cjv, cjpm, fixed-llvm-tools) that do earn
      # their space. sccache writes one entry per object file, so each release run
      # pushes past the cap and evicts the previous run's entries -- which is why
      # the hit rate stays at 3% no matter how much is written.
      #
      # Disabling the cross-run backend costs those 230 cached compilations and
      # returns 4162 s per run plus the cache budget. sccache still runs with its
      # local disk cache; nothing about correctness changes either way.
      #
      # Before turning this back on, re-measure: the numbers to beat are hit rate
      # 3% and write duration 4162 s, and a backend without a 10 GB per-repository
      # cap is what would actually change them.
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_LOG: warn
      cjHeapSize: 12GB
      cjHeapSwap: "on"
      CJCJ_STAGE3_STDLIB_BUILD_TYPE: ${{ inputs.build_type || 'relwithdebinfo' }}
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7

      - name: Load host toolchain pin
        run: cat ci/host_sdk_pin.env >> "$GITHUB_ENV"

      - name: Load source pins
        run: cat ci/source_pin.env >> "$GITHUB_ENV"

      - name: Load and validate runtime pin
        env:
          CJCJ_RUNTIME_REF_OVERRIDE: ${{ inputs.runtime_ref }}
          CJCJ_ALLOW_RUNTIME_OVERRIDE: ${{ inputs.dry_run && inputs.runtime_ref != '' }}
        run: npx --yes zx@8 ci/load_runtime_pin.mjs

      - name: Provision uncoloured host SDK
        shell: bash
        run: |
          set -euo pipefail
          export CJCJ_SDK_STOCK_LLC=1
          npx --yes zx@8 ci/setup_sdk.mjs
          host_sdk="$HOME/.cjv/toolchains/$CJCJ_TOOLCHAIN"
          test -d "$host_sdk"
          echo "CJCJ_SRCBUILD_BOOTSTRAP_SDK=$host_sdk" >> "$GITHUB_ENV"
          echo "CJCJ_SRCBUILD_HOST_SDK=$host_sdk" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" install-system-deps

      - name: Configure sccache diagnostics
        shell: bash
        run: echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-error.log" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Restore support library cache
        if: matrix.static_libs
        id: support-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CANGJIE_BUILD_ROOT }}
          key: cangjie-srcbuild-support-${{ matrix.target }}-${{ hashFiles('build/toolchain/static-libs.mjs', 'build/lib/archive.mjs', 'build/lib/runner.mjs') }}

      - name: Build support libraries
        if: matrix.static_libs && steps.support-cache.outputs.cache-hit != 'true'
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" install-static-libs

      - name: Save support library cache
        if: matrix.static_libs && steps.support-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CANGJIE_BUILD_ROOT }}
          key: cangjie-srcbuild-support-${{ matrix.target }}-${{ hashFiles('build/toolchain/static-libs.mjs', 'build/lib/archive.mjs', 'build/lib/runner.mjs') }}

      - name: Generate SDK version
        id: version
        env:
          REQUESTED_REF: ${{ inputs.cangjie_ref }}
        run: |
          value=$(npx --yes zx@8 build/cli.mjs --cangjie-version "$REQUESTED_REF" print-version)
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Download pinned source
        run: |
          npx --yes zx@8 build/cli.mjs \
            --target "${{ matrix.target }}" \
            --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" \
            --cangjie-version "${{ steps.version.outputs.value }}" \
            fetch \
            --repo-url "compiler=$COMPILER_SRC_URL" \
            --repo-tag "compiler=$COMPILER_REF" \
            --repo-url "runtime=$RUNTIME_SRC_URL" \
            --repo-tag "runtime=$RUNTIME_REF" \
            --repo-url "tools=$TOOLS_SRC_URL" \
            --repo-tag "tools=$TOOLS_REF" \
            --repo-url "stdx=$STDX_SRC_URL" \
            --repo-tag "stdx=$STDX_REF"

      - name: Verify source revisions
        run: npx --yes zx@8 ci/srcbuild/steps/verify-source-pins.mjs

      - name: Download native LLVM tuple
        uses: actions/download-artifact@v8
        with:
          name: fixed-llvm-tools-${{ matrix.llvm_platform }}
          path: ${{ env.CJCJ_FIXED_LLVM_DIR }}

      - name: Resolve bootstrap inputs on this runner
        shell: bash
        run: |
          set -euo pipefail
          source ci/llvm_pin.env
          source ci/runtime_pin.env
          node ci/release/prepare_bootstrap_inputs.mjs

      - name: Bootstrap stage0 compiler
        shell: bash
        run: bash ci/bootstrap/gha_run.sh stage0

      - name: Add Linux swap for stage2 chir heap
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Bootstrap stage1 compiler
        shell: bash
        run: bash ci/bootstrap/gha_run.sh stage1

      - name: Build stage 3 compiler and final std
        run: npx --yes zx@8 ci/srcbuild/steps/build-stage3.mjs

      - name: Upload final source-built std install root
        uses: actions/upload-artifact@v7
        with:
          name: final-std-${{ matrix.target }}
          path: ${{ env.CANGJIE_WORKSPACE }}/software/final-std-stage2
          if-no-files-found: error
          retention-days: 7

      - name: Build stdx from source
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" build stdx

      - name: Build SDK tools from source
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" build tools

      - name: Prepare source-built cjpm artifact
        run: |
          node ci/release/prepare_cjpm_artifact.mjs \
            --platform "${{ matrix.target }}" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjpm/dist/cjpm" \
            --outdir "$GITHUB_WORKSPACE/.release-cjpm/${{ matrix.target }}"

      - name: Upload source-built cjpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-cjpm-${{ matrix.target }}
          path: ${{ github.workspace }}/.release-cjpm/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

      - name: Prepare source-built hle artifact
        run: |
          node ci/release/prepare_hle_artifact.mjs \
            --platform "${{ matrix.target }}" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/hyperlangExtension/target/bin/main" \
            --outdir "$GITHUB_WORKSPACE/.release-hle/${{ matrix.target }}"

      - name: Upload source-built hle artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-hle-${{ matrix.target }}
          path: ${{ github.workspace }}/.release-hle/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

      - name: Package and verify SDK
        run: |
          npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" package
          npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" verify

      - name: Build compiler shim
        env:
          CANGJIE_CPP_SRC: ${{ env.CANGJIE_WORKSPACE }}/cangjie_compiler
        run: npx --yes zx@8 ci/srcbuild/steps/build-shim.mjs

      - name: Inject selfhost compiler version
        env:
          SOURCE_SDK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          npx --yes zx@8 ci/srcbuild/tests/inject-version.test.mjs
          npx --yes zx@8 ci/srcbuild/steps/inject-version.mjs

      - name: Restore official MinGW toolchain
        if: matrix.target == 'linux-x64'
        id: windows-mingw-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CANGJIE_BUILD_ROOT }}/llvm-mingw-w64
          key: windows-final-std-mingw-20220906-5c68a1cb123161b54b72ce90e7975d95a8eaf2a4-${{ hashFiles('build/toolchain/mingw.mjs', 'build/lib/archive.mjs', 'build/lib/runner.mjs') }}

      - name: Install Windows cross toolchain dependencies
        if: matrix.target == 'linux-x64' && steps.windows-mingw-cache.outputs.cache-hit != 'true'
        run: npx --yes zx@8 build/cli.mjs --target windows-x64 --build-root "$CANGJIE_BUILD_ROOT" install-system-deps

      - name: Build official MinGW toolchain
        if: matrix.target == 'linux-x64' && steps.windows-mingw-cache.outputs.cache-hit != 'true'
        run: npx --yes zx@8 build/cli.mjs --target windows-x64 --build-root "$CANGJIE_BUILD_ROOT" install-mingw

      - name: Save official MinGW toolchain
        if: matrix.target == 'linux-x64' && steps.windows-mingw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CANGJIE_BUILD_ROOT }}/llvm-mingw-w64
          key: ${{ steps.windows-mingw-cache.outputs.cache-primary-key }}

      - name: Cross-build Windows final std with stage2 host compiler
        if: matrix.target == 'linux-x64'
        env:
          CJCJ_STAGE3_CANGJIE_VERSION: ${{ steps.version.outputs.value }}
        run: npx --yes zx@8 ci/srcbuild/steps/build-windows-final-std.mjs

      - name: Upload Windows source-built std install root
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: final-std-windows-x64
          path: ${{ env.CANGJIE_WORKSPACE }}/software/final-std-windows-stage2
          if-no-files-found: error
          retention-days: 7

      - name: Upload stage diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: srcbuild-diagnosis-${{ matrix.target }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.CANGJIE_WORKSPACE }}/software/cangjie/bin/cjcj-stage1
            target/release/**/*.cjo

      - name: Compose self-hosted SDK
        env:
          SOURCE_SDK_VERSION: ${{ steps.version.outputs.value }}
        run: npx --yes zx@8 ci/srcbuild/steps/compose-sdk.mjs

      - name: Verify self-hosted SDK
        run: npx --yes zx@8 ci/srcbuild/steps/verify.mjs "$CANGJIE_WORKSPACE/software/cangjie"

      - name: Upload self-hosted SDK and gate logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cjcj-srcbuild-${{ matrix.target }}-${{ steps.version.outputs.value }}
          path: |
            ${{ env.CANGJIE_WORKSPACE }}/software/cangjie-sdk-*-${{ steps.version.outputs.value }}-cjcj.tar.gz
            ${{ env.CANGJIE_WORKSPACE }}/software/cangjie-sdk-*-${{ steps.version.outputs.value }}-cjcj.tar.gz.sha256
            ${{ runner.temp }}/cjcj-srcbuild-verify/*.log
            .srcbuild/shim-build.log
          if-no-files-found: warn

      - name: Capture sccache diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          "${SCCACHE_PATH:-sccache}" --show-stats --stats-format=json \
            > "$RUNNER_TEMP/sccache-stats.json"

      - name: Upload sccache diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sccache-diagnostics-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sccache-error.log
            ${{ runner.temp }}/sccache-stats.json
          if-no-files-found: warn
          retention-days: 1

  artifact-contract:
    name: Publish final std artifact contract
    needs: srcbuild
    runs-on: ubuntu-22.04
    outputs:
      final_std_linux_x64: ${{ steps.contract.outputs.final_std_linux_x64 }}
      final_std_linux_aarch64: ${{ steps.contract.outputs.final_std_linux_aarch64 }}
      final_std_darwin_x64: ${{ steps.contract.outputs.final_std_darwin_x64 }}
      final_std_darwin_arm64: ${{ steps.contract.outputs.final_std_darwin_arm64 }}
      final_std_windows_x64: ${{ steps.contract.outputs.final_std_windows_x64 }}
    steps:
      - name: Export artifact names
        id: contract
        run: |
          {
            echo "final_std_linux_x64=final-std-linux-x64"
            echo "final_std_linux_aarch64=final-std-linux-aarch64"
            echo "final_std_darwin_x64=final-std-darwin-x64"
            echo "final_std_darwin_arm64=final-std-darwin-arm64"
            echo "final_std_windows_x64=final-std-windows-x64"
          } >> "$GITHUB_OUTPUT"
