name: Platform LLVM tools

on:
  push:
    branches: [debug/llc-build]
  workflow_dispatch:
    inputs:
      cache-component:
        description: Isolated dylib cache namespace; reuse for a cold/warm pair.
        required: false
        type: string
        default: llvm-dylib
      publish_dylib:
        description: Build a separate three-target in-process LLVM dylib candidate.
        required: false
        type: boolean
        default: false
      publish_tuple:
        description: Publish a new static tuple candidate for an explicit pin update.
        required: false
        type: boolean
        default: true
      platforms:
        description: >-
          Comma-separated llvm platforms to build. Empty or "all" builds every
          one, which is what a caller that wants the whole set still gets.
        required: false
        type: string
        default: all
      cold_cache:
        description: Empty this job's restored sccache directory before compiling (control arm).
        required: false
        type: boolean
        default: false
      rebuild:
        description: >-
          Bypass the whole-artifact LLVM tools cache and compile again. This is
          how the sccache warm-cache hit rate is measured: at an unchanged pin
          the tools cache would otherwise skip the compile entirely.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tuple:
    uses: ./.github/workflows/build-llvm-tools.yml
    with:
      platforms: ${{ inputs.platforms || 'all' }}
      publish_tuple: ${{ inputs.publish_tuple || false }}
      publish_dylib: ${{ inputs.publish_dylib || false }}
      cache-component: ${{ inputs.cache-component || 'llvm-dylib' }}
      cold_cache: ${{ inputs.cold_cache || false }}
      rebuild: ${{ inputs.rebuild || false }}

  persist:
    if: inputs.publish_tuple
    needs: tuple
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.tuple.outputs.tuple_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/static-tuple
      - name: Persist the same fixed artifact and emit a candidate pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_ARTIFACT_ID: ${{ needs.tuple.outputs.tuple_artifact_id }}
          STATIC_TUPLE: ${{ runner.temp }}/static-tuple
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root = process.env.STATIC_TUPLE;
          const sums = fs.readFileSync(`${root}/SHA256SUMS`);
          const files = sums.toString().trim().split('\n').map(line => {
            const match = /^([a-f0-9]{64})  \.\/(.+)$/.exec(line);
            if (!match) throw new Error('invalid tuple manifest');
            return {path: match[2], sha256: match[1], mode: ['bin/llc', 'bin/opt'].includes(match[2]) ? 0o755 : 0o644};
          });
          files.push({path: 'SHA256SUMS', mode: 0o644, sha256: crypto.createHash('sha256').update(sums).digest('hex')});
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/bootstrap-files.json`, JSON.stringify(files));
          NODE
          node ci/release/publish_bootstrap_inputs.mjs "$STATIC_TUPLE" "$RUNNER_TEMP/bootstrap-files.json" "$RUNNER_TEMP/bootstrap-inputs-pin.json"
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-inputs-pin
          path: ${{ runner.temp }}/bootstrap-inputs-pin.json
          if-no-files-found: error
          retention-days: 90
