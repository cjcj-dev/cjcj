name: Platform LLVM tools

on:
  push:
    branches: [debug/llc-build]
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: Optional complete LLVM candidate SHA; requires runtime_ref.
        required: false
        type: string
        default: ''
      runtime_ref:
        description: Optional complete paired runtime SHA; requires llvm_ref.
        required: false
        type: string
        default: ''
      build_runtime:
        description: Build and install the paired native runtime and bounds libraries.
        type: boolean
        default: false
      runtime_version:
        description: Runtime version used by the native producer.
        type: string
        default: 1.3.0-alpha.20260925001050
      publish_host:
        description: Build the separately pinned, uncoloured bootstrap host LLVM SO.
        required: false
        type: boolean
        default: false
      cache-component:
        description: Isolated dylib cache namespace; reuse for a cold/warm pair.
        required: false
        type: string
        default: llvm-dylib
      publish_dylib:
        description: Build a separate three-target in-process LLVM dylib candidate.
        required: false
        type: boolean
        default: false
      publish_tuple:
        description: Publish a new static tuple candidate for an explicit pin update.
        required: false
        type: boolean
        default: true
      persist_tuple:
        description: Persist produced tuples as prerelease assets; requires publication authorization.
        required: false
        type: boolean
        default: false
      platforms:
        description: >-
          Comma-separated llvm platforms to build. Empty or "all" builds every
          one, which is what a caller that wants the whole set still gets.
        required: false
        type: string
        default: all
      cold_cache:
        description: Empty this job's restored sccache directory before compiling (control arm).
        required: false
        type: boolean
        default: false
      rebuild:
        description: >-
          Bypass the whole-artifact LLVM tools cache and compile again. This is
          how the sccache warm-cache hit rate is measured: at an unchanged pin
          the tools cache would otherwise skip the compile entirely.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-runtime:
    if: inputs.build_runtime
    uses: ./.github/workflows/build-native-runtime.yml
    with:
      llvm_ref: ${{ inputs.llvm_ref }}
      runtime_ref: ${{ inputs.runtime_ref }}
      platforms: ${{ inputs.platforms || 'all' }}
      runtime_version: ${{ inputs.runtime_version || '1.3.0-alpha.20260925001050' }}

  host:
    if: inputs.publish_host
    uses: ./.github/workflows/build-host-llvm.yml

  tuple:
    if: ${{ !inputs.publish_host || inputs.publish_tuple || inputs.publish_dylib }}
    uses: ./.github/workflows/build-llvm-tools.yml
    with:
      llvm_ref: ${{ inputs.llvm_ref }}
      runtime_ref: ${{ inputs.runtime_ref }}
      platforms: ${{ inputs.platforms || 'all' }}
      publish_tuple: ${{ inputs.publish_tuple || false }}
      publish_dylib: ${{ inputs.publish_dylib || false }}
      cache-component: ${{ inputs.cache-component || 'llvm-dylib' }}
      cold_cache: ${{ inputs.cold_cache || false }}
      rebuild: ${{ inputs.rebuild || false }}

  persist:
    if: inputs.persist_tuple && inputs.publish_tuple && needs.tuple.outputs.tuple_platforms != '[]'
    needs: tuple
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.tuple.outputs.tuple_platforms) }}
    runs-on: ${{ matrix.platform == 'linux_aarch64' && 'ubuntu-22.04-arm' || matrix.platform == 'darwin_aarch64' && 'macos-15' || matrix.platform == 'darwin_x86_64' && 'macos-15-intel' || 'ubuntu-22.04' }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve this platform's immutable artifact
        id: tuple-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "static-llvm-tuple-${{ matrix.platform }}" and .expired == false) | .id')
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.tuple-artifact.outputs.id }}
          merge-multiple: true
          path: ${{ runner.temp }}/static-tuple
      - name: Persist the same fixed artifact and emit a candidate pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_ARTIFACT_ID: ${{ steps.tuple-artifact.outputs.id }}
          BOOTSTRAP_PLATFORM: ${{ matrix.platform }}
          STATIC_TUPLE: ${{ runner.temp }}/static-tuple
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root = process.env.STATIC_TUPLE;
          const sums = fs.readFileSync(`${root}/SHA256SUMS`);
          const files = sums.toString().trim().split('\n').map(line => {
            const match = /^([a-f0-9]{64})  \.\/(.+)$/.exec(line);
            if (!match) throw new Error('invalid tuple manifest');
            return {path: match[2], sha256: match[1], mode: ['bin/llc', 'bin/opt', 'bin/ld.lld', 'bin/ld64.lld'].includes(match[2]) ? 0o755 : 0o644};
          });
          files.push({path: 'SHA256SUMS', mode: 0o644, sha256: crypto.createHash('sha256').update(sums).digest('hex')});
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/bootstrap-files.json`, JSON.stringify(files));
          NODE
          node ci/release/publish_bootstrap_inputs.mjs "$STATIC_TUPLE" "$RUNNER_TEMP/bootstrap-files.json" "$RUNNER_TEMP/bootstrap-inputs-pin.json"
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-inputs-pin-${{ matrix.platform }}
          path: ${{ runner.temp }}/bootstrap-inputs-pin.json
          if-no-files-found: error
          retention-days: 90
