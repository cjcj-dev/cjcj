name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CJCJ_TOOLCHAIN: nightly-1.2.0-alpha.20260721165458
  # RUNTIME_REF/RUNTIME_VERSION come from ci/runtime_pin.env via the "Load runtime pin" step.

jobs:
  lint:
    name: Verify sources
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      # The script list is discovered, never written out: the literal list this
      # replaced named two scripts, and every one of the other seven was added
      # after the list was last edited. Severity is info rather than error
      # because SC2086 -- unquoted expansion -- is an info-level check, so error
      # and warning both look past the class this gate exists to catch.
      # .shellcheckrc holds the two repository-wide exemptions and why.
      - name: Run ShellCheck
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version
          mapfile -t SCRIPTS < <(git ls-files '*.sh')
          echo "shellcheck covers ${#SCRIPTS[@]} scripts"
          test "${#SCRIPTS[@]}" -ge 9
          shellcheck --severity=info "${SCRIPTS[@]}"
      - name: Verify zx syntax
        run: |
          find ci runtime_shim scripts -type f -name '*.mjs' -print0 \
            | xargs -0 -n1 node --check
      # Driven by ci/test-manifest.mjs, never by a literal list here: the four
      # steps this replaced named eight of the repository's twenty-eight test
      # files, and the other twenty ran nowhere. ci/test-manifest.test.mjs holds
      # both ends of that -- every test file must be in a manifest bucket, and
      # this step must keep asking the manifest.
      - name: Test build and release contracts
        shell: bash
        env:
          RELEASE_EVIDENCE_TEST_ROOT: ${{ runner.temp }}/release-evidence-tests
        run: |
          mapfile -t FILES < <(node ci/test-manifest.mjs list)
          echo "manifest gates ${#FILES[@]} test files"
          # mapfile succeeds with zero lines if the manifest fails, and `node
          # --test` with no file arguments falls back to its own discovery, which
          # would pass while testing nothing.
          test "${#FILES[@]}" -ge 26
          # A hanging test would otherwise consume this job's whole
          # timeout-minutes and end in "exceeded maximum execution time", which
          # names no test. The bound makes the runner fail the specific test by
          # name instead. It is not a way to pass over a hang -- a timeout here is
          # a failure. 300s is ~150x the whole suite's normal 2s; a test that
          # genuinely needs longer says so with its own {timeout}, which wins.
          node --test --test-timeout=300000 "${FILES[@]}"
      - name: Verify smoke assets
        run: |
          test "$(find ci/smoke -maxdepth 1 -name '*.cj' | wc -l)" -ge 5
          test -f ci/smoke/macro_demo/mymacros/def.cj
          test -f ci/smoke/macro_demo/app/main.cj
      - name: Verify LLVM policy
        run: test -z "$(git ls-files 'ci/prebuilt/**' 'runtime_shim/prebuilt/**')"

  fixed-llvm-tools:
    name: Build LLVM tools
    uses: ./.github/workflows/build-fixed-llc.yml

  build:
    name: ${{ matrix.runner }} / Build
    needs: fixed-llvm-tools
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, llvm_platform: linux_x86_64, experimental: false }
          - { runner: ubuntu-22.04, llvm_platform: linux_x86_64, experimental: false }
          # ubuntu-26.04 is not a platform we ship on yet, so its failures are
          # information rather than verdicts.
          - { runner: ubuntu-26.04, llvm_platform: linux_x86_64, experimental: true }
          # linux-aarch64 is a release platform: it appears in the release matrix
          # and ships as an artifact, so a build failure here has to count. It was
          # non-gating from when this row only provisioned the official SDK; the
          # row now runs a native cjcj build and smoke, and the exemption outlived
          # its reason.
          - { runner: ubuntu-24.04-arm, llvm_platform: linux_aarch64, experimental: false }
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7
      - name: Load runtime pin
        shell: bash
        run: cat ci/runtime_pin.env >> "$GITHUB_ENV"
      - name: Download LLVM tools
        uses: actions/download-artifact@v8
        with:
          name: fixed-llvm-tools-${{ matrix.llvm_platform }}
          path: fixed-toolchain/${{ matrix.llvm_platform }}
      - name: Restore SDK cache
        id: sdkcache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CJCJ_TOOLCHAIN }}
      - name: Restore cjpm cache
        uses: actions/cache@v6
        with:
          path: target
          key: cjpm-${{ runner.os }}-${{ matrix.runner }}-${{ env.CJCJ_TOOLCHAIN }}-${{ github.sha }}
          restore-keys: |
            cjpm-${{ runner.os }}-${{ matrix.runner }}-${{ env.CJCJ_TOOLCHAIN }}-
      - name: Install SDK
        id: setup
        env:
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
          FIXED_LLC_GZ: ${{ github.workspace }}/fixed-toolchain/${{ matrix.llvm_platform }}/llc.gz
          FIXED_OPT_GZ: ${{ github.workspace }}/fixed-toolchain/${{ matrix.llvm_platform }}/opt.gz
        run: npx --yes zx@8 ci/setup_sdk.mjs
      # Save only after a successful install so a partial ~/.cjv is never cached.
      - name: Save SDK cache
        if: steps.setup.outcome == 'success' && steps.sdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CJCJ_TOOLCHAIN }}
      # Keyed by matrix.runner: the runtime .so links the builder's glibc, so a cache
      # entry built on a newer distro is unloadable on an older one (GLIBC_x.y not found).
      - name: Restore patched runtime cache
        id: rtcache
        uses: actions/cache/restore@v6
        with:
          path: dist-runtime
          key: rt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ env.RUNTIME_REF }}-${{ env.RUNTIME_VERSION }}-${{ hashFiles('ci/build_patched_runtime.mjs') }}
      - name: Install runtime dependencies
        if: steps.rtcache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake make
      - name: Build patched runtime
        if: steps.rtcache.outputs.cache-hit != 'true'
        env:
          RUNTIME_VERSION: ${{ env.RUNTIME_VERSION }}
        run: npx --yes zx@8 ci/build_patched_runtime.mjs "$PWD/dist-runtime"
      - name: Save patched runtime cache
        if: steps.rtcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist-runtime
          key: rt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ env.RUNTIME_REF }}-${{ env.RUNTIME_VERSION }}-${{ hashFiles('ci/build_patched_runtime.mjs') }}
      - name: Install patched runtime
        run: npx --yes zx@8 ci/install_patched_runtime.mjs "$PWD/dist-runtime"
      - name: Build runtime shim
        env:
          CJCJ_LLVM_SHIM_O: ${{ github.workspace }}/fixed-toolchain/${{ matrix.llvm_platform }}/cjselfhost_llvmshim.o
        run: npx --yes zx@8 runtime_shim/build_shim.mjs
      - name: Build workspace
        run: cjpm build
      # Deploy name must be cjcj, not cjc (process-name GC stack-root exclusion -> SEGV).
      - name: Compose compiler
        run: |
          test -f "target/release/bin/cjcj::cjc"
          cp "target/release/bin/cjcj::cjc" "target/release/bin/cjcj"
      - name: Run smoke tests
        run: npx --yes zx@8 ci/smoke/run_smoke.mjs "$PWD/target/release/bin/cjcj"

  # Non-gating: verifies SDK provisioning on macOS; does not build cjcj.
  provision:
    name: ${{ matrix.runner }} / Verify SDK
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest]
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7
      - name: Restore SDK cache
        id: sdkcache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CJCJ_TOOLCHAIN }}
      - name: Install SDK
        id: setup
        env:
          GITCODE_API_KEY: ${{ secrets.GITCODE_API_KEY }}
          # This job never compiles with cjcj, so it has no fixed-llc artifact to swap in.
          CJCJ_SDK_STOCK_LLC: '1'
        run: npx --yes zx@8 ci/setup_sdk.mjs
      - name: Save SDK cache
        if: steps.setup.outcome == 'success' && steps.sdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cjv
          key: cjv-${{ runner.os }}-${{ runner.arch }}-${{ env.CJCJ_TOOLCHAIN }}
      - name: Verify SDK layout
        run: |
          ls -la "$CANGJIE_HOME/bin" || true
          file "$CANGJIE_HOME/bin/cjc" || true
          ls "$CANGJIE_HOME/runtime/lib" || true
      - name: Verify official compiler
        run: |
          set -x
          if [ "$(uname -s)" = "Darwin" ]; then xattr -dr com.apple.quarantine "$CANGJIE_HOME" || true; fi
          # shellcheck disable=SC1091
          source "$CANGJIE_HOME/envsetup.sh"
          echo 'main(): Int64 { println("provision ok"); return 0 }' > "$RUNNER_TEMP/p.cj"
          cjc "$RUNNER_TEMP/p.cj" -o "$RUNNER_TEMP/p" && "$RUNNER_TEMP/p"

# Adding a build platform requires a matching matrix item in build-fixed-llc.yml and
# downloading that platform's fixed-llvm-tools artifact above.
