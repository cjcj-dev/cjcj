name: Fixed 07c6 eight-failure diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

# This branch is diagnostic-only. Push and pull_request must not run any job.
# The workflow is not the tested checkout: release-gates reads the original YAML.
jobs:
  diagnose:
    name: Original AST and release-gates files
    runs-on: ubuntu-slim
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tested-source
    steps:
      - name: Initialize diagnostic paths before checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/eight-failures-evidence" "$RUNNER_TEMP/srcbuild-driver-evidence"
          {
            printf 'DIAGNOSTIC_EVIDENCE=%s/eight-failures-evidence\n' "$RUNNER_TEMP"
            printf 'RELEASE_EVIDENCE_TEST_ROOT=%s/release-evidence-tests\n' "$RUNNER_TEMP"
            printf 'CJCJ_TEST_EVIDENCE=%s/srcbuild-driver-evidence\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Checkout immutable tested source
        uses: actions/checkout@v7
        with:
          ref: 07c6ca0a6168ce2e33a72c559d2a0d5f2f363e68
          path: tested-source
      - name: Record tested source and native runner identity
        shell: bash
        run: |
          mkdir -p "$DIAGNOSTIC_EVIDENCE" "$CJCJ_TEST_EVIDENCE"
          test "$(git rev-parse HEAD)" = 07c6ca0a6168ce2e33a72c559d2a0d5f2f363e68
          git diff --exit-code HEAD --
          {
            printf 'workflow_sha=%s\nworkflow_ref=%s\nrun_id=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git rev-parse HEAD 'HEAD^{tree}'
            git status --porcelain
            git ls-files -s ci/ast-support-toolchain.test.mjs ci/release-gates.test.mjs .github/workflows
            uname -a
            cat /etc/os-release
            node --version
            node -e 'const os=require("node:os"); console.log(JSON.stringify({node:process.version,execPath:process.execPath,availableParallelism:os.availableParallelism(),cpus:os.cpus().length,totalmem:os.totalmem(),freemem:os.freemem(),expectedNode:"v24.21.0",nodeMatches:process.version==="v24.21.0"}))'
            for file in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpuset.cpus.effective /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current; do
              printf '\n%s\n' "$file"
              if [[ -r "$file" ]]; then cat "$file"; else printf 'UNAVAILABLE\n'; fi
            done
          } | tee "$DIAGNOSTIC_EVIDENCE/before.txt"
      # Retain the original preceding dependency installation, without running
      # unrelated lint/test jobs or adding suspected missing cmake/ninja inputs.
      - name: Install original ShellCheck dependency
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version
      - name: Install release contract dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip clang lld libssl-dev python3 build-essential jq
          npm exec --yes --package=zx@8 -- node ci/test-zx.mjs prepare "$RUNNER_TEMP/test-zx.json"
      - name: Record prepared tool identities
        shell: bash
        run: |
          cp "$RUNNER_TEMP/test-zx.json" "$DIAGNOSTIC_EVIDENCE/test-zx.json"
          node --input-type=module -e 'import {verifiedTool} from "./ci/test-zx.mjs"; const tool=verifiedTool(); console.log(JSON.stringify(tool)); if(tool.version!=="8.8.5") throw new Error("DIAGNOSTIC_ZX_VERSION_CHANGED: expected 8.8.5; stop before tests")'
          {
            for tool in node npm npx bash git python3 clang clang++ cc c++ ld.lld cmake ninja make zip unzip jq shellcheck; do
              printf '\nTOOL %s\n' "$tool"
              if command -v "$tool"; then
                set +e
                "$tool" --version
                rc=$?
                set -e
                printf 'version_rc=%s\n' "$rc"
              else
                printf 'NOT_FOUND\n'
              fi
            done
          } > "$DIAGNOSTIC_EVIDENCE/tools.txt" 2>&1
          cat "$DIAGNOSTIC_EVIDENCE/tools.txt"
      - name: Install official lineage input
        shell: bash
        run: |
          source ci/host_sdk_pin.env
          mkdir -p "$RUNNER_TEMP/lineage-cjv"
          curl -fsSL https://github.com/Zxilly/cjv/releases/download/v0.2.20/cjv_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP/lineage-cjv"
          cjv_bin=$(find "$RUNNER_TEMP/lineage-cjv" -type f -name cjv | head -1)
          "$cjv_bin" install "$CJCJ_TOOLCHAIN"
      - name: Prepare pinned runtime contract input
        run: node ci/test-zx.mjs run "$RUNNER_TEMP/test-zx-bin" npx --yes zx@8 ci/prepare-runtime-test-input.mjs "$RUNNER_TEMP/runtime-contract-input"
      - name: Stream both complete original test files
        shell: bash
        run: |
          git diff --exit-code HEAD --
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawn} from 'node:child_process';
          import {testEnvironment} from './ci/test-zx.mjs';
          const evidence = process.env.DIAGNOSTIC_EVIDENCE;
          const env = testEnvironment(path.join(process.env.RUNNER_TEMP, 'test-zx-bin'), {
            ...process.env,
            CJCJ_TEST_ZX_LOG: path.join(process.env.CJCJ_TEST_EVIDENCE, 'zx-calls.jsonl'),
          });
          const args = ['--test', '--test-reporter=tap', '--test-timeout=300000',
            'ci/ast-support-toolchain.test.mjs', 'ci/release-gates.test.mjs'];
          const command = [process.execPath, ...args];
          const started = new Date().toISOString();
          const start = performance.now();
          const stdout = fs.openSync(path.join(evidence, 'tests.tap'), 'w');
          const stderr = fs.openSync(path.join(evidence, 'tests.stderr'), 'w');
          fs.writeFileSync(path.join(evidence, 'start.json'), JSON.stringify({
            command, cwd: process.cwd(), started, source: '07c6ca0a6168ce2e33a72c559d2a0d5f2f363e68',
            node: process.version, expectedNode: 'v24.21.0', nodeMatches: process.version === 'v24.21.0',
          }, null, 2) + '\n');
          // Default Node scheduling is unchanged. No name filter or extra concurrency.
          const child = spawn(process.execPath, args, {env, stdio: ['inherit', 'pipe', 'pipe']});
          let spawnError = null;
          child.on('error', error => { spawnError = String(error); });
          child.stdout.on('data', data => { fs.writeSync(stdout, data); process.stdout.write(data); });
          child.stderr.on('data', data => { fs.writeSync(stderr, data); process.stderr.write(data); });
          child.on('exit', (code, signal) => {
            // Capture the test process itself, before stream draining or artifact steps.
            fs.writeFileSync(path.join(evidence, 'tests.rc'), code === null ? 'NOT_EXITED\n' : `${code}\n`);
            fs.writeFileSync(path.join(evidence, 'exit.json'), JSON.stringify({
              pid: child.pid, code, signal, ended: new Date().toISOString(), wallMs: performance.now() - start,
            }, null, 2) + '\n');
          });
          child.on('close', (code, signal) => {
            fs.closeSync(stdout);
            fs.closeSync(stderr);
            fs.writeFileSync(path.join(evidence, 'result.json'), JSON.stringify({
              command, pid: child.pid, started, ended: new Date().toISOString(),
              code, signal, spawnError, wallMs: performance.now() - start,
            }, null, 2) + '\n');
            process.exitCode = code === 0 && !spawnError && !signal ? 0 : (code || 1);
          });
          NODE
      - name: Record source after execution without rerunning tests
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          # Do not depend on successful initialization or checkout for collection.
          evidence="$RUNNER_TEMP/eight-failures-evidence"
          mkdir -p "$evidence"
          if [[ ! -e tested-source/.git ]]; then
            printf 'SOURCE_CHECKOUT_NOT_AVAILABLE\n' > "$evidence/after.txt"
            exit 1
          fi
          {
            git -C tested-source rev-parse HEAD 'HEAD^{tree}'
            git -C tested-source status --porcelain
            git -C tested-source diff --stat HEAD --
          } > "$evidence/after.txt"
          git -C tested-source diff --exit-code HEAD --
      - name: Preserve complete diagnostic output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eight-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/eight-failures-evidence
            ${{ runner.temp }}/srcbuild-driver-evidence
          if-no-files-found: error
