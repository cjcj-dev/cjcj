name: CI
'on':
  push:
    branches:
    - master
  pull_request: {}
  workflow_dispatch:
    inputs:
      prepare_run_id:
        description: 'Successful Prepare run (default: latest on master)'
        type: string
        required: false
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Read tool versions
      run: node -e 'const p=require("./build/pins.json").toolchains; console.log("node="+p.node+"\nsccache="+p.sccache)' >> "$GITHUB_OUTPUT"
      id: pins
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ steps.pins.outputs.node }}
    - name: Check Node, pins and Python
      run: |-
        for file in build/*.mjs runtime_shim/build_shim.mjs; do node --check "$file"; done
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import {loadPins,PLATFORMS} from './build/common.mjs';
        const {repos,hostSdk,crossSdks,toolchains}=loadPins();
        for(const name of 'llvm runtime compiler stdx tools javaInterop bounds pcre2 flatbuffers'.split(' ')) assert.match(repos[name].sha,/^[0-9a-f]{40}$/);
        for(const p of Object.keys(PLATFORMS)){const h=hostSdk.platforms[p]; assert.ok(h.size>0 && h.url.endsWith(h.archive));assert.match(h.sha256,/^[0-9a-f]{64}$/);}
        for(const name of ['androidNdk','ohos','wasiSysroot']) assert.ok(crossSdks[name]);
        for(const name of 'node sccache cmakeMacos libxml2 windowsLlvmMingw linuxCrossMingw staticLibs python cjbind'.split(' ')) assert.ok(toolchains[name]);
        NODE
        python3 -m py_compile scripts/objc_preamble_unit.py test/store_strength/test_checker.py
        node --test runtime_shim/tests/compiler_heap_defaults.test.mjs tests/sdk_build/stages.test.mjs
    - name: Lint workflows
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
  build-and-smoke:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux-x64
          runner: ubuntu-24.04
        - platform: linux-aarch64
          runner: ubuntu-24.04-arm
    env:
      CJCJ_HEAP_SIZE: ${{ vars.cjHeapSize }}
      cjHeapSwap: 'on'
      PLATFORM: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Read tool versions
      run: node -e 'const p=require("./build/pins.json").toolchains; console.log("node="+p.node+"\nsccache="+p.sccache)' >> "$GITHUB_OUTPUT"
      id: pins
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ steps.pins.outputs.node }}
    - name: Enable Linux bootstrap swap
      if: runner.os == 'Linux'
      run: node build/setup.mjs swap
    - name: Select successful Prepare run
      run: |-
        id="$PREPARE_RUN"
        if [[ -z "$id" ]]; then
          id=$(gh run list --workflow prepare.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId')
        fi
        [[ "$id" =~ ^[0-9]+$ ]]
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '[.path,.conclusion] | join(" ")' | grep -Fx '.github/workflows/prepare.yml success'
        echo "run=$id" >> "$GITHUB_OUTPUT"
      id: prepare
      env:
        GH_TOKEN: ${{ github.token }}
        PREPARE_RUN: ${{ inputs.prepare_run_id }}
    - uses: actions/download-artifact@v8.0.2
      with:
        name: native-base-${{ matrix.platform }}
        github-token: ${{ github.token }}
        run-id: ${{ steps.prepare.outputs.run }}
    - name: Unpack native base
      run: |-
        mkdir -p ../base
        node build/setup.mjs unpack --archive native-base.tar --dir ../base
        rm native-base.tar
    - name: Install build dependencies
      run: node build/setup.mjs deps --platform "$PLATFORM" --mode full
    - name: Build and smoke test this checkout
      run: |-
        node build/setup.mjs sources --repos runtime,bounds,pcre2 --override "runtime=$(cat ../base/runtime.ref)" --out ../src
        node build/build-compiler.mjs --stage stage0 --host-sdk ../base/host --native ../base/native --runtime ../base/runtime --out ../stage0
        node build/build-stdlib.mjs --stage std-bootstrap --sources ../src --sdk ../stage0 --runtime ../base/runtime --out ../initial
        rm -rf ../stage0 ../stage0.target
        node build/build-stdlib.mjs --stage stage1-std --sources ../src --sdk ../initial --runtime ../base/runtime --out ../stage1
        node build/build-compiler.mjs --stage stage2 --sdk ../initial --std ../stage1 --native ../base/native --host-sdk ../base/host --out ../current
        node build/test-sdk.mjs --sdk ../current --mode smoke
  package-tests:
    runs-on: ubuntu-24.04
    env:
      CJCJ_HEAP_SIZE: ${{ vars.cjHeapSize }}
      cjHeapSwap: 'on'
      PLATFORM: linux-x64
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Read tool versions
      run: node -e 'const p=require("./build/pins.json").toolchains; console.log("node="+p.node+"\nsccache="+p.sccache)' >> "$GITHUB_OUTPUT"
      id: pins
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ steps.pins.outputs.node }}
    - name: Enable Linux bootstrap swap
      if: runner.os == 'Linux'
      run: node build/setup.mjs swap
    - name: Select successful Prepare run
      run: |-
        id="$PREPARE_RUN"
        if [[ -z "$id" ]]; then
          id=$(gh run list --workflow prepare.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId')
        fi
        [[ "$id" =~ ^[0-9]+$ ]]
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '[.path,.conclusion] | join(" ")' | grep -Fx '.github/workflows/prepare.yml success'
        echo "run=$id" >> "$GITHUB_OUTPUT"
      id: prepare
      env:
        GH_TOKEN: ${{ github.token }}
        PREPARE_RUN: ${{ inputs.prepare_run_id }}
    - uses: actions/download-artifact@v8.0.2
      with:
        name: ci-sdk-linux-x64
        github-token: ${{ github.token }}
        run-id: ${{ steps.prepare.outputs.run }}
    - name: Install build dependencies
      run: node build/setup.mjs deps --platform "$PLATFORM" --mode full
    - name: Build this checkout and run workspace package tests
      run: |-
        mkdir -p ../prepared
        node build/setup.mjs unpack --archive ci-sdk.tar.gz --dir ../prepared --sdk-root cangjie
        node build/build-compiler.mjs --stage installed --sdk ../prepared/cangjie --out ../current
        node build/test-sdk.mjs --sdk ../current --mode packages
