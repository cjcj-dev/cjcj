name: Pinned in-process LLVM dylib
on:
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: Optional complete LLVM candidate SHA; requires runtime_ref.
        type: string
        default: ''
      runtime_ref:
        description: Optional complete paired runtime SHA; requires llvm_ref.
        type: string
        default: ''
      platforms:
        description: Selected native platforms; all selects Linux and Darwin.
        type: string
        default: all
      platform_set:
        description: Optional shared platform subset; Windows has its own producer.
        type: string
        default: ''
      cache-component:
        description: 'Isolated cache namespace for a cold/warm pair; reuse exactly for the warm run'
        type: string
        default: llvm-dylib
  workflow_call:
    inputs:
      llvm_ref:
        description: Optional complete LLVM candidate SHA; requires runtime_ref.
        type: string
        default: ''
      runtime_ref:
        description: Optional complete paired runtime SHA; requires llvm_ref.
        type: string
        default: ''
      platforms:
        description: Selected native platforms; all selects Linux and Darwin.
        type: string
        default: all
      platform_set:
        description: Optional shared platform subset; Windows has its own producer.
        type: string
        default: ''
      cache-component:
        description: 'Component cache namespace (independent of the dylib artifact and pin)'
        type: string
        default: llvm-dylib
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.dylib_matrix }}
      platforms: ${{ steps.select.outputs.tuple_platforms }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate the selected source pair
        env:
          CJCJ_NATIVE_LLVM_REF: ${{ inputs.llvm_ref }}
          CJCJ_NATIVE_RUNTIME_REF: ${{ inputs.runtime_ref }}
        run: node ci/native-llvm-inputs.mjs
      - name: Select native dylib producers
        id: select
        env:
          REQUESTED: ${{ inputs.platforms || 'all' }}
          PLATFORM_SET: ${{ inputs.platform_set }}
        run: node ci/llvm-tools-matrix.mjs
  dylib:
    needs: plan
    if: needs.plan.outputs.platforms != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      LLVM_DYLIB_LIBRARY: ${{ matrix.library }}
      LLVM_DYLIB_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Select native build capacity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import {buildCapacity, selectBuildJobs} from './ci/build-resources.mjs';
          const capacity = await buildCapacity();
          const jobs = await selectBuildJobs(undefined, process.env, capacity);
          const disk = fs.statfsSync('.');
          console.log('NATIVE_BUILD_CAPACITY ' + JSON.stringify({...capacity, jobs, linkJobs: 1,
            freeMemory: os.freemem(), diskAvailable: disk.bavail * disk.bsize}));
          fs.appendFileSync(process.env.GITHUB_ENV, 'CMAKE_BUILD_PARALLEL_LEVEL=' + jobs + '\n');
          NODE
      - name: Load native LLVM source pair
        id: pin
        env:
          CJCJ_NATIVE_LLVM_REF: ${{ inputs.llvm_ref }}
          CJCJ_NATIVE_RUNTIME_REF: ${{ inputs.runtime_ref }}
        run: node ci/native-llvm-inputs.mjs
      - uses: ./.github/actions/sccache
        with:
          component: ${{ inputs.cache-component }}
          platform: ${{ matrix.platform }}
          pin: ${{ steps.pin.outputs.sha }}-${{ steps.pin.outputs.runtime_sha }}
          cache-size: 3G
      - name: Build three-target shared LLVM
        run: |
          set -euo pipefail
          ulimit -c 0
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang cmake ninja-build
          fi
          git init llvm-fork
          git -C llvm-fork remote add origin "$LLVM_URL"
          git -C llvm-fork fetch --depth=1 origin "$CJCJ_NATIVE_LLVM_REF"
          git -C llvm-fork checkout --detach FETCH_HEAD
          test "$(git -C llvm-fork rev-parse HEAD)" = "$CJCJ_NATIVE_LLVM_REF"
          npx --yes zx@8 ci/fetch-llvm-runtime.mjs paired-runtime
          cmake -G Ninja -S llvm-fork/llvm -B dylib-build \
            -DCANGJIE_RUNTIME_SOURCE_DIR="$PWD/paired-runtime" \
            -DCJ_LLVM_COMMIT="$CJCJ_NATIVE_LLVM_REF" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO='-O2 -g1 -DNDEBUG' \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O2 -g1 -DNDEBUG' \
            -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_ENABLE_RTTI=OFF \
            -DLLVM_PARALLEL_COMPILE_JOBS="$CMAKE_BUILD_PARALLEL_LEVEL" -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DBUILD_SHARED_LIBS=OFF -DLLVM_BUILD_LLVM_DYLIB=ON -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DLLVM_TARGETS_TO_BUILD='X86;ARM;AArch64' -DLLVM_ENABLE_PROJECTS='' \
            -DCMAKE_CXX_FLAGS='-include cstdint -include unordered_map -include map -include vector -include string'
          cmake --build dylib-build --target LLVM llvm-nm --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          # nm --defined-only must see the real full symbol table, including
          # local symbols; a stripped binary cannot establish that invariant.
          dylib-build/bin/llvm-nm --defined-only "dylib-build/lib/$LLVM_DYLIB_LIBRARY" > dylib-build/defined-symbols.txt
          grep -q LLVMInitializeX86TargetInfo dylib-build/defined-symbols.txt
          mkdir -p depot/dylib
          cp -L "dylib-build/lib/$LLVM_DYLIB_LIBRARY" "depot/dylib/$LLVM_DYLIB_LIBRARY"
          file "depot/dylib/$LLVM_DYLIB_LIBRARY" | tee depot/dylib/architecture.txt
          cp dylib-build/defined-symbols.txt depot/dylib/defined-symbols.txt
          node ci/llvm-dylib/record-manifest.mjs depot/dylib llvm-fork paired-runtime
      - name: Verify exact loaded library and C API
        run: |
          set -euo pipefail
          LLVM_NM="$PWD/dylib-build/bin/llvm-nm" python3 ci/llvm-dylib/verify.py depot/dylib "$CJCJ_NATIVE_LLVM_REF" "$BUILT_DYLIB_SHA256" | tee depot/dylib/loaded.json
          test -s depot/dylib/loaded.json
      - name: Exercise bootstrap identity check with real libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          wrong="$(ldconfig -p | awk '/libLLVM-[0-9]+\.so/ && !found {print $NF; found=1}')"
          test -f "$wrong"
          sha256sum depot/dylib/libLLVM-15.so "$wrong" | tee depot/dylib/control-libraries.sha256
          test "$(sha256sum "$wrong" | cut -d' ' -f1)" != "$BUILT_DYLIB_SHA256"
          mkdir -p dylib-build/invalid-dylib
          cp -L "$wrong" dylib-build/invalid-dylib/libLLVM-15.so
          cp depot/dylib/manifest.json dylib-build/invalid-dylib/manifest.json
          if python3 ci/llvm-dylib/verify.py dylib-build/invalid-dylib "$CJCJ_NATIVE_LLVM_REF" "$BUILT_DYLIB_SHA256" \
              > dylib-build/invalid-dylib/stdout.log 2> dylib-build/invalid-dylib/stderr.log; then
            echo 'wrong in-process LLVM library unexpectedly passed verification' >&2
            exit 1
          fi
          grep -F 'LLVM_DYLIB_SHA256_MISMATCH expected=' dylib-build/invalid-dylib/stderr.log
          DYLIB_TEST_FILE="$PWD/depot/dylib/libLLVM-15.so" DYLIB_TEST_WRONG_FILE="$wrong" \
            node --test ci/release/prepare_bootstrap_inputs.test.mjs ci/release/prepare_llvm_dylib.test.mjs | tee depot/dylib/input-tests.log
      - name: Reject a changed Darwin library before loading it
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dylib-build/invalid-dylib
          cp "depot/dylib/$LLVM_DYLIB_LIBRARY" dylib-build/invalid-dylib/
          cp depot/dylib/manifest.json dylib-build/invalid-dylib/
          printf 'changed' >> "dylib-build/invalid-dylib/$LLVM_DYLIB_LIBRARY"
          if LLVM_NM="$PWD/dylib-build/bin/llvm-nm" python3 ci/llvm-dylib/verify.py dylib-build/invalid-dylib "$CJCJ_NATIVE_LLVM_REF" "$BUILT_DYLIB_SHA256" > dylib-build/rejected.log 2>&1; then
            echo 'changed library unexpectedly accepted' >&2
            exit 1
          fi
          grep -F 'LLVM_DYLIB_SHA256_MISMATCH expected=' dylib-build/rejected.log
          cp dylib-build/rejected.log depot/dylib/identity-rejection.log
      - uses: ./.github/actions/sccache-report
        if: always()
        with:
          component: ${{ inputs.cache-component }}
          platform: ${{ matrix.platform }}
          require-compiles: ${{ job.status == 'success' }}
      - uses: actions/upload-artifact@v7
        with:
          name: llvm-dylib-${{ matrix.platform }}
          path: depot/dylib
          if-no-files-found: error
          retention-days: 90
