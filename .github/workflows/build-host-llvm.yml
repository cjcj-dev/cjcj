name: Bootstrap host LLVM
on:
  workflow_call:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux_x86_64, library: libLLVM-15.so}
          - {runner: ubuntu-24.04-arm, platform: linux_aarch64, library: libLLVM-15.so}
          - {runner: macos-15, platform: darwin_aarch64, library: libLLVM.dylib}
          - {runner: macos-15-intel, platform: darwin_x86_64, library: libLLVM.dylib}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      HOST_LLVM_PLATFORM: ${{ matrix.platform }}
      HOST_LLVM_LIBRARY: ${{ matrix.library }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Load independent host source pin
        id: pin
        run: |
          source ci/bootstrap/host_llvm_source.env
          printf 'HOST_LLVM_URL=%s\nHOST_LLVM_SOURCE_SHA=%s\n' "$HOST_LLVM_URL" "$HOST_LLVM_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "sha=$HOST_LLVM_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/sccache
        with:
          component: host-llvm
          platform: ${{ matrix.platform }}
          pin: ${{ steps.pin.outputs.sha }}
          cache-size: 3G
      - name: Build host shared library from fixed source
        run: |
          set -euo pipefail
          ulimit -c 0
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang cmake ninja-build
            jobs=$(nproc)
          else
            jobs=$(sysctl -n hw.logicalcpu)
          fi
          git init host-source
          git -C host-source remote add origin "$HOST_LLVM_URL"
          git -C host-source fetch --depth=1 origin "$HOST_LLVM_SOURCE_SHA"
          git -C host-source checkout --detach FETCH_HEAD
          test "$(git -C host-source rev-parse HEAD)" = "$HOST_LLVM_SOURCE_SHA"
          # This source's Release recipe adds -Wl,-s (llvm/CMakeLists.txt:1081).
          # Keep the full symbol table needed for the host/colour evidence.
          cmake -G Ninja -S host-source/llvm -B host-build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO='-O2 -g1 -DNDEBUG' \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O2 -g1 -DNDEBUG' \
            -DCMAKE_CXX_STANDARD=17 -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_ENABLE_RTTI=ON \
            -DBUILD_SHARED_LIBS=OFF -DLLVM_BUILD_LLVM_DYLIB=ON -DLLVM_LINK_LLVM_DYLIB=ON \
            -DLLVM_TARGETS_TO_BUILD='X86;ARM;AArch64' -DLLVM_ENABLE_PROJECTS='' \
            -DCMAKE_CXX_FLAGS='-include cstdint -include unordered_map -include map -include vector -include string'
          echo "HOST_LLVM_BUILD_JOBS=$jobs"
          cmake --build host-build --target LLVM -j"$jobs"
          mkdir -p host-artifact
          cp -L "host-build/lib/$HOST_LLVM_LIBRARY" "host-artifact/$HOST_LLVM_LIBRARY"
          if [ "$RUNNER_OS" = Linux ]; then
            nm --defined-only "host-artifact/$HOST_LLVM_LIBRARY" > host-artifact/defined-symbols.txt
          else
            nm -U "host-artifact/$HOST_LLVM_LIBRARY" > host-artifact/defined-symbols.txt
          fi
          # The official host llc imports this RTTI symbol. Colour-dylib flags
          # cannot be reused for the official host ABI.
          grep -E ' _{1,2}ZTIN4llvm2cl6OptionE(@@?[^[:space:]]+)?$' host-artifact/defined-symbols.txt
          c++filt < host-artifact/defined-symbols.txt > host-artifact/demangled-symbols.txt
          grep -F 'llvm::SelectionDAGBuilder::visitRelocate(' host-artifact/demangled-symbols.txt
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('host-artifact')
          symbols = (root / 'demangled-symbols.txt').read_text()
          if 'llvm::isCJTypedReadHelperCandidate(' in symbols:
              raise SystemExit('HOST_LLVM_COLOUR_SYMBOL_PRESENT')
          library = root / os.environ['HOST_LLVM_LIBRARY']
          digest = hashlib.sha256(library.read_bytes()).hexdigest()
          record = dict(source_sha=os.environ['HOST_LLVM_SOURCE_SHA'],
                        run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                        producer_sha=os.environ['GITHUB_SHA'], platform=os.environ['HOST_LLVM_PLATFORM'], sha256=digest)
          (root / 'manifest.json').write_text(json.dumps(record, indent=2) + '\n')
          (root / 'SHA256SUMS').write_text(digest + '  ' + library.name + '\n')
          print(json.dumps(record))
          PY
      - uses: actions/upload-artifact@v7
        id: artifact
        with:
          name: host-llvm-${{ matrix.platform }}
          path: host-artifact
          if-no-files-found: error
          retention-days: 90
      - name: Record immutable artifact identity
        run: |
          echo 'HOST_LLVM_ARTIFACT_ID=${{ steps.artifact.outputs.artifact-id }}' | tee -a "$GITHUB_STEP_SUMMARY"
          cat host-artifact/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/sccache-report
        if: always()
        with:
          component: host-llvm
          platform: ${{ matrix.platform }}
          require-compiles: ${{ job.status == 'success' }}
