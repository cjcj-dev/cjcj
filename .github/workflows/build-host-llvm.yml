name: Bootstrap host LLVM
on:
  workflow_call:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Load independent host source pin
        id: pin
        run: |
          source ci/bootstrap/host_llvm_source.env
          printf 'HOST_LLVM_URL=%s\nHOST_LLVM_SOURCE_SHA=%s\n' "$HOST_LLVM_URL" "$HOST_LLVM_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "sha=$HOST_LLVM_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/sccache
        with:
          component: host-llvm
          platform: linux_x86_64
          pin: ${{ steps.pin.outputs.sha }}
          cache-size: 3G
      - name: Build host shared library from fixed source
        run: |
          set -euo pipefail
          ulimit -c 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build
          git init host-source
          git -C host-source remote add origin "$HOST_LLVM_URL"
          git -C host-source fetch --depth=1 origin "$HOST_LLVM_SOURCE_SHA"
          git -C host-source checkout --detach FETCH_HEAD
          test "$(git -C host-source rev-parse HEAD)" = "$HOST_LLVM_SOURCE_SHA"
          cmake -G Ninja -S host-source/llvm -B host-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD=17 -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_ENABLE_RTTI=OFF \
            -DBUILD_SHARED_LIBS=OFF -DLLVM_BUILD_LLVM_DYLIB=ON -DLLVM_LINK_LLVM_DYLIB=ON \
            -DLLVM_TARGETS_TO_BUILD='X86;ARM;AArch64' -DLLVM_ENABLE_PROJECTS='' \
            -DCMAKE_CXX_FLAGS='-include cstdint -include unordered_map -include map -include vector -include string'
          cmake --build host-build --target LLVM -j"$(nproc)"
          mkdir -p host-artifact
          cp -L host-build/lib/libLLVM-15.so host-artifact/libLLVM-15.so
          nm --defined-only host-artifact/libLLVM-15.so > host-artifact/defined-symbols.txt
          c++filt < host-artifact/defined-symbols.txt > host-artifact/demangled-symbols.txt
          grep -F 'llvm::SelectionDAGBuilder::visitRelocate(' host-artifact/demangled-symbols.txt
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('host-artifact')
          symbols = (root / 'demangled-symbols.txt').read_text()
          if 'llvm::isCJTypedReadHelperCandidate(' in symbols:
              raise SystemExit('HOST_LLVM_COLOUR_SYMBOL_PRESENT')
          library = root / 'libLLVM-15.so'
          digest = hashlib.sha256(library.read_bytes()).hexdigest()
          record = dict(source_sha=os.environ['HOST_LLVM_SOURCE_SHA'],
                        run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                        producer_sha=os.environ['GITHUB_SHA'], platform='linux_x86_64', sha256=digest)
          (root / 'manifest.json').write_text(json.dumps(record, indent=2) + '\n')
          (root / 'SHA256SUMS').write_text(digest + '  libLLVM-15.so\n')
          print(json.dumps(record))
          PY
      - uses: actions/upload-artifact@v7
        id: artifact
        with:
          name: host-llvm-linux_x86_64
          path: host-artifact
          if-no-files-found: error
          retention-days: 90
      - name: Record immutable artifact identity
        run: |
          echo 'HOST_LLVM_ARTIFACT_ID=${{ steps.artifact.outputs.artifact-id }}' | tee -a "$GITHUB_STEP_SUMMARY"
          cat host-artifact/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/sccache-report
        if: always()
        with:
          component: host-llvm
          platform: linux_x86_64
          require-compiles: ${{ job.status == 'success' }}
