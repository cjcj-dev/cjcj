name: Linux ARM packaged smoke soak

on:
  workflow_dispatch:
    inputs:
      native_runtime_artifact:
        description: Existing native-runtime-install artifact prefix
        type: string
        required: false
        default: ''
      native_runtime_run_id:
        description: Frozen producer run for native runtime installation
        type: string
        required: false
        default: ''
      native_llvm_ref:
        description: Explicit paired LLVM full commit
        type: string
        required: false
        default: ''
      native_runtime_ref:
        description: Explicit paired runtime full commit
        type: string
        required: false
        default: ''
      native_host_version:
        description: Exact official bootstrap host version for this pair
        type: string
        required: false
        default: ''
      shim_source_selection:
        description: Cjo header source repository and full commit JSON; private fixed sources require reachable repositories
        type: string
        required: false
        default: "{}"
      native_source_selection:
        description: Explicit native source repository and full commit JSON; empty preserves fixed defaults
        type: string
        required: false
        default: '{}'
      native_build_inputs_artifact:
        required: false
        type: string
        default: ''
      native_build_inputs_run_id:
        required: false
        type: string
        default: ''
      source_selection:
        required: false
        type: string
        default: '{}'
      native_inputs_artifact:
        description: Reviewed complete native installation artifact prefix, suffixed by source target
        required: true
        type: string
      native_inputs_run_id:
        description: Original native installation producer run
        required: true
        type: string

      rounds:
        description: Full packaged-smoke rounds
        required: false
        type: number
        default: 20
      std_artifact:
        description: >
          Same-platform source-built final std artifact. build-release-package.yml
          requires it and asserts it equals final-std-<platform>. Empty selects
          the registry-derived artifact. The source-final-std job is its
          only producer in this run.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  matrix-plan:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
      runner: ${{ steps.matrix.outputs.runner }}
      platform: ${{ steps.matrix.outputs.platform }}
      llvm_platform: ${{ steps.matrix.outputs.llvm_platform }}
      sdk_runtime_dir: ${{ steps.matrix.outputs.sdk_runtime_dir }}
      std_artifact: ${{ steps.matrix.outputs.std_artifact }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Export target matrix
        id: matrix
        run: node ci/target-matrix.mjs arm-soak

  source-final-std:
    needs: matrix-plan
    name: Build source SDK and final std artifacts
    uses: ./.github/workflows/srcbuild.yml
    with:
      native_build_inputs_artifact: ${{ inputs.native_build_inputs_artifact }}
      native_build_inputs_run_id: ${{ inputs.native_build_inputs_run_id }}
      source_selection: ${{ inputs.source_selection }}
      native_inputs_artifact: ${{ inputs.native_inputs_artifact }}
      shim_source_selection: ${{ inputs.shim_source_selection }}
      native_source_selection: ${{ inputs.native_source_selection }}
      native_inputs_run_id: ${{ inputs.native_inputs_run_id }}
      native_runtime_artifact: ${{ inputs.native_runtime_artifact }}
      native_runtime_run_id: ${{ inputs.native_runtime_run_id }}
      native_llvm_ref: ${{ inputs.native_llvm_ref }}
      native_runtime_ref: ${{ inputs.native_runtime_ref }}
      native_host_version: ${{ inputs.native_host_version }}
      cangjie_ref: 0.0.0-arm-soak
      build_type: relwithdebinfo
      targets: ${{ needs.matrix-plan.outputs.targets }}

  package:
    name: Build Linux ARM package once
    needs: [matrix-plan, source-final-std]
    uses: ./.github/workflows/build-release-package.yml
    with:
      native_source_selection: ${{ inputs.native_source_selection }}
      native_llvm_ref: ${{ inputs.native_llvm_ref }}
      native_runtime_ref: ${{ inputs.native_runtime_ref }}
      native_host_version: ${{ inputs.native_host_version }}
      runner: ${{ needs.matrix-plan.outputs.runner }}
      platform: ${{ needs.matrix-plan.outputs.platform }}
      llvm_platform: ${{ needs.matrix-plan.outputs.llvm_platform }}
      sdk_runtime_dir: ${{ needs.matrix-plan.outputs.sdk_runtime_dir }}
      std_artifact: ${{ inputs.std_artifact || needs.matrix-plan.outputs.std_artifact }}
      version: 0.0.0-arm-soak
    secrets: inherit

  soak:
    name: Packaged smoke x${{ inputs.rounds }}
    needs: [matrix-plan, package]
    runs-on: ${{ needs.matrix-plan.outputs.runner }}
    timeout-minutes: 300
    steps:
      - name: Checkout cjcj smoke corpus
        uses: actions/checkout@v7

      - name: Download Linux ARM package
        uses: actions/download-artifact@v8
        with:
          name: pkg-linux-aarch64
          path: dist

      - name: Run full packaged smoke rounds
        shell: bash
        run: |
          set -euo pipefail
          rounds="${{ inputs.rounds }}"
          [[ "$rounds" =~ ^[1-9][0-9]*$ ]] || { echo "invalid rounds: $rounds"; exit 2; }
          pkg=cjcj-0.0.0-arm-soak-linux-aarch64
          extract="$RUNNER_TEMP/arm-soak-package"
          work_root="$RUNNER_TEMP/arm-soak-rounds"
          rm -rf "$extract" "$work_root"
          mkdir -p "$extract" "$work_root"
          trap 'rm -rf "$extract" "$work_root"' EXIT
          tar -C "$extract" -xzf "dist/${pkg}.tar.gz"
          # shellcheck disable=SC1090
          source "$extract/cangjie/envsetup.sh"
          export cjHeapSize=12GB
          compiler="$extract/cangjie/bin/cjc"
          {
            echo '### Linux ARM packaged smoke soak'
            echo
            echo '| Round | Result | Exit | Seconds |'
            echo '|---:|:---:|---:|---:|'
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for round in $(seq 1 "$rounds"); do
            work="$work_root/round-${round}"
            log="$work_root/round-${round}.log"
            rm -rf "$work"
            started=$SECONDS
            set +e
            npx --yes zx@8 ci/smoke/run_smoke.mjs "$compiler" "$work" >"$log" 2>&1
            rc=$?
            set -e
            elapsed=$((SECONDS - started))
            if [ "$rc" -eq 0 ]; then result=PASS; else result=FAIL; failed=1; fi
            printf '| %s | %s | %s | %s |\n' "$round" "$result" "$rc" "$elapsed" >> "$GITHUB_STEP_SUMMARY"
            echo "ARM_SOAK_ROUND round=$round result=$result exit=$rc seconds=$elapsed"
            sed "s/^/[round $round] /" "$log"
            rm -rf "$work" "$log"
          done
          echo "ARM_SOAK_SUMMARY rounds=$rounds failed=$failed"
          test "$failed" -eq 0

# Source-build owns every artifact the package job downloads on this platform:
# final-std-linux-aarch64, source-cjpm-linux-aarch64, and (via its own fixed-llvm
# job) fixed-llvm-tools-linux_aarch64. Calling build-fixed-llc.yml here as well
# would upload the four fixed-llvm-tools-* names twice in one run, which
# upload-artifact rejects, so this workflow keeps release.yml's single-producer
# shape and reaches the LLVM tools through srcbuild.yml.
