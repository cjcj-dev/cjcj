name: One source target / verified SDK phases

on:
  workflow_call:
    inputs:
      native_runtime_artifact:
        description: Existing native-runtime-install artifact prefix
        type: string
        required: false
        default: ''
      native_runtime_run_id:
        description: Frozen producer run for native runtime installation
        type: string
        required: false
        default: ''
      native_llvm_ref:
        description: Explicit paired LLVM full commit
        type: string
        required: false
        default: ''
      native_runtime_ref:
        description: Explicit paired runtime full commit
        type: string
        required: false
        default: ''
      native_host_version:
        description: Exact official bootstrap host version for this pair
        type: string
        required: false
        default: ''
      shim_source_selection:
        description: Cjo header source repository and full commit JSON; private fixed sources require reachable repositories
        type: string
        required: false
        default: "{}"
      native_build_inputs_artifact:
        description: Optional native-cjdb source/dependency artifact prefix; runs the existing producer before SDK configuration
        type: string
        required: false
        default: ''
      native_build_inputs_run_id:
        description: Original run containing native-cjdb.json and its real dependencies
        type: string
        required: false
        default: ''
      source_selection:
        description: Ordinary build repository options JSON, including explicit full stdx url/tag; empty keeps defaults
        type: string
        required: false
        default: '{}'
      native_inputs_artifact:
        description: Explicit complete native N/R/AST installations and exported paired tools with locations.json
        required: true
        type: string
      native_inputs_run_id:
        description: Original run producing the selected native installations
        required: true
        type: string
      cangjie_ref:
        description: Optional SDK version label; source repository revisions remain pinned
        required: false
        type: string
        default: ''
      build_type:
        description: C++ SDK build type for native hosts
        required: false
        type: string
        default: relwithdebinfo
      dry_run:
        description: Authorize an exact runtime_ref override without publishing
        required: false
        type: boolean
        default: false
      runtime_ref:
        description: Dry-run only; exact runtime commit, otherwise ci/runtime_pin.env is used
        required: false
        type: string
        default: ''
      targets:
        description: >-
          Comma-separated source targets to build; "all" builds every one. A
          release phase passes its own target so it pays for that target and no
          other.
        required: false
        type: string
        default: all
      build_ohos:
        description: Build OHOS runtime and final std from the native stage3 handoff
        required: false
        type: boolean
        default: false
      build_ios:
        description: Build iOS runtime and final std from the native stage3 handoff
        required: false
        type: boolean
        default: false
      build_android:
        description: Build the Android runtime and final std needed by Android release packages
        required: false
        type: boolean
        default: false
      rebuild_llvm:
        description: Bypass the whole-artifact LLVM tools cache so the LLVM sccache hit rate can be measured.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Per target set, not per ref alone: release-matrix.yml calls this workflow once
# per platform in the same run, and one group for all of them would leave every
# call but one pending -- and cancel all but the newest pending one.

env:
  CJCJ_NATIVE_RUNTIME_ARTIFACT: ${{ inputs.native_runtime_artifact }}
  CJCJ_NATIVE_RUNTIME_RUN_ID: ${{ inputs.native_runtime_run_id }}
  CJCJ_NATIVE_LLVM_REF: ${{ inputs.native_llvm_ref }}
  CJCJ_NATIVE_RUNTIME_REF: ${{ inputs.native_runtime_ref }}
  CJCJ_NATIVE_HOST_VERSION: ${{ inputs.native_host_version }}
  CJCJ_NATIVE_INPUTS_ARTIFACT: ${{ inputs.native_inputs_artifact }}
  CJCJ_NATIVE_INPUTS_RUN_ID: ${{ inputs.native_inputs_run_id }}
  CJCJ_NATIVE_BUILD_INPUTS_ARTIFACT: ${{ inputs.native_build_inputs_artifact }}
  CJCJ_NATIVE_BUILD_INPUTS_RUN_ID: ${{ inputs.native_build_inputs_run_id }}
  CJCJ_SOURCE_SELECTION: ${{ inputs.source_selection }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Select targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      llvm_platforms: ${{ steps.select.outputs.llvm_platforms }}
      ohos_matrix: ${{ steps.select.outputs.ohos_matrix }}
      ios_matrix: ${{ steps.select.outputs.ios_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Select the requested targets
        id: select
        env:
          REQUESTED: ${{ inputs.targets }}
        run: node ci/srcbuild/target-matrix.mjs --targets "$REQUESTED" --single --require-ready

  fixed-llvm:
    name: Build native LLVM tools
    needs: plan
    if: inputs.native_runtime_artifact == ''
    uses: ./.github/workflows/build-llvm-tools.yml
    with:
      platforms: ${{ needs.plan.outputs.llvm_platforms }}
      rebuild: ${{ inputs.rebuild_llvm || false }}
      llvm_ref: ${{ inputs.native_llvm_ref }}
      runtime_ref: ${{ inputs.native_runtime_ref }}

  native-cjdb:
    name: ${{ matrix.target }} / native CMake install
    needs: plan
    if: inputs.native_build_inputs_artifact != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Receive fixed native source and development dependencies
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native_build_inputs_artifact }}-${{ matrix.target }}
          run-id: ${{ inputs.native_build_inputs_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-input-artifact
      - name: Materialize native producer inputs
        run: node ci/bootstrap/native-cjdb-job.mjs materialize "$RUNNER_TEMP/native-input-artifact" "$RUNNER_TEMP/native-inputs"
      - name: Set up Windows Python build tools
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3
      - uses: ./.github/actions/native-windows-tools
        if: runner.os == 'Windows'
        with:
          native-compiler: 'true'
      - name: Prepare Unix CMake tools
        if: runner.os != 'Windows'
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" install-system-deps
      - uses: ./.github/actions/sccache
        with:
          component: native-cjdb
          platform: ${{ matrix.target }}
          pin: ${{ inputs.native_llvm_ref }}
          cache-size: 2G
      - name: Build and install N and AST with the existing native producer
        if: runner.os != 'Windows'
        run: node ci/bootstrap/native-cjdb-job.mjs build "$RUNNER_TEMP/native-inputs" "$RUNNER_TEMP/native-cjdb"
      - name: Build Windows Python and native N and AST
        if: runner.os == 'Windows'
        run: node ci/bootstrap/native-cjdb-job.mjs build "$RUNNER_TEMP/native-inputs" "$RUNNER_TEMP/native-cjdb"
      - uses: actions/upload-artifact@v7
        with:
          name: native-cjdb-${{ matrix.target }}
          path: ${{ runner.temp }}/native-cjdb/native-install.tar
          if-no-files-found: error
      - name: Retain original native build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-cjdb-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-cjdb/commands.json
            ${{ runner.temp }}/native-cjdb/native-cjdb.json
            ${{ runner.temp }}/native-cjdb/build/CMakeCache.txt
            ${{ runner.temp }}/native-cjdb/build/install_manifest.txt
            ${{ runner.temp }}/native-cjdb/install/BUILD-INPUTS.json
            ${{ runner.temp }}/native-cjdb/python/producer-commands.json
          if-no-files-found: warn
      - uses: ./.github/actions/sccache-report
        if: always()
        with:
          component: native-cjdb
          platform: ${{ matrix.target }}
          require-compiles: ${{ job.status == 'success' }}

  source-stage0:
    name: ${{ matrix.target }} / source-stage0
    needs: [plan, fixed-llvm, native-cjdb]
    if: always() && needs.plan.result == 'success' && (needs.fixed-llvm.result == 'success' || needs.fixed-llvm.result == 'skipped') && (needs.native-cjdb.result == 'success' || needs.native-cjdb.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      CANGJIE_WORKSPACE: ${{ github.workspace }}/.srcbuild/workspace
      CANGJIE_BUILD_ROOT: ${{ github.workspace }}/.srcbuild/buildtools
      CJCJ_SRCBUILD_TARGET: ${{ matrix.target }}
      CJCJ_NATIVE_CJDB_INSTALL: ${{ inputs.native_build_inputs_artifact != '' && format('{0}/.srcbuild/native-cjdb-install', github.workspace) || '' }}
      CJCJ_FIXED_LLVM_DIR: ${{ github.workspace }}/.srcbuild/fixed-llc
      # sccache: .github/actions/sccache below. The disk cache is persisted as one
      # actions/cache entry per (component, target, pin); the sccache GitHub
      # Actions backend that used to be considered here wrote one entry per
      # object file and was measured at 3% hits (run 31551077927: 27840 entries,
      # 6.9 GB of the 10 GB cap, 4162 s of writes). That measurement is why the
      # backend is a tarball and not SCCACHE_GHA_ENABLED.
      cjHeapSize: 12GB
      cjHeapSwap: "on"
      CJCJ_STAGE3_STDLIB_BUILD_TYPE: ${{ inputs.build_type || 'relwithdebinfo' }}
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/native-windows-tools
        if: runner.os == 'Windows'

      - name: Receive selected native inputs before choosing the host
        if: inputs.native_runtime_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native_inputs_artifact }}-${{ matrix.target }}
          run-id: ${{ inputs.native_inputs_run_id }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/.srcbuild/native-inputs

      - name: Receive native CMake installation produced in this run
        if: inputs.native_build_inputs_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: native-cjdb-${{ matrix.target }}
          path: ${{ github.workspace }}/.srcbuild/native-cjdb-artifact
      - name: Unpack native CMake installation before host and AST selection
        if: inputs.native_build_inputs_artifact != ''
        run: node ci/bootstrap/native-cjdb-job.mjs unpack "$GITHUB_WORKSPACE/.srcbuild/native-cjdb-artifact/native-install.tar" "$CJCJ_NATIVE_CJDB_INSTALL"

      - name: Load host toolchain pin
        if: inputs.native_runtime_artifact == ''
        run: |
          cat ci/host_sdk_pin.env >> "$GITHUB_ENV"
          node ci/host-toolchain-pin.mjs --github-env >> "$GITHUB_ENV"

      - name: Load source pins
        run: |
          cat ci/source_pin.env >> "$GITHUB_ENV"
          node ci/native-llvm-inputs.mjs

      - name: Load and validate runtime pin
        env:
          CJCJ_RUNTIME_REF_OVERRIDE: ${{ inputs.runtime_ref }}
          CJCJ_NATIVE_RUNTIME_ARTIFACT: ${{ inputs.native_runtime_artifact }}
          CJCJ_NATIVE_LLVM_REF: ${{ inputs.native_llvm_ref }}
          CJCJ_NATIVE_RUNTIME_REF: ${{ inputs.native_runtime_ref }}
          CJCJ_NATIVE_HOST_VERSION: ${{ inputs.native_host_version }}
          CJCJ_ALLOW_RUNTIME_OVERRIDE: ${{ inputs.dry_run && inputs.runtime_ref != '' }}
        run: npx --yes zx@8 ci/load_runtime_pin.mjs

      - name: Resolve actual source selection
        run: node ci/srcbuild/source-selection.mjs

      - name: Select actual native host and freeze the same inputs
        if: inputs.native_runtime_artifact != ''
        env:
          CJCJ_NATIVE_INPUT_ROOT: ${{ github.workspace }}/.srcbuild/native-inputs
        run: node ci/bootstrap/prepare-native-host.mjs

      - name: Provision uncoloured host SDK
        if: inputs.native_runtime_artifact == ''
        shell: bash
        run: |
          set -euo pipefail
          export CJCJ_SDK_STOCK_LLC=1
          npx --yes zx@8 ci/setup_sdk.mjs
          host_sdk="$HOME/.cjv/toolchains/$CJCJ_TOOLCHAIN"
          test -d "$host_sdk"
          echo "CJCJ_SRCBUILD_BOOTSTRAP_SDK=$host_sdk" >> "$GITHUB_ENV"
          echo "CJCJ_OFFICIAL_SDK_ROOT=$host_sdk" >> "$GITHUB_ENV"

      # G2 describes the canonical Linux x64 SDK. Freeze right after the host
      # SDK is provisioned: the checkout itself is still clean (provisioning
      # only writes under $HOME/.cjv) and the frozen base is the archive of
      # the toolchain this build actually bootstraps from. Later build steps
      # create files and inject the product version.
      - name: Freeze G2 identity inputs
        if: inputs.native_runtime_artifact == '' && (matrix.target == 'linux-x64')
        shell: bash
        run: |
          set -euo pipefail
          test -d "$CJCJ_OFFICIAL_SDK_ROOT"
          base_archive="$RUNNER_TEMP/g2-base-sdk/host-sdk.tar"
          mkdir -p "$(dirname "$base_archive")"
          tar -cf "$base_archive" -C "$CJCJ_OFFICIAL_SDK_ROOT" .
          node ci/generate-freeze.mjs \
            --base-sdk "$base_archive" \
            --workflow-ref "${GITHUB_SHA:-$(git rev-parse HEAD)}" \
            --evidence-root "$RUNNER_TEMP/g2-campaigns" \
            | tee "$RUNNER_TEMP/g2-freeze.log"
          identity=$(sed -n 's/^G2_IDENTITY=//p' "$RUNNER_TEMP/g2-freeze.log")
          test -f "$identity"
          echo "G2_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "G2_CAMPAIGN_DIR=$(dirname "$identity")" >> "$GITHUB_ENV"

      - name: Copy host inputs for source handoffs
        if: inputs.native_runtime_artifact == ''
        shell: bash
        run: |
          set -euo pipefail
          host_sdk="$GITHUB_WORKSPACE/.srcbuild/host-sdk"
          mkdir -p "$(dirname "$host_sdk")"
          cp -a "$HOME/.cjv/toolchains/$CJCJ_TOOLCHAIN" "$host_sdk"
          cp -a "$HOME/.cjv/stdx/$CJCJ_TOOLCHAIN" "$GITHUB_WORKSPACE/.srcbuild/host-stdx"
          echo "CANGJIE_STDX_PATH=$GITHUB_WORKSPACE/.srcbuild/host-stdx/static/stdx" >> "$GITHUB_ENV"
          echo "CANGJIE_HOME=$host_sdk" >> "$GITHUB_ENV"
          echo "$host_sdk/bin" >> "$GITHUB_PATH"
          echo "$host_sdk/tools/bin" >> "$GITHUB_PATH"
          test -d "$host_sdk"
          node ci/srcbuild/host-env.mjs "$host_sdk"
          echo "CJCJ_SRCBUILD_BOOTSTRAP_SDK=$host_sdk" >> "$GITHUB_ENV"
          echo "CJCJ_OFFICIAL_SDK_ROOT=$host_sdk" >> "$GITHUB_ENV"

      - name: Copy frozen G2 identity for source handoffs
        if: inputs.native_runtime_artifact == '' && (matrix.target == 'linux-x64')
        shell: bash
        run: |
          set -euo pipefail
          destination="$GITHUB_WORKSPACE/.srcbuild/g2-campaigns/$(basename "$G2_CAMPAIGN_DIR")"
          mkdir -p "$(dirname "$destination")"
          cp -a "$G2_CAMPAIGN_DIR" "$destination"
          cmp "$G2_CAMPAIGN_DIR/FREEZE.json" "$destination/FREEZE.json"
          cmp "$G2_IDENTITY" "$destination/G2_IDENTITY.json"
          echo "G2_CAMPAIGN_DIR=$destination" >> "$GITHUB_ENV"
          echo "G2_IDENTITY=$destination/G2_IDENTITY.json" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" install-system-deps

      # Every C/C++ compile in this job -- support libraries, stage3 std FFI,
      # stdx and tools cmake projects, the compiler shim, the Windows cross
      # runtime -- runs through this launcher; build/toolchain/sccache.mjs keeps
      # the launcher variables it finds already set.
      - name: Start sccache
        uses: ./.github/actions/sccache
        with:
          component: srcbuild-stage0
          platform: ${{ matrix.target }}
          pin: ${{ env.CJCJ_NATIVE_RUNTIME_REF }}
          cache-size: 2G

      - name: Restore support library cache
        if: matrix.static_libs
        id: support-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CANGJIE_BUILD_ROOT }}
          key: cangjie-srcbuild-support-${{ matrix.target }}-${{ hashFiles('build/toolchain/static-libs.mjs', 'build/lib/archive.mjs', 'build/lib/runner.mjs') }}

      # Revalidate restored installs too; the normal entry repairs a partial
      # component without reusing an older snapshot or rebuilding its peer.
      - name: Build support libraries
        if: matrix.static_libs
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" install-static-libs

      - name: Save support library cache
        if: matrix.static_libs && steps.support-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CANGJIE_BUILD_ROOT }}
          key: cangjie-srcbuild-support-${{ matrix.target }}-${{ hashFiles('build/toolchain/static-libs.mjs', 'build/lib/archive.mjs', 'build/lib/runner.mjs') }}

      # --target because build/cli.mjs asserts the host contract of its target
      # before any command, and the default target is linux-x64: on the
      # ubuntu-24.04-arm cell this step failed with "target linux-x64 required
      # host linux/x64; current host linux/arm64" (release-matrix run 35717546067).
      - name: Generate SDK version
        id: version
        env:
          REQUESTED_REF: ${{ inputs.cangjie_ref }}
        run: |
          value=$(npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" --cangjie-version "$REQUESTED_REF" print-version)
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SDK_VERSION=$value" >> "$GITHUB_ENV"

      - name: Download pinned source
        run: |
          npx --yes zx@8 build/cli.mjs \
            --target "${{ matrix.target }}" \
            --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" \
            --cangjie-version "${{ steps.version.outputs.value }}" \
            fetch \
            --repo-url "compiler=$CANGJIE_COMPILER_URL" \
            --repo-tag "compiler=$CANGJIE_COMPILER_SHA" \
            --repo-url "runtime=$RUNTIME_SRC_URL" \
            --repo-tag "runtime=$CJCJ_NATIVE_RUNTIME_REF" \
            --repo-url "tools=$TOOLS_SRC_URL" \
            --repo-tag "tools=$TOOLS_REF" \
            --repo-url "stdx=$STDX_SRC_URL" \
            --repo-tag "stdx=$STDX_REF"

      - name: Verify source revisions
        run: npx --yes zx@8 ci/srcbuild/steps/verify-source-pins.mjs

      - name: Download native LLVM tuple
        if: inputs.native_runtime_artifact == ''
        uses: actions/download-artifact@v8
        with:
          name: fixed-llvm-tools-${{ matrix.llvm_platform }}
          path: ${{ env.CJCJ_FIXED_LLVM_DIR }}

      - name: Load immutable bootstrap host LLVM provenance
        if: inputs.native_runtime_artifact == ''
        shell: bash
        run: |
          set -euo pipefail
          node ci/release/host_llvm.mjs env >> "$GITHUB_ENV"
          echo "CJCJ_BOOTSTRAP_HOST_LLVM_ARTIFACT=$GITHUB_WORKSPACE/.srcbuild/inputs/bootstrap-host-llvm" >> "$GITHUB_ENV"

      - name: Download pinned bootstrap host LLVM
        if: inputs.native_runtime_artifact == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/release/download_pinned.mjs cjcj-dev/cjcj "${{ env.HOST_LLVM_ARTIFACT_ID }}" "${{ env.CJCJ_BOOTSTRAP_HOST_LLVM_ARTIFACT }}"

      - name: Load immutable in-process LLVM dylib provenance
        if: inputs.native_runtime_artifact == '' && (runner.os == 'Linux' || runner.os == 'macOS')
        shell: bash
        run: |
          set -euo pipefail
          source ci/llvm_pin.env
          source "ci/llvm-dylib/${{ matrix.llvm_platform }}.env"
          test "$LLVM_DYLIB_SOURCE_SHA" = "$CJCJ_NATIVE_LLVM_REF"
          test -n "$LLVM_DYLIB_RUN_ID"
          test -n "$LLVM_DYLIB_RUN_ATTEMPT"
          test -n "$LLVM_DYLIB_ARTIFACT_ID"
          cat "ci/llvm-dylib/${{ matrix.llvm_platform }}.env" >> "$GITHUB_ENV"
          echo "CJCJ_BOOTSTRAP_DYLIB_ARTIFACT=$GITHUB_WORKSPACE/.srcbuild/inputs/llvm-depot/$CJCJ_NATIVE_LLVM_REF/$CANGJIE_COMPILER_SHA/dylib" >> "$GITHUB_ENV"

      - name: Download pinned in-process LLVM dylib
        if: inputs.native_runtime_artifact == '' && (runner.os == 'Linux' || runner.os == 'macOS')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/release/download_pinned.mjs cjcj-dev/cjcj "${{ env.LLVM_DYLIB_ARTIFACT_ID }}" "${{ env.CJCJ_BOOTSTRAP_DYLIB_ARTIFACT }}"

      - name: Load pinned colour runtime provenance
        if: inputs.native_runtime_artifact == ''
        shell: bash
        env:
          RUNTIME_PLATFORM: ${{ matrix.llvm_platform }}
        run: |
          set -euo pipefail
          pin="ci/colour-runtime/$RUNTIME_PLATFORM.env"
          test -f "$pin" || { echo "COLOUR_RT_PLATFORM_PIN_MISSING: $RUNTIME_PLATFORM" >&2; exit 1; }
          cat "$pin" >> "$GITHUB_ENV"
          echo "CJCJ_BOOTSTRAP_COLOUR_RT=$GITHUB_WORKSPACE/.srcbuild/inputs/colour-runtime" >> "$GITHUB_ENV"

      - name: Download pinned colour runtime pair
        if: inputs.native_runtime_artifact == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/release/download_pinned.mjs cjcj-dev/cjcj "${{ env.COLOUR_RT_ARTIFACT_ID }}" "${{ env.CJCJ_BOOTSTRAP_COLOUR_RT }}"

      - name: Verify independent Darwin libraries and classify std input
        if: inputs.native_runtime_artifact == '' && (runner.os == 'macOS')
        env:
          RUNTIME_PLATFORM: ${{ matrix.llvm_platform }}
        run: node ci/release/darwin_runtime.mjs source "$CJCJ_BOOTSTRAP_COLOUR_RT" "$RUNTIME_PLATFORM"

      - name: Inspect downloaded colour runtime symbols
        if: inputs.native_runtime_artifact == '' && (runner.os != 'macOS')
        shell: bash
        run: |
          set -euo pipefail
          so="$CJCJ_BOOTSTRAP_COLOUR_RT/runtime/lib/linux_x86_64_cjnative/libcangjie-runtime.so"
          archive="$CJCJ_BOOTSTRAP_COLOUR_RT/lib/linux_x86_64_cjnative/libcangjie-runtime.a"
          sha256sum "$so" "$archive"
          nm --defined-only "$so" > "$GITHUB_WORKSPACE/.srcbuild/inputs/colour-runtime-symbols.txt"
          awk '$NF ~ /^g_cjLoadBadMask(@@?[^[:space:]]+)?$/ {print; n++} END {print "COLOUR_RT_DEFINED_MASK_COUNT=" n+0; exit n != 1}' "$GITHUB_WORKSPACE/.srcbuild/inputs/colour-runtime-symbols.txt"

      - name: Load immutable AST support provenance
        if: inputs.native_runtime_artifact == ''
        shell: bash
        env:
          AST_PLATFORM: ${{ matrix.llvm_platform }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "ci/ast_support/${AST_PLATFORM}.env"
          test -n "$AST_SUPPORT_RUN_ID"
          test -n "$AST_SUPPORT_RUN_ATTEMPT"
          test -n "$AST_SUPPORT_ARTIFACT_ID"
          cat "ci/ast_support/${AST_PLATFORM}.env" >> "$GITHUB_ENV"

      - name: Download AST support archive
        if: inputs.native_runtime_artifact == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/release/download_pinned.mjs cjcj-dev/cjcj "${{ env.AST_SUPPORT_ARTIFACT_ID }}" "${{ github.workspace }}/.srcbuild/inputs/ast-support"

      # set -a: `source` alone makes shell variables, and prepare_bootstrap_inputs
      # reads LLVM_SHA from its environment -- without the export every host
      # failed here with "LLVM_SHA pin missing" (release-matrix run 35718484244).
      - name: Resolve bootstrap inputs on this runner
        if: inputs.native_runtime_artifact == ''
        env:
          CJCJ_BOOTSTRAP_SHIM_SOURCE_SELECTION: ${{ inputs.shim_source_selection }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source ci/llvm_pin.env
          source ci/runtime_pin.env
          set +a
          CJCJ_BOOTSTRAP_INPUTS_WORK="$GITHUB_WORKSPACE/.srcbuild/inputs/bootstrap-inputs" \
          CJCJ_BOOTSTRAP_HOST_LLVM_WORK="$GITHUB_WORKSPACE/.srcbuild/inputs/host-llvm" \
          CJCJ_BOOTSTRAP_AST_ARTIFACT="$GITHUB_WORKSPACE/.srcbuild/inputs/ast-support/libcangjie-ast-support.a" \
            node ci/release/prepare_bootstrap_inputs.mjs

      - name: Verify complete official H and repaired host LLVM identities
        if: inputs.native_runtime_artifact == ''
        shell: bash
        env:
          HOST_IDENTITY_SDK: ${{ env.CJCJ_BOOTSTRAP_BASE }}
          HOST_IDENTITY_ARCHIVE: ${{ env.CJCJ_BOOTSTRAP_BASE_ARCHIVE }}
          HOST_IDENTITY_LLVM: ${{ env.CJCJ_BOOTSTRAP_HOST_LLVM_SO }}
        run: |
          : "${HOST_IDENTITY_SDK:?}" "${HOST_IDENTITY_LLVM:?}"
          node ci/bootstrap/sdk-host-inputs.integration.test.mjs

      - name: Prove colour runtime identity rejection
        if: inputs.native_runtime_artifact == ''
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source ci/llvm_pin.env
          source ci/runtime_pin.env
          set +a
          first=0
          if [ "${COLOUR_RT_MANIFEST_SHA256:0:1}" = 0 ]; then first=1; fi
          wrong="$first${COLOUR_RT_MANIFEST_SHA256:1}"
          set +e
          COLOUR_RT_MANIFEST_SHA256="$wrong" GITHUB_ENV="$RUNNER_TEMP/invalid-runtime.env" \
            node ci/release/prepare_bootstrap_inputs.mjs > "$RUNNER_TEMP/invalid-runtime.log" 2>&1
          rc=$?
          set -e
          test "$rc" = 1
          grep -F "COLOUR_RT_SHA256_MISMATCH expected=$wrong actual=$COLOUR_RT_MANIFEST_SHA256" "$RUNNER_TEMP/invalid-runtime.log"
          test ! -s "$RUNNER_TEMP/invalid-runtime.env"
          echo "ASSERT colour-runtime wrong-pin rejected rc=$rc; valid input resolved in prior step"

      - name: Reject a one-digit host pin change with the real artifact
        if: inputs.native_runtime_artifact == '' && (startsWith(matrix.target, 'linux-'))
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          original = Path('ci/bootstrap/stage1_host_identities.txt').read_text()
          platform = {'linux-x64': 'linux_x86_64', 'linux-aarch64': 'linux_aarch64'}[os.environ['CJCJ_SRCBUILD_TARGET']]
          changed, count = re.subn(r'^(' + platform + r' libLLVM-15.so )([a-f0-9])',
              lambda m: m[1] + ('1' if m[2] == '0' else '0'), original, flags=re.M)
          assert count == 1
          Path(os.environ['RUNNER_TEMP'], 'host-pin-cut.txt').write_text(changed)
          PY
          sha256sum ci/bootstrap/stage1_host_identities.txt "$RUNNER_TEMP/host-pin-cut.txt"
          if STAGE1_HOST_IDENTITIES="$RUNNER_TEMP/host-pin-cut.txt" \
              node ci/release/prepare_bootstrap_inputs.mjs > "$RUNNER_TEMP/host-pin-cut.log" 2>&1; then
            echo 'host pin change unexpectedly accepted' >&2
            exit 1
          else
            echo "HOST_PIN_CUT_RC=$?"
          fi
          grep -F 'HOST_LLVM_SHA256_MISMATCH expected=' "$RUNNER_TEMP/host-pin-cut.log"
          echo 'ASSERT real-artifact host pin one-digit rejection executed'

      - name: Reject a one-digit native host provenance change with the real artifact
        env:
          TARGET_LLVM_PLATFORM: ${{ matrix.llvm_platform }}
        # Linux cells use the scoped digest rows checked above.
        if: inputs.native_runtime_artifact == '' && startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target = os.environ['CJCJ_SRCBUILD_TARGET']
          prefix = '# HOST_LLVM_PROVENANCE '
          changed = count = 0
          lines = []
          for line in Path('ci/bootstrap/stage1_host_identities.txt').read_text().splitlines(True):
              if line.startswith(prefix):
                  pin = json.loads(line[len(prefix):])
                  if pin['platform'] == os.environ['TARGET_LLVM_PLATFORM']:
                      pin['sha256'] = ('1' if pin['sha256'][0] == '0' else '0') + pin['sha256'][1:]
                      line = prefix + json.dumps(pin) + '\n'
                      count += 1
              lines.append(line)
          assert count == 1, (target, count)
          Path(os.environ['RUNNER_TEMP'], 'host-provenance-cut.txt').write_text(''.join(lines))
          PY
          sha256sum ci/bootstrap/stage1_host_identities.txt "$RUNNER_TEMP/host-provenance-cut.txt"
          if STAGE1_HOST_IDENTITIES="$RUNNER_TEMP/host-provenance-cut.txt" \
              node ci/release/prepare_bootstrap_inputs.mjs > "$RUNNER_TEMP/host-provenance-cut.log" 2>&1; then
            echo 'host provenance change unexpectedly accepted' >&2
            exit 1
          else
            echo "HOST_PROVENANCE_CUT_RC=$?"
          fi
          grep -F 'HOST_LLVM_SHA256_MISMATCH expected=' "$RUNNER_TEMP/host-provenance-cut.log"
          echo "ASSERT real-artifact $CJCJ_SRCBUILD_TARGET provenance one-digit rejection executed"

      - name: Record host repair and nightly control symbols
        if: inputs.native_runtime_artifact == '' && (matrix.target == 'linux-x64')
        shell: bash
        run: |
          set -euo pipefail
          for arm in repaired nightly; do
            if [ "$arm" = repaired ]; then
              so="$CJCJ_BOOTSTRAP_HOST_LLVM_SO"
            else
              so="$CJCJ_BOOTSTRAP_BASE/third_party/llvm/lib/libLLVM-15.so"
            fi
            sha256sum "$so"
            nm --defined-only "$so" > "$RUNNER_TEMP/host-$arm.nm"
            c++filt < "$RUNNER_TEMP/host-$arm.nm" > "$RUNNER_TEMP/host-$arm.symbols"
            awk -v arm="$arm" 'index($0, "llvm::SelectionDAGBuilder::visitRelocate(") {print; n++} END {print "HOST_RELOCATE_SYMBOLS arm=" arm " count=" n+0}' "$RUNNER_TEMP/host-$arm.symbols"
          done
          grep -F 'llvm::SelectionDAGBuilder::visitRelocate(' "$RUNNER_TEMP/host-repaired.symbols"
          # Positive control for the producer's uncoloured-symbol assertion.
          nm --defined-only "$CJCJ_BOOTSTRAP_COLOUR_LLVM_SO" > "$RUNNER_TEMP/colour-control.nm"
          c++filt < "$RUNNER_TEMP/colour-control.nm" > "$RUNNER_TEMP/colour-control.symbols"
          awk 'index($0, "llvm::isCJTypedReadHelperCandidate(") {print; n++} END {print "HOST_COLOUR_POSITIVE_CONTROL count=" n+0}' "$RUNNER_TEMP/colour-control.symbols"

      - name: Receive complete native target installations and paired build adapter
        if: inputs.native_runtime_artifact == ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native_inputs_artifact }}-${{ matrix.target }}
          run-id: ${{ inputs.native_inputs_run_id }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/.srcbuild/native-inputs

      - name: Receive fixed native runtime installation
        if: inputs.native_runtime_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native_runtime_artifact }}-${{ matrix.llvm_platform }}
          run-id: ${{ inputs.native_runtime_run_id }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/.srcbuild/native-runtime-install

      - name: Configure native bootstrap from actual repositories and target installations
        shell: bash
        env:
          CJCJ_NATIVE_INPUT_ROOT: ${{ github.workspace }}/.srcbuild/native-inputs
          CJCJ_NATIVE_RUNTIME_INSTALL: ${{ inputs.native_runtime_artifact != '' && format('{0}/.srcbuild/native-runtime-install', github.workspace) || '' }}
          CJCJ_NATIVE_LLVM_REF: ${{ inputs.native_llvm_ref }}
          CJCJ_NATIVE_RUNTIME_REF: ${{ inputs.native_runtime_ref }}
          CJCJ_NATIVE_HOST_VERSION: ${{ inputs.native_host_version }}
        run: |
          ulimit -c 0
          node ci/bootstrap/configure-gha-inputs.mjs

      - name: Bootstrap stage0 compiler
        shell: bash
        run: bash ci/bootstrap/gha_run.sh stage0

      - name: Seal source phase handoff
        run: node ci/srcbuild/job-handoff.mjs pack stage0 "$RUNNER_TEMP/source-handoff-output"

      - name: Upload source phase handoff
        uses: actions/upload-artifact@v7
        with:
          name: source-handoff-${{ matrix.target }}-stage0
          path: ${{ runner.temp }}/source-handoff-output
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache-report
        with:
          component: srcbuild-stage0
          platform: ${{ matrix.target }}
          require-compiles: ${{ job.status == 'success' }}

  source-stage1-initial-std:
    name: ${{ matrix.target }} / source-stage1-initial-std
    needs: [plan, source-stage0]
    runs-on: ${{ matrix.runner }}
