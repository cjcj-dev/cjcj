    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      CANGJIE_WORKSPACE: ${{ github.workspace }}/.srcbuild/workspace
      CANGJIE_BUILD_ROOT: ${{ github.workspace }}/.srcbuild/buildtools
      CJCJ_SRCBUILD_TARGET: ${{ matrix.target }}
      CJCJ_FIXED_LLVM_DIR: ${{ github.workspace }}/.srcbuild/fixed-llc
      cjHeapSize: 12GB
      cjHeapSwap: "on"
      CJCJ_STAGE3_STDLIB_BUILD_TYPE: ${{ inputs.build_type || 'relwithdebinfo' }}
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/native-windows-tools
        if: runner.os == 'Windows'

      - name: Download preceding source phase
        uses: actions/download-artifact@v8
        with:
          name: source-handoff-${{ matrix.target }}-stage3
          path: ${{ runner.temp }}/source-handoff

      - name: Verify preceding source phase
        run: node ci/srcbuild/job-handoff.mjs restore stage3 "$RUNNER_TEMP/source-handoff"

      - name: Install build dependencies
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" install-system-deps

      - name: Start sccache
        uses: ./.github/actions/sccache
        with:
          component: srcbuild-package
          platform: ${{ matrix.target }}
          pin: ${{ env.CJCJ_NATIVE_RUNTIME_REF }}
          cache-size: 2G

      - name: Restore source SDK version output
        id: version
        run: echo "value=$SOURCE_SDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Add Linux swap for stage2 chir heap
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build stdx from source
        env:
          CJCJ_SRCBUILD_CONSUMER_SDK: ${{ env.CANGJIE_WORKSPACE }}/software/cangjie
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" build stdx

      - name: Build SDK tools from source
        env:
          CJCJ_SRCBUILD_CONSUMER_SDK: ${{ env.CANGJIE_WORKSPACE }}/software/cangjie
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" build tools

      - name: Prepare source-built cjpm artifact
        run: |
          node ci/release/prepare_cjpm_artifact.mjs \
            --platform "${{ matrix.target }}" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjpm/dist/cjpm" \
            --outdir "$GITHUB_WORKSPACE/.release-cjpm/${{ matrix.target }}"

      - name: Upload source-built cjpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-cjpm-${{ matrix.target }}
          path: ${{ github.workspace }}/.release-cjpm/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

      - name: Prepare source-built hle artifact
        run: |
          node ci/release/prepare_hle_artifact.mjs \
            --platform "${{ matrix.target }}" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/hyperlangExtension/target/bin/main" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie" \
            --outdir "$GITHUB_WORKSPACE/.release-hle/${{ matrix.target }}"

      - name: Upload source-built hle artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-hle-${{ matrix.target }}
          path: ${{ github.workspace }}/.release-hle/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

      # cjfmt and LSPServer are built from the same pinned checkout. They carry
      # no CJ_MCC_ entry points, because the backend is C++, so the release
      # manifest cannot discover them by structure the way it discovers the
      # Cangjie-written tools. Stage their artifacts here so the release package
      # installs the source-built bytes rather than leaving the official ones in
      # place under a manifest row that calls them inherited.
      - name: Prepare source-built cjlint artifact
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjlint --platform "${{ matrix.target }}" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjlint/dist/bin/cjlint" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie" \
            --outdir "$GITHUB_WORKSPACE/.release-tools/${{ matrix.target }}/cjlint"

      - name: Upload source-built cjlint artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-cjlint-${{ matrix.target }}
          path: ${{ github.workspace }}/.release-tools/${{ matrix.target }}/cjlint
          if-no-files-found: error
          retention-days: 7

      - name: Prepare source-built cjprof artifact
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjprof --platform "${{ matrix.target }}" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjprof/dist/bin/cjprof" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie" \
            --outdir "$GITHUB_WORKSPACE/.release-tools/${{ matrix.target }}/cjprof"

      - name: Upload source-built cjprof artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-cjprof-${{ matrix.target }}
          path: ${{ github.workspace }}/.release-tools/${{ matrix.target }}/cjprof
          if-no-files-found: error
          retention-days: 7

      - name: Prepare source-built cjcompat artifact
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjcompat --platform "${{ matrix.target }}" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjcompat/dist/bin/cjcompat" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie" \
            --outdir "$GITHUB_WORKSPACE/.release-tools/${{ matrix.target }}/cjcompat"

      - name: Upload source-built cjcompat artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-cjcompat-${{ matrix.target }}
          path: ${{ github.workspace }}/.release-tools/${{ matrix.target }}/cjcompat
          if-no-files-found: error
          retention-days: 7

      - name: Prepare source-built cjfmt artifact
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjfmt --platform "${{ matrix.target }}" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjfmt/build/build/bin/cjfmt" \
            --outdir "$GITHUB_WORKSPACE/.release-tools/${{ matrix.target }}/cjfmt"

      - name: Upload source-built cjfmt artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-cjfmt-${{ matrix.target }}
          path: ${{ github.workspace }}/.release-tools/${{ matrix.target }}/cjfmt
          if-no-files-found: error
          retention-days: 7

      - name: Prepare source-built LSPServer artifact
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool LSPServer --platform "${{ matrix.target }}" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cangjie-language-server/output/bin/LSPServer" \
            --outdir "$GITHUB_WORKSPACE/.release-tools/${{ matrix.target }}/LSPServer"

      - name: Upload source-built LSPServer artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-LSPServer-${{ matrix.target }}
          path: ${{ github.workspace }}/.release-tools/${{ matrix.target }}/LSPServer
          if-no-files-found: error
          retention-days: 7

      - name: Prepare source-built cjcov artifact
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjcov --platform "${{ matrix.target }}" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjcov/dist/cjcov" \
            --outdir "$GITHUB_WORKSPACE/.release-tools/${{ matrix.target }}/cjcov"

      - name: Upload source-built cjcov artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-cjcov-${{ matrix.target }}
          path: ${{ github.workspace }}/.release-tools/${{ matrix.target }}/cjcov
          if-no-files-found: error
          retention-days: 7

      - name: Prepare source-built cjtrace-recover artifact
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjtrace-recover --platform "${{ matrix.target }}" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjtrace-recover/dist/bin/cjtrace-recover" \
            --outdir "$GITHUB_WORKSPACE/.release-tools/${{ matrix.target }}/cjtrace-recover"

      - name: Upload source-built cjtrace-recover artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-cjtrace-recover-${{ matrix.target }}
          path: ${{ github.workspace }}/.release-tools/${{ matrix.target }}/cjtrace-recover
          if-no-files-found: error
          retention-days: 7

      # The Linux archive also ships the two public Windows FFI files. Their
      # source producer is the existing Windows final-std job, not H leftovers.
      - name: Download source-built Windows FFI outputs
        if: matrix.target == 'linux-x64'
        uses: actions/download-artifact@v8
        with:
          name: final-std-windows-x64
          path: ${{ env.CANGJIE_WORKSPACE }}/software/final-std-windows-stage2

      - name: Install source-built Windows FFI outputs
        if: matrix.target == 'linux-x64'
        run: node ci/srcbuild/steps/install-windows-ffi.mjs

      - name: Verify installed SDK
        env:
          CJCJ_SRCBUILD_CONSUMER_SDK: ${{ env.CANGJIE_WORKSPACE }}/software/cangjie
        run: |
          npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" verify

      - name: Build compiler shim
        env:
          CJCJ_SRCBUILD_CONSUMER_SDK: ${{ env.CANGJIE_WORKSPACE }}/software/cangjie
        run: npx --yes zx@8 ci/srcbuild/steps/build-shim.mjs

      - name: Upload stage diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: srcbuild-diagnosis-${{ matrix.target }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.CANGJIE_WORKSPACE }}/software/cangjie/bin/cjcj-stage1
            ${{ env.CANGJIE_WORKSPACE }}/software/cangjie/share/cjcj/cjo/**/*.cjo

      - name: Test and archive installed SDK
        env:
          SOURCE_SDK_VERSION: ${{ steps.version.outputs.value }}
        run: npx --yes zx@8 ci/srcbuild/steps/package-install.mjs

      - name: Test real SDK source-tool installation and packaging
        if: matrix.target == 'linux-x64'
        env:
          SOURCE_SDK_VERSION: ${{ steps.version.outputs.value }}
          CJCJ_SRCBUILD_TARGET: linux-x64
          CJCJ_SRCBUILD_CONSUMER_SDK: ${{ env.CANGJIE_WORKSPACE }}/software/cangjie
          RELEASE_EVIDENCE_TEST_ROOT: ${{ runner.temp }}/source-tool-sdk-integration
        run: node build/test/source-tool-install-contract.integration.test.mjs

      - name: Capture G2 SDK identity
        if: matrix.target == 'linux-x64'
        timeout-minutes: 2
        run: |
          node ci/capture-g2-identity.mjs --identity "$G2_IDENTITY" --sdk "$CANGJIE_WORKSPACE/software/cangjie"

      - name: Retain G2 campaign identity
        if: always() && matrix.target == 'linux-x64' && env.G2_IDENTITY != ''
        uses: actions/upload-artifact@v7
        with:
          name: g2-identity-linux-x64-${{ github.run_attempt }}
          path: ${{ env.G2_CAMPAIGN_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Archive final compiler handoff
        run: tar -C "$CANGJIE_WORKSPACE/software/final-compiler" -czf "$CANGJIE_WORKSPACE/software/final-compiler.tar.gz" .

      - name: Upload final compiler handoff
        uses: actions/upload-artifact@v7
        with:
          name: final-compiler-${{ matrix.target }}
          path: ${{ env.CANGJIE_WORKSPACE }}/software/final-compiler.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Verify self-hosted SDK
        run: npx --yes zx@8 ci/srcbuild/steps/verify.mjs "$CANGJIE_WORKSPACE/software/cangjie"

      - name: Upload self-hosted SDK and gate logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cjcj-srcbuild-${{ matrix.target }}-${{ steps.version.outputs.value }}
          path: |
            ${{ env.CANGJIE_WORKSPACE }}/software/cangjie-sdk-*-${{ steps.version.outputs.value }}-cjcj.*
            ${{ env.CANGJIE_WORKSPACE }}/software/cangjie-sdk-*-${{ steps.version.outputs.value }}-cjcj.*.sha256
            ${{ runner.temp }}/cjcj-srcbuild-verify/*.log
            .srcbuild/shim-build.log
          if-no-files-found: warn

      # Enforced only on a green job: a job that already failed before its first
      # compile would otherwise report a second, misleading error.
      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache-report
        with:
          component: srcbuild-package
          platform: ${{ matrix.target }}
          require-compiles: ${{ job.status == 'success' }}

  source-android:
    name: linux-x64 / source-android
    needs: [plan, source-stage3]
    if: contains(needs.plan.outputs.llvm_platforms, 'linux_x86_64') && inputs.build_android
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
            llvm_platform: linux_x86_64
            static_libs: true
    env:
      CANGJIE_WORKSPACE: ${{ github.workspace }}/.srcbuild/workspace
      CANGJIE_BUILD_ROOT: ${{ github.workspace }}/.srcbuild/buildtools
      CJCJ_SRCBUILD_TARGET: ${{ matrix.target }}
      CJCJ_FIXED_LLVM_DIR: ${{ github.workspace }}/.srcbuild/fixed-llc
      cjHeapSize: 12GB
      cjHeapSwap: "on"
      CJCJ_STAGE3_STDLIB_BUILD_TYPE: ${{ inputs.build_type || 'relwithdebinfo' }}
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/native-windows-tools
        if: runner.os == 'Windows'

      - name: Download preceding source phase
        uses: actions/download-artifact@v8
        with:
          name: source-handoff-${{ matrix.target }}-stage3
          path: ${{ runner.temp }}/source-handoff

      - name: Verify preceding source phase
        run: node ci/srcbuild/job-handoff.mjs restore stage3 "$RUNNER_TEMP/source-handoff"

      - name: Install build dependencies
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" install-system-deps

      - name: Start sccache
        uses: ./.github/actions/sccache
        with:
          component: srcbuild-android
          platform: ${{ matrix.target }}
          pin: ${{ env.CJCJ_NATIVE_RUNTIME_REF }}
          cache-size: 2G

      - name: Restore source SDK version output
        id: version
        run: echo "value=$SOURCE_SDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Add Linux swap for stage2 chir heap
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install Android NDK and probe
        if: matrix.target == 'linux-x64' && inputs.build_android
        uses: ./.github/actions/setup-release-sdk
        with:
          requirement: android-ndk

      - name: Build Android runtime and final std with stage2 cjc
        if: matrix.target == 'linux-x64' && inputs.build_android
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/ci/platform_matrix/native_runtime_toolchain.cmake
          CJCJ_STAGE3_CANGJIE_VERSION: ${{ steps.version.outputs.value }}
          CJCJ_BOOTSTRAP_WORK: ${{ env.CANGJIE_WORKSPACE }}/native-bootstrap
        run: npx --yes zx@8 ci/srcbuild/steps/build-android-final-std.mjs

      - name: Upload Android runtime and final std
        if: matrix.target == 'linux-x64' && inputs.build_android
        uses: actions/upload-artifact@v7
        with:
          name: final-std-android-aarch64
          path: ${{ env.CANGJIE_WORKSPACE }}/software/final-std-android-aarch64
          if-no-files-found: error
          retention-days: 7

      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache-report
        with:
          component: srcbuild-android
          platform: ${{ matrix.target }}
          require-compiles: ${{ job.status == 'success' }}

