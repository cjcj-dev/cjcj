        with:
          path: ${{ env.CANGJIE_BUILD_ROOT }}/llvm-mingw-w64
          key: windows-final-std-mingw-20220906-5c68a1cb123161b54b72ce90e7975d95a8eaf2a4-${{ hashFiles('build/toolchain/mingw.mjs', 'build/lib/archive.mjs', 'build/lib/runner.mjs') }}

      - name: Install Windows cross toolchain dependencies
        if: matrix.target == 'linux-x64' && steps.windows-mingw-cache.outputs.cache-hit != 'true'
        run: npx --yes zx@8 build/cli.mjs --target windows-x64 --build-root "$CANGJIE_BUILD_ROOT" install-system-deps

      - name: Build official MinGW toolchain
        if: matrix.target == 'linux-x64' && steps.windows-mingw-cache.outputs.cache-hit != 'true'
        run: npx --yes zx@8 build/cli.mjs --target windows-x64 --build-root "$CANGJIE_BUILD_ROOT" install-mingw

      - name: Save official MinGW toolchain
        if: matrix.target == 'linux-x64' && steps.windows-mingw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CANGJIE_BUILD_ROOT }}/llvm-mingw-w64
          key: ${{ steps.windows-mingw-cache.outputs.cache-primary-key }}

      - name: Seal source phase handoff
        run: node ci/srcbuild/job-handoff.mjs pack mingw "$RUNNER_TEMP/source-handoff-output"

      - name: Upload source phase handoff
        uses: actions/upload-artifact@v7
        with:
          name: source-handoff-${{ matrix.target }}-mingw
          path: ${{ runner.temp }}/source-handoff-output
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache-report
        with:
          component: srcbuild-mingw
          platform: ${{ matrix.target }}
          require-compiles: ${{ job.status == 'success' && steps.windows-mingw-cache.outputs.cache-hit != 'true' }}

  source-windows:
    name: linux-x64 / source-windows
    needs: [plan, source-stage3, source-mingw]
    if: contains(needs.plan.outputs.llvm_platforms, 'linux_x86_64')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
            llvm_platform: linux_x86_64
            static_libs: true
    env:
      CANGJIE_WORKSPACE: ${{ github.workspace }}/.srcbuild/workspace
      CANGJIE_BUILD_ROOT: ${{ github.workspace }}/.srcbuild/buildtools
      CJCJ_SRCBUILD_TARGET: ${{ matrix.target }}
      CJCJ_FIXED_LLVM_DIR: ${{ github.workspace }}/.srcbuild/fixed-llc
      cjHeapSize: 12GB
      cjHeapSwap: "on"
      CJCJ_STAGE3_STDLIB_BUILD_TYPE: ${{ inputs.build_type || 'relwithdebinfo' }}
    steps:
      - name: Checkout cjcj
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/native-windows-tools
        if: runner.os == 'Windows'

      - name: Download native stage3 handoff
        uses: actions/download-artifact@v8
        with:
          name: source-handoff-${{ matrix.target }}-stage3
          path: ${{ runner.temp }}/source-handoff

      - name: Verify native stage3 handoff
        run: node ci/srcbuild/job-handoff.mjs restore stage3 "$RUNNER_TEMP/source-handoff"

      - name: Download MinGW handoff
        uses: actions/download-artifact@v8
        with:
          name: source-handoff-${{ matrix.target }}-mingw
          path: ${{ runner.temp }}/mingw-handoff

      - name: Verify MinGW handoff
        run: node ci/srcbuild/job-handoff.mjs restore mingw "$RUNNER_TEMP/mingw-handoff"

      - name: Install build dependencies
        run: npx --yes zx@8 build/cli.mjs --target "${{ matrix.target }}" install-system-deps

      - name: Start sccache
        uses: ./.github/actions/sccache
        with:
          component: srcbuild-windows
          platform: ${{ matrix.target }}
          pin: ${{ env.CJCJ_NATIVE_RUNTIME_REF }}
          cache-size: 2G

      - name: Restore source SDK version output
        id: version
        run: echo "value=$SOURCE_SDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Add Linux swap for stage2 chir heap
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Cross-build Windows final std with stage2 host compiler
        if: matrix.target == 'linux-x64'
        env:
          CJCJ_STAGE3_CANGJIE_VERSION: ${{ steps.version.outputs.value }}
          CJCJ_BOOTSTRAP_WORK: ${{ env.CANGJIE_WORKSPACE }}/native-bootstrap
        run: npx --yes zx@8 ci/srcbuild/steps/build-windows-final-std.mjs

      # Nine fixed-source target outputs use the Windows SDK dependency closure.
      - name: Cross-build Windows SDK tools from source
        if: matrix.target == 'linux-x64'
        env:
          CJCJ_SRCBUILD_CONSUMER_SDK: ${{ env.CANGJIE_WORKSPACE }}/software/cangjie-windows
        run: npx --yes zx@8 build/cli.mjs --target windows-x64 --build-type "${{ inputs.build_type || 'relwithdebinfo' }}" --cangjie-version "${{ steps.version.outputs.value }}" build tools

      - name: Prepare cross-built Windows cjlint artifact
        if: matrix.target == 'linux-x64'
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjlint --platform "windows-x64" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjlint/dist/bin/cjlint.exe" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie-windows" \
            --outdir "$GITHUB_WORKSPACE/.release-tools-windows/cjlint"

      - name: Upload cross-built Windows cjlint artifact
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: source-cjlint-windows-x64
          path: ${{ github.workspace }}/.release-tools-windows/cjlint
          if-no-files-found: error
          retention-days: 7

      - name: Prepare cross-built Windows cjprof artifact
        if: matrix.target == 'linux-x64'
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjprof --platform "windows-x64" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjprof/dist/bin/cjprof.exe" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie-windows" \
            --outdir "$GITHUB_WORKSPACE/.release-tools-windows/cjprof"

      - name: Upload cross-built Windows cjprof artifact
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: source-cjprof-windows-x64
          path: ${{ github.workspace }}/.release-tools-windows/cjprof
          if-no-files-found: error
          retention-days: 7

      - name: Prepare cross-built Windows cjcompat artifact
        if: matrix.target == 'linux-x64'
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjcompat --platform "windows-x64" \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjcompat/dist/bin/cjcompat.exe" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie-windows" \
            --outdir "$GITHUB_WORKSPACE/.release-tools-windows/cjcompat"

      - name: Upload cross-built Windows cjcompat artifact
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: source-cjcompat-windows-x64
          path: ${{ github.workspace }}/.release-tools-windows/cjcompat
          if-no-files-found: error
          retention-days: 7

      - name: Prepare cross-built Windows cjfmt artifact
        if: matrix.target == 'linux-x64'
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjfmt --platform windows-x64 \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjfmt/build/build/bin/cjfmt.exe" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie-windows" \
            --outdir "$GITHUB_WORKSPACE/.release-tools-windows/cjfmt"

      - name: Upload cross-built Windows cjfmt artifact
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: source-cjfmt-windows-x64
          path: ${{ github.workspace }}/.release-tools-windows/cjfmt
          if-no-files-found: error
          retention-days: 7

      - name: Prepare cross-built Windows LSPServer artifact
        if: matrix.target == 'linux-x64'
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool LSPServer --platform windows-x64 \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cangjie-language-server/output/bin/LSPServer.exe" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie-windows" \
            --outdir "$GITHUB_WORKSPACE/.release-tools-windows/LSPServer"

      - name: Upload cross-built Windows LSPServer artifact
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: source-LSPServer-windows-x64
          path: ${{ github.workspace }}/.release-tools-windows/LSPServer
          if-no-files-found: error
          retention-days: 7

      - name: Prepare cross-built Windows cjcov artifact
        if: matrix.target == 'linux-x64'
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjcov --platform windows-x64 \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjcov/dist/cjcov.exe" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie-windows" \
            --outdir "$GITHUB_WORKSPACE/.release-tools-windows/cjcov"

      - name: Upload cross-built Windows cjcov artifact
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: source-cjcov-windows-x64
          path: ${{ github.workspace }}/.release-tools-windows/cjcov
          if-no-files-found: error
          retention-days: 7

      - name: Prepare cross-built Windows cjtrace-recover artifact
        if: matrix.target == 'linux-x64'
        run: |
          node ci/release/prepare_tools_artifact.mjs \
            --tool cjtrace-recover --platform windows-x64 \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/cjtrace-recover/dist/bin/cjtrace-recover.exe" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie-windows" \
            --outdir "$GITHUB_WORKSPACE/.release-tools-windows/cjtrace-recover"

      - name: Upload cross-built Windows cjtrace-recover artifact
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: source-cjtrace-recover-windows-x64
          path: ${{ github.workspace }}/.release-tools-windows/cjtrace-recover
          if-no-files-found: error
          retention-days: 7

      - name: Prepare cross-built Windows hle artifact
        if: matrix.target == 'linux-x64'
        run: |
          node ci/release/prepare_hle_artifact.mjs \
            --platform windows-x64 \
            --binary "$CANGJIE_WORKSPACE/cangjie_tools/hyperlangExtension/target/bin/main.exe" \
            --sdk "$CANGJIE_WORKSPACE/software/cangjie-windows" \
            --outdir "$GITHUB_WORKSPACE/.release-hle-windows"

      - name: Upload cross-built Windows hle artifact
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: source-hle-windows-x64
          path: ${{ github.workspace }}/.release-hle-windows
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows source-built std install root
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: final-std-windows-x64
          path: ${{ env.CANGJIE_WORKSPACE }}/software/final-std-windows-stage2
          if-no-files-found: error
          retention-days: 7

      - name: Report sccache
        if: always()
        uses: ./.github/actions/sccache-report
        with:
          component: srcbuild-windows
          platform: ${{ matrix.target }}
          require-compiles: ${{ job.status == 'success' }}
