  srcbuild:
    name: ${{ matrix.target }} / srcbuild
    # The Linux archive ships the two public Windows FFI files. Their producer is
    # the Windows final-std job, so the package job consumes that artifact
    # instead of retaining H leftovers. Splitting the std producer out of this
    # job is why it is a predecessor again rather than an optional copy.
    needs: [plan, source-stage3, source-windows]
    if: always() && needs.plan.result == 'success' && needs.source-stage3.result == 'success' && (needs.source-windows.result == 'success' || needs.source-windows.result == 'skipped')
