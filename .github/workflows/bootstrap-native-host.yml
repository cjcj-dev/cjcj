name: Bootstrap native host consumers
on:
  workflow_dispatch:
    inputs:
      sdk_only:
        description: Correct SDK consumers after a carrier change; do not repeat route arms
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  route:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            tuple: darwin_aarch64_cjnative
            mode: sdk
          - runner: macos-15-intel
            tuple: darwin_x86_64_cjnative
            mode: sdk
          - runner: ubuntu-24.04-arm
            tuple: linux_aarch64_cjnative
            mode: route
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute bounded native consumer recipes
        if: ${{ !inputs.sdk_only || matrix.mode == 'sdk' }}
        run: |
          ulimit -c 0
          if [ '${{ matrix.mode }}' = route ]; then
            npx --yes zx@8 ci/bootstrap/test_host_route.mjs "$RUNNER_TEMP/native-consumers" a65c82b648b32f9f3fcbeaf9cb84825852129af3 '${{ matrix.tuple }}'
          else
            node ci/bootstrap/test_native_sdk_chain.mjs "$RUNNER_TEMP/native-consumers"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (!inputs.sdk_only || matrix.mode == 'sdk') }}
        with:
          name: native-consumers-${{ matrix.tuple }}
          path: ${{ runner.temp }}/native-consumers
          if-no-files-found: error
