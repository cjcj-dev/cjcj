name: Bootstrap native host routing

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap-native-host.yml
      - ci/bootstrap/gha_run.sh
      - ci/bootstrap/bootstrap.sh
      - ci/bootstrap/test_native_host.sh
      - ci/bootstrap/test_native_host_controls.py
      - ci/bootstrap/test_native_runner_controls.py
      - ci/bootstrap/test_native_link_controls.py
      - ci/bootstrap/test_native_build_env_controls.py
      - ci/bootstrap/test_native_std_env_controls.py
      - ci/bootstrap/prepare_native_link.mjs
      - ci/bootstrap/host_tools.sh
      - ci/bootstrap/host_nm.py
      - ci/bootstrap/sdk_build.sh
      - ci/bootstrap/sdk_verify.py
      - ci/bootstrap/std_runtime_colour.py
      - ci/bootstrap/test_native_sdk.py
      - ci/bootstrap/test_native_sdk_controls.py
      - ci/release/prepare_bootstrap_inputs.mjs
      - ci/release/test_darwin_input_controls.py
      - ci/release/darwin_std.mjs
      - ci/release/test_darwin_std.py
      - ci/release/test_darwin_std_controls.py

permissions:
  contents: read

concurrency:
  group: bootstrap-native-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-host:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            tuple: darwin_aarch64_cjnative
          - runner: macos-15-intel
            tuple: darwin_x86_64_cjnative
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install bootstrap file utilities
        run: |
          # Match system-deps.mjs: install Python dependencies without replacing runner shims.
          brew deps --formula --1 llvm@16 | while IFS= read -r formula; do
            case "$formula" in python@*) brew install --skip-link "$formula" ;; esac
          done
          brew install coreutils findutils gnu-tar llvm@16
      - name: Assert native host admission through the GHA entry
        shell: bash
        run: python3 ci/bootstrap/test_native_host_controls.py "$RUNNER_TEMP/native-host-evidence" 9d390634fd915de7680a5aab5cd06e6e9135457b
      - name: Check native in-place optimization rewrite
        run: bash ci/bootstrap/test_bootstrap.sh positive-compile-option-o1
      - name: Assert native SDK installation and std pairing
        shell: bash
        run: python3 ci/bootstrap/test_native_sdk_controls.py "$RUNNER_TEMP/native-host-evidence/sdk"
      - name: Assert explicit Darwin colour input at the real Node entry
        if: always()
        shell: bash
        run: python3 ci/release/test_darwin_input_controls.py "$RUNNER_TEMP/native-host-evidence/inputs" 9d390634fd915de7680a5aab5cd06e6e9135457b
      - name: Assert native std producer and consumer identities
        if: always()
        run: python3 ci/release/test_darwin_std_controls.py "$RUNNER_TEMP/native-host-evidence/std"
      - name: Observe native compiler and backend runner bindings
        if: always()
        run: python3 ci/bootstrap/test_native_runner_controls.py "$RUNNER_TEMP/native-host-evidence/runner"
      - name: Observe native link recipe producer and consumer
        if: always()
        run: python3 ci/bootstrap/test_native_link_controls.py "$RUNNER_TEMP/native-host-evidence/link"
      - name: Observe native SDKROOT through the isolated build command
        if: always()
        run: python3 ci/bootstrap/test_native_build_env_controls.py "$RUNNER_TEMP/native-host-evidence/build-env"
      - name: Load the std parser source pin
        if: always()
        run: cat ci/runtime_pin.env >> "$GITHUB_ENV"
      - name: Check out the actual pinned std parser
        if: always()
        uses: actions/checkout@v7
        with:
          repository: cjcj-dev/cangjie-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: .native-stdlib-source
      - name: Observe native std archive tools and SDKROOT at the isolated command
        if: always()
        run: python3 ci/bootstrap/test_native_std_env_controls.py "$RUNNER_TEMP/native-host-evidence/std-env" .native-stdlib-source/stdlib/build.py
      - name: Preserve entry output and product identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-native-host-${{ matrix.tuple }}
          path: ${{ runner.temp }}/native-host-evidence
          if-no-files-found: error
