name: Native Windows source dependencies
description: Provision normal Windows CMake dependencies used by every source stage
inputs:
  native-compiler:
    description: Install the fixed MSVCRT Clang used by the native N producer
    default: 'false'
runs:
  using: composite
  steps:
    # Import the x64 MSVC developer environment without a JavaScript action:
    # vswhere selects the newest installation that has the x64 VC tools, and the
    # variables VsDevCmd.bat adds or changes are exported for every later step
    # (PATH additions through GITHUB_PATH, everything else through GITHUB_ENV).
    - name: Import the x64 MSVC developer environment
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Set-StrictMode -Version Latest
        $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
        if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw "MSVC_DEV_ENV vswhere.exe is missing: $vswhere" }
        $found = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
        if ($LASTEXITCODE -ne 0) { throw "MSVC_DEV_ENV vswhere.exe exited $LASTEXITCODE" }
        $vsPath = ($found | Where-Object { "$_".Trim() } | Select-Object -First 1)
        if (-not $vsPath) { throw 'MSVC_DEV_ENV no Visual Studio installation provides Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
        $vsPath = "$vsPath".Trim()
        $devCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
        if (-not (Test-Path -LiteralPath $devCmd -PathType Leaf)) { throw "MSVC_DEV_ENV VsDevCmd.bat is missing: $devCmd" }
        $before = @{}
        foreach ($item in Get-ChildItem env:) { $before[$item.Name] = $item.Value }
        $lines = @(& cmd.exe /d /s /c "`"$devCmd`" -arch=amd64 -host_arch=amd64 >nul && set")
        if ($LASTEXITCODE -ne 0) { throw "MSVC_DEV_ENV VsDevCmd.bat -arch=amd64 -host_arch=amd64 exited $LASTEXITCODE" }
        $after = @{}
        foreach ($line in $lines) {
          $eq = "$line".IndexOf('=')
          if ($eq -gt 0) { $after["$line".Substring(0, $eq)] = "$line".Substring($eq + 1) }
        }
        if (-not $after.ContainsKey('Path')) { throw 'MSVC_DEV_ENV VsDevCmd.bat produced no PATH' }
        $oldPath = @("$($before['Path'])".Split(';') | Where-Object { $_ })
        $added = @($after['Path'].Split(';') | Where-Object { $_ -and ($oldPath -notcontains $_) } | Select-Object -Unique)
        if (-not ($added | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'cl.exe') -PathType Leaf })) {
          throw 'MSVC_DEV_ENV VsDevCmd.bat did not add an x64 cl.exe directory to PATH'
        }
        # GITHUB_PATH prepends each line, so write in reverse to keep VsDevCmd's order.
        [array]::Reverse($added)
        $added | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8NoBOM
        $exported = 0
        foreach ($name in ($after.Keys | Sort-Object)) {
          if ($name -eq 'Path') { continue }
          $value = $after[$name]
          if ($before.ContainsKey($name) -and $before[$name] -ceq $value) { continue }
          if ("$name$value" -match '[\r\n]') { throw "MSVC_DEV_ENV multi-line variable $name" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8NoBOM
          $exported++
        }
        Write-Host "MSVC_DEV_ENV vs=$vsPath path_added=$($added.Count) variables_exported=$exported"
    - uses: msys2/setup-msys2@v2.34.0
      id: msys2
      with:
        msystem: MINGW64
        # MINGW64 is intentional: the source stages build against the MSVCRT ABI.
        suppress-deprecation-warnings: msystem-mingw64
        update: true
        path-type: inherit
        # clang 23.1.5 depends on neither compiler-rt nor libc++/libunwind, while
        # the runtime CMakeLists.txt that build.py configures builds with
        # --rtlib=compiler-rt -stdlib=libc++ and windows_runtime_toolchain.cmake
        # selects LLD (run 45385716455: ld.lld could not open
        # libclang_rt.builtins.a). llvm already pulls llvm-tools and lld; they
        # stay named because readobj/ld.lld are checked below.
        # No MSYS2 git: actions/checkout clones every tree with Git for Windows
        # (core.autocrlf=true); /usr/bin/git (autocrlf=false) is first on
        # GITHUB_PATH and reports that checkout dirty, which made
        # GenerateRuntimeProvenance stamp the runtime <sha>-dirty (run 45401980497).
        install: >-
          tar patch make file gzip unzip
          mingw-w64-x86_64-clang mingw-w64-x86_64-gcc
          mingw-w64-x86_64-ninja mingw-w64-x86_64-llvm mingw-w64-x86_64-openssl
          mingw-w64-x86_64-binutils mingw-w64-x86_64-compiler-rt
          mingw-w64-x86_64-libc++ mingw-w64-x86_64-libunwind
          mingw-w64-x86_64-lld mingw-w64-x86_64-llvm-tools
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.11'
    - name: Install supported CMake and expose the actual MinGW tools
      shell: msys2 {0}
      run: |
        python -m pip install 'cmake>=3.17,<4'
        test -x /mingw64/bin/llvm-readobj.exe
        test -x /mingw64/bin/ld.lld.exe
        test -x /mingw64/bin/clang++.exe
        test -f /mingw64/lib/libc++.a
        test -f /mingw64/lib/libunwind.a
        # The exact archive clang links for --rtlib=compiler-rt (MSYS2 ships the
        # lib/windows layout; clang names the per-target path only when absent).
        builtins="$(/mingw64/bin/clang.exe --target=x86_64-w64-mingw32 --rtlib=compiler-rt -print-libgcc-file-name)"
        test -f "$(cygpath -u "$builtins")" || { echo "MINGW64_COMPILER_RT_MISSING $builtins" >&2; exit 1; }
        test -d /mingw64/lib
        # Git for Windows wrote every checkout; an MSYS2 git pulled in by any package
        # would shadow it on GITHUB_PATH and mark the runtime <sha>-dirty (run 45401980497).
        test ! -e /usr/bin/git.exe || { echo "MSYS2_GIT_SHADOWS_GIT_FOR_WINDOWS /usr/bin/git.exe" >&2; exit 1; }
        case "$(git --version)" in *.windows.*) ;; *) echo "GIT_NOT_GIT_FOR_WINDOWS $(command -v git) $(git --version)" >&2; exit 1;; esac
        # setup-msys2 installs under RUNNER_TEMP, not C:\msys64: name the actual
        # MSYS2 bash for producers that enter MSYS2 (build_runtime/build_cjcj).
        test -x /usr/bin/bash.exe
        echo "MSYS2_BASH=$(cygpath -w /usr/bin/bash.exe)" >> "$GITHUB_ENV"
        echo "CJCJ_NATIVE_LLVM_BIN=$(cygpath -w /mingw64/bin)" >> "$GITHUB_ENV"
        echo "CJCJ_NATIVE_OPENSSL_LIB=$(cygpath -w /mingw64/lib)" >> "$GITHUB_ENV"
        cygpath -w /mingw64/bin >> "$GITHUB_PATH"
        cygpath -w /usr/bin >> "$GITHUB_PATH"
    - name: Install fixed native MSVCRT compiler and runtimes
      if: inputs.native-compiler == 'true'
      shell: bash
      run: node ci/bootstrap/install-windows-toolchain.mjs "$RUNNER_TEMP/native-msvcrt-toolchain"
