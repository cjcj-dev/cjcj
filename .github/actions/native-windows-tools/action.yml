name: Native Windows source dependencies
description: Provision normal Windows CMake dependencies used by every source stage
inputs:
  native-compiler:
    description: Install the fixed MSVCRT Clang used by the native N producer
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      with:
        arch: x64
    - uses: msys2/setup-msys2@v2
      id: msys2
      with:
        msystem: MINGW64
        update: true
        path-type: inherit
        install: >-
          git tar patch make
          mingw-w64-x86_64-clang mingw-w64-x86_64-gcc
          mingw-w64-x86_64-ninja
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.11'
    - name: Install supported CMake and expose the actual MinGW tools
      shell: msys2 {0}
      run: |
        python -m pip install 'cmake>=3.17,<4'
        cygpath -w /mingw64/bin >> "$GITHUB_PATH"
        cygpath -w /usr/bin >> "$GITHUB_PATH"
    - name: Install fixed native MSVCRT compiler and runtimes
      if: inputs.native-compiler == 'true'
      shell: bash
      run: node ci/bootstrap/install-windows-toolchain.mjs "$RUNNER_TEMP/native-msvcrt-toolchain"
