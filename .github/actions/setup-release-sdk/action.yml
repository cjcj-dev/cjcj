name: Install release target SDK
description: Install a target SDK and run the shared capability probe; does not assert package readiness.
inputs:
  requirement:
    description: RELEASE_REQUIREMENTS key
    required: true
runs:
  using: composite
  steps:
    - name: Install target SDK
      shell: bash
      env:
        SDK_REQUIREMENT: ${{ inputs.requirement }}
      run: python3 ci/release/install-runner-sdk.py "$SDK_REQUIREMENT" --root "$RUNNER_TEMP/release-sdk-$SDK_REQUIREMENT"
    - name: Probe installed target SDK
      shell: bash
      env:
        SDK_REQUIREMENT: ${{ inputs.requirement }}
      run: node ci/release/platform-matrix.mjs probe --requirement "$SDK_REQUIREMENT" --summary "$GITHUB_STEP_SUMMARY"
