# Start sccache for one C++ component of one job (cjcj#73 invariant 3).
#
# Backend: sccache's local disk cache, persisted as ONE actions/cache entry per
# (component, platform, pin). sccache's own GitHub Actions backend writes one
# cache entry per object file; sdk-build-target.yml records the measurement that made it
# unusable here (27840 entries, 6.9 GB of the 10 GB cap, 3% hits, 4162 s of
# writes). A single tarball per component keeps the entry count in the tens,
# binds the key to the pin so a pin bump still restores the previous pin's
# objects through restore-keys, and lets LLVM carry its own key.
#
# The primary key ends in run id and attempt, so every run that compiled
# something saves a fresh entry and the newest prefix match is what the next run
# restores. Entries the prefix no longer matches are evicted by GitHub's LRU.
name: sccache
description: >-
  mode start (default) installs sccache, restores this component's disk cache and
  exports the CMake compiler launcher; mode report prints the statistics, records
  the hit rate in the job summary and saves the disk cache.
inputs:
  mode:
    description: start (open the session) or report (close it out at the end of the job).
    required: false
    default: start
  component:
    description: What is being compiled (llvm, llvm-tuple, runtime, windows-runtime, srcbuild). Names the cache and the report.
    required: true
  platform:
    description: LLVM platform or target key the objects are for; part of the cache key.
    required: true
  pin:
    description: Start mode. Pin string the objects depend on (LLVM_SHA, RUNTIME_REF, ...); part of the cache key.
    required: false
    default: ''
  cache-size:
    description: SCCACHE_CACHE_SIZE for this component's disk cache.
    required: false
    default: 2G
  sccache-version:
    description: sccache release tag to install.
    required: false
    default: v0.18.0
  require-compiles:
    description: >-
      Report mode. Fail when sccache saw zero compile requests. Pass 'true' whenever the C++
      build actually ran in this job; a whole-artifact cache hit that skipped the
      build passes 'false'.
    required: false
    default: 'true'
  save:
    description: Report mode. Persist the disk cache when it changed. Pass 'false' to only report.
    required: false
    default: 'true'
outputs:
  restored-key:
    description: The actions/cache key that was restored, empty on a cold cache.
    value: ${{ steps.restore.outputs.cache-matched-key }}
  primary-key:
    description: The key this run's cache will be saved under.
    value: ${{ steps.restore.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Install sccache
      if: inputs.mode != 'report'
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: ${{ inputs.sccache-version }}
        disable_annotations: 'true'

    - name: Configure sccache disk cache and CMake launcher
      if: inputs.mode != 'report'
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        PLATFORM: ${{ inputs.platform }}
        PIN: ${{ inputs.pin }}
        CACHE_SIZE: ${{ inputs.cache-size }}
      run: |
        set -euo pipefail
        test -n "$SCCACHE_PATH"
        case "$COMPONENT$PLATFORM$PIN" in *[!A-Za-z0-9_.-]*) echo "::error::sccache component/platform/pin must be [A-Za-z0-9_.-]: '$COMPONENT' '$PLATFORM' '$PIN'"; exit 1;; esac
        # sccache-action exports <dir>\x64/sccache on Windows, but the file is
        # sccache.exe: Node's fs rejects that name (NATIVE_RUNTIME_SCCACHE_MISSING)
        # while bash `test -f` accepts it through MSYS's .exe lookup. Resolve it with
        # Node, which every caller has before this step (report mode runs node too),
        # and re-export the one existing executable for every later step.
        if ! resolved="$(node -e 'const p=process.env.SCCACHE_PATH; const file=[p,p+".exe"].find(f=>require("fs").statSync(f,{throwIfNoEntry:false})?.isFile()); if (!file) process.exit(1); console.log(file)')"; then
          echo "::error::SCCACHE_PATH_MISSING: sccache-action exported SCCACHE_PATH=$SCCACHE_PATH, and neither it nor $SCCACHE_PATH.exe is a file"
          exit 1
        fi
        SCCACHE_PATH="$resolved"
        echo "sccache: SCCACHE_PATH=$SCCACHE_PATH"
        dir="$RUNNER_TEMP/sccache-$COMPONENT"
        mkdir -p "$dir"
        {
          echo "SCCACHE_DIR=$dir"
          echo "SCCACHE_CACHE_SIZE=$CACHE_SIZE"
          echo "SCCACHE_IDLE_TIMEOUT=0"
          echo "SCCACHE_GHA_ENABLED=false"
          echo "SCCACHE_LOG=warn"
          echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-$COMPONENT-error.log"
          echo "SCCACHE_PATH=$SCCACHE_PATH"
          echo "CMAKE_C_COMPILER_LAUNCHER=$SCCACHE_PATH"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=$SCCACHE_PATH"
        } >> "$GITHUB_ENV"

    - name: Restore sccache disk cache
      if: inputs.mode != 'report'
      id: restore
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ runner.temp }}/sccache-${{ inputs.component }}
        key: sccache-${{ inputs.component }}-${{ inputs.platform }}-${{ inputs.pin }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          sccache-${{ inputs.component }}-${{ inputs.platform }}-${{ inputs.pin }}-
          sccache-${{ inputs.component }}-${{ inputs.platform }}-

    - name: Start sccache server on the restored cache
      if: inputs.mode != 'report'
      shell: bash
      env:
        RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
      run: |
        set -euo pipefail
        {
          echo "SCCACHE_RESTORED_KEY=$RESTORED_KEY"
          echo "CJCJ_SCCACHE_KEY=$PRIMARY_KEY"
        } >> "$GITHUB_ENV"
        "$SCCACHE_PATH" --stop-server >/dev/null 2>&1 || true
        "$SCCACHE_PATH" --start-server
        "$SCCACHE_PATH" --zero-stats >/dev/null
        if [ -n "$RESTORED_KEY" ]; then
          echo "sccache: warm start, restored $RESTORED_KEY"
        else
          echo "sccache: cold start, no entry matched sccache-${{ inputs.component }}-${{ inputs.platform }}-"
        fi
        "$SCCACHE_PATH" --show-stats | grep -E '^(Cache location|Cache size|Max cache size|Version)'

    # ---- mode: report ----
    # Close out the session start mode opened: print the
    # statistics, write the hit rate into the step summary, fail the job when a
    # C++ build never reached the launcher, and persist the disk cache.
    - name: sccache statistics
      if: inputs.mode == 'report'
      id: stats
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        PLATFORM: ${{ inputs.platform }}
        REQUIRE_COMPILES: ${{ inputs.require-compiles }}
      run: |
        set -euo pipefail
        # No SCCACHE_PATH means start mode never completed. On a job that
        # is otherwise green that is the failure this action exists to catch; on
        # one that already failed (the start step itself died, e.g. the sccache
        # download returning HTTP 500) it would only add a second, misleading
        # error, so say it as a warning and leave the original failure alone.
        if [ -z "${SCCACHE_PATH:-}" ]; then
          if [ "$REQUIRE_COMPILES" = true ]; then
            echo "::error::SCCACHE_PATH is unset: .github/actions/sccache (start mode) did not run in this job"
            exit 1
          fi
          echo "::warning::SCCACHE_PATH is unset: .github/actions/sccache (start mode) did not complete; no sccache statistics for this job"
          exit 0
        fi
        stats="$RUNNER_TEMP/sccache-$COMPONENT-stats.json"
        "$SCCACHE_PATH" --show-stats
        "$SCCACHE_PATH" --show-stats --stats-format=json > "$stats"
        node -e '
          const fs = require("node:fs");
          const stats = JSON.parse(fs.readFileSync(process.argv[1])).stats;
          const count = bucket => Object.values(bucket?.counts ?? {}).reduce((a,b) => a+b, 0);
          const hits = count(stats.cache_hits), misses = count(stats.cache_misses);
          if (!Number.isInteger(stats.compile_requests)) throw Error("invalid sccache statistics");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "sccache: "+hits+" hits, "+misses+" misses\n");
          if (process.env.REQUIRE_COMPILES === "true" && (!stats.compile_requests || !(hits+misses)))
            throw Error("no cacheable compile requests");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "save="+(stats.compile_requests > 0)+"\n");
        ' "$stats"
        "$SCCACHE_PATH" --stop-server >/dev/null 2>&1 || true

    # always(): a composite action stops at the first failing step, so without
    # this the one case the statistics matter most -- the zero-compile check
    # turning the job red -- would take its own stats.json and error log with it.
    - name: Upload sccache diagnostics
      if: always() && inputs.mode == 'report'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: sccache-${{ inputs.component }}-${{ inputs.platform }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/sccache-${{ inputs.component }}-stats.json
          ${{ runner.temp }}/sccache-${{ inputs.component }}-error.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Save sccache disk cache
      if: inputs.mode == 'report' && inputs.save == 'true' && steps.stats.outputs.save == 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ runner.temp }}/sccache-${{ inputs.component }}
        key: ${{ env.CJCJ_SCCACHE_KEY }}
