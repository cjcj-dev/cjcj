# Start sccache for one C++ component of one job (cjcj#73 invariant 3).
#
# Backend: sccache's local disk cache, persisted as ONE actions/cache entry per
# (component, platform, pin). sccache's own GitHub Actions backend writes one
# cache entry per object file; srcbuild.yml records the measurement that made it
# unusable here (27840 entries, 6.9 GB of the 10 GB cap, 3% hits, 4162 s of
# writes). A single tarball per component keeps the entry count in the tens,
# binds the key to the pin so a pin bump still restores the previous pin's
# objects through restore-keys, and lets LLVM carry its own key.
#
# The primary key ends in run id and attempt, so every run that compiled
# something saves a fresh entry and the newest prefix match is what the next run
# restores. Entries the prefix no longer matches are evicted by GitHub's LRU.
name: sccache start
description: Install sccache, restore this component's disk cache, export the CMake compiler launcher.
inputs:
  component:
    description: What is being compiled (llvm, llvm-tuple, runtime, windows-runtime, srcbuild). Names the cache and the report.
    required: true
  platform:
    description: LLVM platform or target key the objects are for; part of the cache key.
    required: true
  pin:
    description: Pin string the objects depend on (LLVM_SHA, RUNTIME_REF, ...); part of the cache key.
    required: true
  cache-size:
    description: SCCACHE_CACHE_SIZE for this component's disk cache.
    required: false
    default: 2G
  sccache-version:
    description: sccache release tag to install.
    required: false
    default: v0.18.0
outputs:
  restored-key:
    description: The actions/cache key that was restored, empty on a cold cache.
    value: ${{ steps.restore.outputs.cache-matched-key }}
  primary-key:
    description: The key this run's cache will be saved under.
    value: ${{ steps.restore.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: ${{ inputs.sccache-version }}
        disable_annotations: 'true'

    - name: Configure sccache disk cache and CMake launcher
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        PLATFORM: ${{ inputs.platform }}
        PIN: ${{ inputs.pin }}
        CACHE_SIZE: ${{ inputs.cache-size }}
      run: |
        set -euo pipefail
        test -n "$SCCACHE_PATH"
        case "$COMPONENT$PLATFORM$PIN" in *[!A-Za-z0-9_.-]*) echo "::error::sccache component/platform/pin must be [A-Za-z0-9_.-]: '$COMPONENT' '$PLATFORM' '$PIN'"; exit 1;; esac
        dir="$RUNNER_TEMP/sccache-$COMPONENT"
        mkdir -p "$dir"
        {
          echo "SCCACHE_DIR=$dir"
          echo "SCCACHE_CACHE_SIZE=$CACHE_SIZE"
          echo "SCCACHE_IDLE_TIMEOUT=0"
          echo "SCCACHE_GHA_ENABLED=false"
          echo "SCCACHE_LOG=warn"
          echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-$COMPONENT-error.log"
          echo "CMAKE_C_COMPILER_LAUNCHER=$SCCACHE_PATH"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=$SCCACHE_PATH"
          echo "CJCJ_SCCACHE_COMPONENT=$COMPONENT"
          echo "CJCJ_SCCACHE_PLATFORM=$PLATFORM"
        } >> "$GITHUB_ENV"

    - name: Restore sccache disk cache
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/sccache-${{ inputs.component }}
        key: sccache-${{ inputs.component }}-${{ inputs.platform }}-${{ inputs.pin }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          sccache-${{ inputs.component }}-${{ inputs.platform }}-${{ inputs.pin }}-
          sccache-${{ inputs.component }}-${{ inputs.platform }}-

    - name: Start sccache server on the restored cache
      shell: bash
      env:
        RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        PRIMARY_KEY: ${{ steps.restore.outputs.cache-primary-key }}
        SCCACHE_DIR: ${{ runner.temp }}/sccache-${{ inputs.component }}
        SCCACHE_CACHE_SIZE: ${{ inputs.cache-size }}
        SCCACHE_IDLE_TIMEOUT: '0'
        SCCACHE_GHA_ENABLED: 'false'
        SCCACHE_LOG: warn
        SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache-${{ inputs.component }}-error.log
      run: |
        set -euo pipefail
        {
          echo "SCCACHE_RESTORED_KEY=$RESTORED_KEY"
          echo "CJCJ_SCCACHE_KEY=$PRIMARY_KEY"
        } >> "$GITHUB_ENV"
        "$SCCACHE_PATH" --stop-server >/dev/null 2>&1 || true
        "$SCCACHE_PATH" --start-server
        "$SCCACHE_PATH" --zero-stats >/dev/null
        if [ -n "$RESTORED_KEY" ]; then
          echo "sccache: warm start, restored $RESTORED_KEY"
        else
          echo "sccache: cold start, no entry matched sccache-${{ inputs.component }}-${{ inputs.platform }}-"
        fi
        "$SCCACHE_PATH" --show-stats | grep -E '^(Cache location|Cache size|Max cache size|Version)'
